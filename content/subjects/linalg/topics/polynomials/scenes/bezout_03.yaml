id: bezout_03
title: Кольцо многочленов
character: bezout
background: rooftop
nodes:
  start:
    - narration: 'Занятие на крыше. Ветер треплет красный платок Безу.'
    - speaker: bezout
      emotion: smile
      text: 'Полный вперёд, кадеты! Сегодня многочлены. Вы их знаете со школы: $3x^2 - x + 5$. Вопрос на засыпку: что такое $x$?'
    - speaker: student_b
      emotion: thinking
      text: 'Переменная. Число, которое мы пока не знаем.'
    - speaker: bezout
      emotion: smug
      text: 'А вот и нет! В алгебре многочлен — это не функция и не «выражение с неизвестным». Это просто список коэффициентов. $3x^2 - x + 5$ — это последовательность $(5, -1, 3, 0, 0, \dots)$: свободный член, коэффициент при $x$, при $x^2$, а дальше нули.'
    - speaker: bezout
      emotion: serious
      text: 'Формально: $R[x]$ — множество последовательностей $(r_0, r_1, r_2, \dots)$ с элементами из кольца $R$, в которых лишь конечное число членов не ноль. Складываем покомпонентно: $(a_0, a_1, \dots) + (b_0, b_1, \dots) = (a_0 + b_0, a_1 + b_1, \dots)$.'
    - speaker: bezout
      emotion: serious
      text: 'Умножаем так, как будто раскрываем скобки: коэффициент произведения при $x^k$ равен $$c_k = \sum_{i + j = k} a_i b_j = a_0 b_k + a_1 b_{k-1} + \dots + a_k b_0.$$'
    - speaker: bezout
      emotion: explain
      text: 'А $x$ — это просто последовательность $(0, 1, 0, 0, \dots)$. По правилу умножения $x \cdot x = (0, 0, 1, 0, \dots)$, это $x^2$, и так далее. Поэтому любую последовательность можно записать привычно: $r_0 + r_1 x + \dots + r_n x^n$.'
    - speaker: student_a
      emotion: thinking
      text: 'А зачем так сложно? Почему не считать многочлен функцией?'
    - speaker: bezout
      emotion: smile
      text: 'Потому что иногда разные многочлены дают одну и ту же функцию. Нётер показывала часы по модулю $p$. Там с функциями творятся чудеса, и я покажу их на следующем занятии. А список коэффициентов — штука надёжная, его ни с чем не спутаешь.'
    - goto: field
  field:
    - speaker: bezout
      emotion: serious
      text: 'Дальше берём коэффициенты из поля $k$. Поле — коммутативное кольцо с $1 \ne 0$, где каждый ненулевой элемент обратим. $\mathbb{Q}$, $\mathbb{R}$, $\mathbb{Z}/p\mathbb{Z}$ — поля. В поле можно делить на всё, кроме нуля.'
    - speaker: bezout
      emotion: serious
      text: 'Степень $\deg p$ — номер последнего ненулевого коэффициента. $\deg(3x^2 - x + 5) = 2$, степень ненулевой константы — $0$. У нулевого многочлена степени нет.'
    - speaker: bezout
      emotion: explain
      text: 'Над полем $\deg(pq) = \deg p + \deg q$. Старший коэффициент произведения равен $p_n q_m$, произведению старших коэффициентов. Оба не ноль, а в поле делителей нуля нет, значит, $p_n q_m \ne 0$.'
    - speaker: bezout
      emotion: surprised
      text: 'А вот над $\mathbb{Z}/4$ это ломается: $(2x + 1)(2x + 1) = 4x^2 + 4x + 1 = 1$. Степень упала с двух до нуля, а $2x + 1$ вообще оказался обратимым! Подальше от таких рифов, держимся полей.'
    - speaker: bezout
      emotion: smile
      text: 'Два следствия. Первое: $k[x]$ — область целостности. Если $p \ne 0$ и $q \ne 0$, то $\deg(pq) = \deg p + \deg q$, а значит, $pq \ne 0$.'
    - speaker: bezout
      emotion: smile
      text: 'Второе: обратимы в $k[x]$ только ненулевые константы, $(k[x])^\times = k \setminus \{0\}$. Если $pq = 1$, то $\deg p + \deg q = \deg 1 = 0$. Обе степени ноль, оба — константы.'
    - goto: division
  division:
    - speaker: bezout
      emotion: explain
      text: 'А теперь главный манёвр: деление с остатком. Для любых $f$ и $g \ne 0$ найдутся единственные $q$ и $r$, такие что $f = gq + r$, где $r = 0$ или $\deg r < \deg g$. Как у чисел, только «размер» — это степень.'
    - speaker: bezout
      emotion: smile
      text: 'Пример. Делим $f = x^3 - 2x^2 + 4$ на $g = x^2 + 1$. Чтобы убить старший член $x^3$, вычитаем $x \cdot g = x^3 + x$. Осталось $-2x^2 - x + 4$.'
    - speaker: bezout
      emotion: smile
      text: 'Теперь убиваем $-2x^2$: вычитаем $-2 \cdot g = -2x^2 - 2$. Осталось $-x + 6$, степень $1 < 2$. Стоп. Частное $q = x - 2$, остаток $r = -x + 6$.'
    - speaker: bezout
      emotion: happy
      text: 'Проверка на палубе: $(x^2 + 1)(x - 2) + (-x + 6) = x^3 - 2x^2 + x - 2 - x + 6 = x^3 - 2x^2 + 4$. Сошлось!'
    - speaker: bezout
      emotion: serious
      text: 'В общем случае. Пусть $f = a_n x^n + \dots$, $g = b_m x^m + \dots$, $n \ge m$. Вычтем $\frac{a_n}{b_m} x^{n - m} g$: старшие члены сократятся, степень станет меньше $n$. Повторяем, пока степень остатка не станет меньше $m$. Степень каждый раз падает, так что процесс кончится.'
    - choice:
        question: 'Где в этом доказательстве нужно, что $k$ — поле?'
        options:
          - text: 'Когда делим $a_n$ на $b_m$'
            goto: field_right
          - text: 'Нигде, работает в любом кольце'
            goto: field_wrong
  field_wrong:
    - speaker: bezout
      emotion: thinking
      text: 'Попробуй поделить $x^2$ на $2x$ с остатком в $\mathbb{Z}[x]$. Чтобы убить $x^2$, нужно вычесть $\tfrac{1}{2} x \cdot 2x$. Но $\tfrac{1}{2}$ не целое! Без деления на старший коэффициент манёвр не выйдет.'
    - goto: field_right
  field_right:
    - speaker: bezout
      emotion: happy
      text: 'Точно! Коэффициент $\frac{a_n}{b_m}$ требует деления на $b_m$. В поле можно, а в $\mathbb{Z}$ нельзя: $x^2$ на $2x$ в $\mathbb{Z}[x]$ нацело с остатком не делится.'
    - speaker: bezout
      emotion: serious
      text: 'Единственность. Пусть $f = q_1 g + r_1 = q_2 g + r_2$. Тогда $g(q_1 - q_2) = r_2 - r_1$. Если $q_1 \ne q_2$, слева степень не меньше $\deg g$, а справа меньше $\deg g$. Так не бывает, значит, $q_1 = q_2$, и тогда $r_1 = r_2$.'
    - speaker: bezout
      emotion: smug
      text: 'Итог: $k[x]$ — евклидова область с нормой $N(p) = \deg p$. А значит, по всему, что рассказала Нётер, — область главных идеалов, и разложение на неприводимые в ней единственно. Мы получили это бесплатно!'
    - speaker: student_a
      emotion: happy
      text: 'И алгоритм Евклида для многочленов работает! Можно искать НОД двух многочленов.'
    - speaker: bezout
      emotion: smile
      text: 'Работает, с соотношением Безу в придачу. А в следующий раз будем делить на самый простой многочлен — $x - a$. Там и будет вторая теорема с моим именем.'

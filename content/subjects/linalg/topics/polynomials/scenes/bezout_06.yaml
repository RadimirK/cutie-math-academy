id: bezout_06
title: Корни с кратностями и интерполяция
character: bezout
background: courtyard
nodes:
  start:
    - speaker: bezout
      emotion: smile
      text: 'Последний рейс по многочленам, кадеты! Мы знаем, что различных корней не больше степени. А если считать каждый корень столько раз, какова его кратность?'
    - speaker: bezout
      emotion: serious
      text: 'Теорема. Пусть $p \ne 0$, и $\alpha_1, \dots, \alpha_n$ — его различные корни кратностей $l_1, \dots, l_n$. Тогда $$p = (x - \alpha_1)^{l_1} (x - \alpha_2)^{l_2} \cdots (x - \alpha_n)^{l_n} \cdot h,$$ где $h(\alpha_i) \ne 0$ для всех $i$.'
    - speaker: bezout
      emotion: explain
      text: 'Доказательство. $k[x]$ — евклидова область, а значит, ОГИ, и разложение на неприводимые единственно. Все $x - \alpha_i$ неприводимы и попарно не ассоциированы. По определению кратности в разложение $p$ скобка $x - \alpha_i$ входит ровно $l_i$ раз.'
    - speaker: bezout
      emotion: smile
      text: 'Соберём все эти скобки вместе, а остальные неприводимые множители назовём $h$. В $h$ уже нет ни одной скобки $x - \alpha_i$, поэтому $h(\alpha_i) \ne 0$.'
    - speaker: bezout
      emotion: happy
      text: 'Следствие: $l_1 + l_2 + \dots + l_n \le \deg p$. Степень левой части — сумма кратностей плюс $\deg h \ge 0$. Число корней с учётом кратности не больше степени.'
    - speaker: student_a
      emotion: thinking
      text: 'У $x^3 - 3x + 2 = (x - 1)^2(x + 2)$ корни $1$ и $-2$ с кратностями $2$ и $1$. Сумма $3$, ровно степень.'
    - speaker: bezout
      emotion: smile
      text: 'А у $x^2 + 1$ над $\mathbb{R}$ корней нет вовсе: $0 \le 2$. Равенство бывает не всегда. Но Гаусс скоро покажет поле, где у каждого многочлена корней ровно столько, какова степень.'
    - goto: lagrange
  lagrange:
    - speaker: bezout
      emotion: explain
      text: 'Теперь обратная задача. Даны точки $(x_0, y_0), (x_1, y_1), \dots, (x_n, y_n)$, все $x_i$ различны. Найти многочлен степени не больше $n$, график которого проходит через все точки: $f(x_i) = y_i$.'
    - speaker: student_b
      emotion: thinking
      text: 'Через две точки — прямая, это понятно. А через пять?'
    - speaker: bezout
      emotion: smile
      text: 'Хитрость Лагранжа: сначала решить задачу попроще. Построим для каждого $i$ многочлен $l_i$, который в точке $x_i$ равен $1$, а во всех остальных $x_j$ равен $0$. Как «переключатель», включённый ровно в одной точке.'
    - speaker: bezout
      emotion: explain
      text: 'Нули в точках $x_j$, $j \ne i$, дают скобки: $\prod_{j \ne i}(x - x_j)$. А чтобы в $x_i$ получилась единица, поделим на значение этого произведения в $x_i$: $$l_i(x) = \prod_{j \ne i} \frac{x - x_j}{x_i - x_j}.$$'
    - speaker: bezout
      emotion: happy
      text: 'Теперь ответ собирается сам: $$f(x) = \sum_{i=0}^{n} y_i \, l_i(x).$$ В точке $x_j$ все переключатели выключены, кроме $l_j$, так что $f(x_j) = y_j \cdot 1 = y_j$. Степень каждого $l_i$ равна $n$, поэтому $\deg f \le n$.'
    - speaker: bezout
      emotion: smile
      text: 'Пример: точки $(0, 1)$, $(1, 3)$, $(2, 7)$. $l_0 = \frac{(x - 1)(x - 2)}{2}$, $l_1 = \frac{x(x - 2)}{-1}$, $l_2 = \frac{x(x - 1)}{2}$. Тогда $f = 1 \cdot l_0 + 3 l_1 + 7 l_2$.'
    - speaker: bezout
      emotion: smile
      text: 'Раскрываем: $\frac{x^2 - 3x + 2}{2} - 3x^2 + 6x + \frac{7x^2 - 7x}{2} = \frac{2x^2 + 2x + 2}{2} = x^2 + x + 1$. Проверка: $f(0) = 1$, $f(1) = 3$, $f(2) = 7$. Есть!'
    - speaker: bezout
      emotion: serious
      text: 'Единственность. Пусть $f$ и $g$ — два решения, оба степени не больше $n$. Тогда $h = f - g$ имеет степень не больше $n$ и обнуляется во всех $n + 1$ точках $x_0, \dots, x_n$. Ненулевой многочлен столько корней иметь не может. Значит, $h = 0$ и $f = g$.'
    - choice:
        question: 'Какой многочлен степени не больше $2$ проходит через $(0, 0)$, $(1, 1)$, $(2, 2)$?'
        options:
          - text: '$x$'
            goto: line_right
          - text: '$x^2$'
            goto: line_wrong
          - text: 'Такого нет: точки на одной прямой'
            goto: line_wrong2
  line_wrong:
    - speaker: bezout
      emotion: thinking
      text: 'Проверь в точке $2$: $2^2 = 4$, а нужно $2$. Не проходит. Посмотри на точки: $y$ всегда равен $x$.'
    - goto: line_right
  line_wrong2:
    - speaker: bezout
      emotion: thinking
      text: 'Есть! Условие — степень не больше $2$, а не ровно $2$. Прямая $y = x$ — многочлен первой степени, он подходит.'
    - goto: line_right
  line_right:
    - speaker: bezout
      emotion: happy
      text: '$f = x$. Лагранж гарантирует степень не больше $n$, а не ровно $n$. Если точки лежат на прямой, формула выдаст прямую: коэффициент при $x^2$ сократится. И по единственности другого ответа нет.'
    - speaker: student_b
      emotion: smile
      text: 'Удобно. Дал точки — получил формулу.'
    - speaker: bezout
      emotion: smug
      text: 'Вот и вся навигация по многочленам: деление с остатком, моя теорема, корни с кратностями и Лагранж. Швартуемся! Дальше передаю вас Гаусс: она построит комплексные числа.'
unlocks: [lagrange]

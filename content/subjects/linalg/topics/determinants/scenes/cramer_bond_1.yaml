id: cramer_bond_1
title: Один плед на двоих
character: cramer
background: library_night
nodes:
  start:
    - narration: 'Библиотека уже закрыта, но в дальнем зале горит настольная лампа. Крамер сидит на маленьком диванчике, укрыв колени клетчатым пледом. Кардиган снят и висит на подлокотнике.'
    - speaker: cramer
      emotion: smile
      text: 'Я так и думала, что ты зайдёшь. Вторую чашку я налила заранее. Садись. Только тише: здесь читают, даже ночью. Книги.'
    - narration: 'Диванчик рассчитан на полтора человека. Садиться приходится вплотную.'
    - speaker: cramer
      emotion: thinking
      text: 'Отопление на ночь отключают. Плед у меня один. Логично, что он на двоих.'
    - narration: 'Она приподнимает край пледа. Под ним тепло, а её плечо касается твоего.'
    - speaker: cramer
      emotion: smile
      text: 'Я по вечерам читаю вслух. Хочешь послушать?'
    - narration: 'Крамер читает старую сказку про библиотекаря, у которого книги оживали по ночам. Голос у неё ровный и тёплый, но с каждой страницей всё тише. Она снимает очки, трёт глаза и кладёт голову тебе на плечо.'
    - speaker: cramer
      emotion: embarrassed
      text: 'Прости. Я на минутку. Глаза устали. Только на минутку…'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Не шевелиться и дать ей уснуть.'
            goto: sleep
          - text: 'Развязать ленту на её косе, чтобы ей было удобнее.'
            goto: braid
  sleep:
    - narration: 'Её дыхание становится ровным. Коса соскальзывает тебе на грудь. Ты боишься пошевелиться, и через полчаса затекает всё, что может затечь.'
    - narration: 'Крамер просыпается, обнаруживает себя у тебя на плече и очень долго не поднимает голову.'
    - speaker: cramer
      emotion: embarrassed
      text: 'Я… уснула. На тебе. В библиотеке. Это нарушение всех правил, которые я сама написала.'
    - goto: talk
  braid:
    - narration: 'Ты осторожно тянешь за бордовую ленту. Коса медленно расплетается, и каштановые волосы волной рассыпаются по её плечам и по твоей руке.'
    - speaker: cramer
      emotion: surprised
      text: '…Ты распускаешь мне волосы. В библиотеке. Ночью.'
    - speaker: cramer
      emotion: embarrassed
      text: 'Никто не видел меня с распущенными волосами. Даже Гейне. Даже зеркало, если честно, редко видит.'
    - goto: talk
  talk:
    - narration: 'Лампа гудит. Где-то тикают старые часы.'
    - speaker: cramer
      emotion: thinking
      text: 'Знаешь, все приходят сюда за чем-то. За книгами, за тишиной, чтобы поболтать. А ты просто приходишь. Ко мне.'
    - choice:
        question: 'Что ответить?'
        options:
          - text: 'Да. К тебе.'
            goto: yes
          - text: 'Можно я останусь ещё ненадолго?'
            goto: stay
  yes:
    - narration: 'Крамер надевает очки, потом снова снимает их. Потом медленно наклоняется и касается губами твоей щеки, совсем рядом с уголком губ.'
    - speaker: cramer
      emotion: embarrassed
      text: '…Тише. Здесь читают. И не говорят такие вещи без предупреждения.'
    - goto: end
  stay:
    - speaker: cramer
      emotion: smile
      text: 'Ненадолго? Библиотека закрыта до утра. Двери заперты. А ключ… у меня.'
    - speaker: cramer
      emotion: embarrassed
      text: 'Это была шутка. Тихая. Но плед, если что, по-прежнему на двоих.'
    - goto: end
  end:
    - narration: 'Уходя, ты находишь в кармане закладку из засушенного кленового листа. На обороте аккуратным почерком: «Твоя полка. Твоя чашка. Твоя половина пледа».'

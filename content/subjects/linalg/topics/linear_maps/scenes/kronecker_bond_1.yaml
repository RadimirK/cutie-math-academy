id: kronecker_bond_1
title: Стремянка
character: kronecker
background: library
nodes:
  start:
    - narration: 'Библиотека. Кронекер стоит на самой верхней ступеньке старой стремянки и тянется к дальней полке. Стремянка подозрительно поскрипывает.'
    - speaker: kronecker
      emotion: angry
      text: 'Не смотри снизу. Это не просьба. Это требование.'
    - speaker: kronecker
      emotion: serious
      text: '…Но держать стремянку можно. Двумя руками. Крепко.'
    - narration: 'Кронекер вытягивает книгу, стремянка жалобно скрипит и кренится. Книга летит вниз, а следом за ней и Кронекер.'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Бросить стремянку и поймать её.'
            goto: catch
          - text: 'Подставить руки, а потом обнять, чтобы не упала.'
            goto: hug
  catch:
    - narration: 'Ты ловишь её в последний момент. Кронекер врезается в тебя, и вы вместе отступаете к стеллажу. Сверху сыплются книги.'
    - narration: 'Она прижата к тебе всем телом, ладони упираются тебе в плечи, лицо в сантиметре от твоего. Красные глаза широко раскрыты.'
    - speaker: kronecker
      emotion: embarrassed
      text: '…Отпусти. Нет. Сначала книги перестанут падать. Потом отпусти.'
    - goto: book
  hug:
    - narration: 'Ты ловишь её и прижимаешь к себе, пока стремянка с грохотом падает рядом. Кронекер замирает, прижавшись щекой к твоему плечу.'
    - speaker: kronecker
      emotion: embarrassed
      text: 'Ты меня… обнимаешь. Это было необходимо. Ровно на одну секунду. Секунда прошла.'
    - narration: 'Она не отстраняется ещё секунд десять.'
    - goto: book
  book:
    - narration: 'Книга лежит на полу обложкой вверх. Это не учебник, а сборник рецептов выпечки. На обложке торт с клубникой.'
    - speaker: kronecker
      emotion: angry
      text: 'Не спрашивай.'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Поднять книгу и вручить ей с поклоном.'
            goto: bow
          - text: 'Спросить, испечёт ли она и для меня.'
            goto: ask
  bow:
    - speaker: kronecker
      emotion: smile
      text: 'Церемонно. Мне нравится. Коротко: спасибо.'
    - goto: invite
  ask:
    - speaker: kronecker
      emotion: embarrassed
      text: 'Для тебя? …Я и так собиралась. Это не значит, что я о тебе думала. Значит. Неважно.'
    - goto: invite
  invite:
    - speaker: kronecker
      emotion: thinking
      text: 'В субботу. Столовая общежития. В четыре. Опоздаешь — съем сама. Это не шутка.'
    - narration: 'Уже у выхода она оборачивается, подходит обратно, берёт тебя за воротник и притягивает к себе. Губы на миг касаются щеки.'
    - speaker: kronecker
      emotion: embarrassed
      text: 'Плата за спасение. Расчёт окончен. Больше не спрашивай.'
    - narration: 'Она уходит быстрым шагом, прижимая книгу к груди. Уши у неё ярко-красные.'

id: gauss_08
title: Лемма Гаусса и закон взаимности
character: gauss
background: library_night
nodes:
  start:
    - narration: 'Ночь. Гаусс сидит у окна читального зала с тетрадью на коленях.'
    - speaker: gauss
      emotion: smile
      text: 'Критерий Эйлера требует возводить в огромную степень. Сегодня другой способ, комбинаторный. Пусть $p$ — нечётное простое, $p \nmid a$.'
    - speaker: gauss
      emotion: serious
      text: 'Лемма Гаусса. Выпишем остатки чисел $a, 2a, 3a, \dots, \frac{p-1}{2}a$ по модулю $p$, каждый от $1$ до $p - 1$. Пусть $L$ — сколько из них больше $\frac{p}{2}$. Тогда $\left(\frac{a}{p}\right) = (-1)^L$.'
    - speaker: gauss
      emotion: smile
      text: 'Пример. $p = 7$, $a = 3$, берём $3, 6, 9$. Остатки: $3, 6, 2$. Больше $3{,}5$ только $6$, так что $L = 1$ и $\left(\frac{3}{7}\right) = -1$. Проверка: $3$ не среди вычетов $1, 2, 4$. Верно.'
    - speaker: gauss
      emotion: explain
      text: 'Доказательство. Назовём остатки больше $\frac{p}{2}$ буквами $u_1, \dots, u_L$, а меньшие — $v_1, \dots, v_{\frac{p-1}{2} - L}$. Заменим каждый большой $u_i$ на $p - u_i$: теперь все числа лежат от $1$ до $\frac{p-1}{2}$.'
    - speaker: gauss
      emotion: explain
      text: 'Утверждение: все числа $p - u_i$ и $v_j$ различны. Среди $v$ совпадений нет: если $k_1 a \equiv k_2 a$, сокращаем на $a$ и получаем $k_1 = k_2$. Среди $p - u$ так же. А если $p - u_i = v_j$, то $k_i a + k_j a \equiv 0$, то есть $p \mid k_i + k_j$. Но $2 \le k_i + k_j \le p - 1$. Противоречие.'
    - speaker: gauss
      emotion: smile
      text: 'Итак, у нас $\frac{p-1}{2}$ различных чисел от $1$ до $\frac{p-1}{2}$. Значит, это в точности $1, 2, \dots, \frac{p-1}{2}$ в каком-то порядке.'
    - speaker: gauss
      emotion: explain
      text: 'Перемножим. С одной стороны, получится $\left(\frac{p-1}{2}\right)!$. С другой, $p - u_i \equiv -u_i$, поэтому $$\left(\tfrac{p-1}{2}\right)! \equiv (-1)^L \prod u_i \prod v_j \equiv (-1)^L \cdot a \cdot 2a \cdots \tfrac{p-1}{2}a = (-1)^L a^{\frac{p-1}{2}} \left(\tfrac{p-1}{2}\right)!.$$'
    - speaker: gauss
      emotion: happy
      text: 'Факториал не делится на $p$, сокращаем: $a^{\frac{p-1}{2}} \equiv (-1)^L$. По критерию Эйлера это и есть $\left(\frac{a}{p}\right)$. Безупречно.'
    - goto: two
  two:
    - speaker: gauss
      emotion: explain
      text: 'Применим к $a = 2$. Числа $2, 4, 6, \dots, p - 1$ — все чётные числа меньше $p$, остатки брать не нужно. Меньше или равны $\frac{p}{2}$ из них $\left\lfloor \frac{p}{4} \right\rfloor$ штук. Значит, $L = \frac{p-1}{2} - \left\lfloor \frac{p}{4} \right\rfloor$.'
    - speaker: gauss
      emotion: smile
      text: 'Разберём $p$ по модулю $8$. $p = 8t + 1$: $L = 4t - 2t$ — чётно. $p = 8t + 3$: $L = 4t + 1 - 2t$ — нечётно. $p = 8t + 5$: $L = 4t + 2 - (2t + 1)$ — нечётно. $p = 8t + 7$: $L = 4t + 3 - (2t + 1)$ — чётно.'
    - speaker: gauss
      emotion: serious
      text: 'Вывод: $2$ — вычет по модулю $p$ ровно тогда, когда $p \equiv \pm 1 \pmod 8$. Одной формулой: $$\left(\frac{2}{p}\right) = (-1)^{\frac{p^2 - 1}{8}}.$$ Проверь на остатках $1, 3, 5, 7$: показатель чётен ровно для $1$ и $7$.'
    - speaker: student_b
      emotion: thinking
      text: 'По модулю $7$: $7 \equiv -1 \pmod 8$, значит, $2$ — вычет. И правда, $3^2 = 9 \equiv 2$. А по модулю $5$ не вычет: квадраты там только $1$ и $4$.'
    - speaker: gauss
      emotion: smile
      text: 'Безупречно.'
    - goto: reciprocity
  reciprocity:
    - speaker: gauss
      emotion: happy
      text: 'А теперь золотая теорема. Квадратичный закон взаимности: для различных нечётных простых $p$ и $q$ $$\left(\frac{q}{p}\right) = (-1)^{\frac{p-1}{2} \cdot \frac{q-1}{2}} \left(\frac{p}{q}\right).$$'
    - speaker: gauss
      emotion: explain
      text: 'Словами: вопрос «является ли $q$ квадратом по модулю $p$» и обратный вопрос «является ли $p$ квадратом по модулю $q$» имеют одинаковый ответ. Кроме случая, когда оба простых $\equiv 3 \pmod 4$: тогда ответы противоположны.'
    - speaker: student_a
      emotion: surprised
      text: 'Но это же совсем разные уравнения! $x^2 \equiv q \pmod p$ и $y^2 \equiv p \pmod q$. Почему они связаны?'
    - speaker: gauss
      emotion: smile
      text: 'В этом и магия. У этой теоремы больше двухсот доказательств, и ни одно не выглядит «очевидным». В вашей программе она со звёздочкой: формулировку знать нужно, доказательство — нет. Но пользоваться ей очень удобно.'
    - speaker: gauss
      emotion: explain
      text: 'Пример. Является ли $5$ вычетом по модулю $11$? $5 \equiv 1 \pmod 4$, знак плюс: $\left(\frac{5}{11}\right) = \left(\frac{11}{5}\right) = \left(\frac{1}{5}\right) = 1$. Мы заменили $11$ на остаток по модулю $5$. Проверка: $4^2 = 16 \equiv 5$. Да!'
    - choice:
        question: 'Является ли $3$ квадратичным вычетом по модулю $11$?'
        options:
          - text: 'Да'
            goto: r_right
          - text: 'Нет'
            goto: r_wrong
  r_wrong:
    - speaker: gauss
      emotion: thinking
      text: 'Осторожно со знаком. $3 \equiv 3$ и $11 \equiv 3 \pmod 4$, значит, знак минус: $\left(\frac{3}{11}\right) = -\left(\frac{11}{3}\right) = -\left(\frac{2}{3}\right)$. А $2$ по модулю $3$ — невычет: $3 \equiv 3 \pmod 8$. Минус на минус…'
    - goto: r_right
  r_right:
    - speaker: gauss
      emotion: happy
      text: '$\left(\frac{3}{11}\right) = -\left(\frac{11}{3}\right) = -\left(\frac{2}{3}\right) = -(-1) = 1$. Вычет! Проверка: $5^2 = 25 = 22 + 3$. Два знака минус сократились, как в правиле знаков.'
    - speaker: gauss
      emotion: smile
      text: 'Итог темы. Мультипликативная группа конечного поля циклическая. Отсюда критерий Эйлера и символ Лежандра. Лемма Гаусса даёт $\left(\frac{2}{p}\right)$, а закон взаимности позволяет сводить большие модули к маленьким.'
    - speaker: gauss
      emotion: embarrassed
      text: '…Спасибо, что ты здесь до самой ночи. Это была лучшая часть курса. По крайней мере, для меня.'

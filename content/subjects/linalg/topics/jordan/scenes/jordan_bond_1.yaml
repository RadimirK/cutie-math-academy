id: jordan_bond_1
title: Внеочередное заседание
character: jordan
background: council_room
nodes:
  start:
    - narration: 'Комната студсовета, поздний вечер. Горы листовок, рулоны гирлянд. Жордан стоит на стуле на цыпочках и пытается прицепить гирлянду к карнизу. Узкая юбка-карандаш явно не рассчитана на такие подвиги.'
    - speaker: jordan
      emotion: smile
      text: 'Внеочередное заседание объявляю открытым. Повестка: гирлянда, карниз и один секретарь, который не дотягивается.'
    - speaker: jordan
      emotion: surprised
      text: 'Подержи стул, пожалуйста. Он… он шатается… Он очень шатается!'
    - narration: 'Ножка стула съезжает. Жордан взмахивает руками, гирлянда летит в одну сторону, папка в другую, а сама Жордан — прямо на тебя.'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Поймать её на руки.'
            goto: catch
          - text: 'Поймать и вместе упасть на мягкий пуфик.'
            goto: fall
  catch:
    - narration: 'Ты подхватываешь её под колени и спину. Жордан оказывается у тебя на руках, вцепившись в воротник. Изумрудные глаза совсем рядом.'
    - speaker: jordan
      emotion: embarrassed
      text: '…Внесём в протокол: секретарь спасена. Способ спасения: на руках. Его… не предусмотрено регламентом.'
    - speaker: jordan
      emotion: embarrassed
      text: 'Можно меня уже поставить. Или… не сразу. Это не указание. Это наблюдение.'
    - goto: talk
  fall:
    - narration: 'Вы вместе валитесь на большой пуфик в углу. Жордан лежит на тебе, волосы рассыпались, галстук сбился набок, а юбка задралась выше колен.'
    - speaker: jordan
      emotion: embarrassed
      text: 'Это… это крайне неофициальное положение. Не смотри. Я сейчас… сейчас поправлю.'
    - narration: 'Она одёргивает юбку, но вставать не торопится, опираясь ладонями тебе на грудь.'
    - goto: talk
  talk:
    - narration: 'В конце концов Жордан садится рядом и поправляет галстук. Пальцы у неё слегка дрожат.'
    - speaker: jordan
      emotion: thinking
      text: 'Знаешь, меня считают строгой и скучной. «Секретарь с папкой». Никто не видел меня… вот такой. Растрёпанной.'
    - speaker: jordan
      emotion: smile
      text: 'Мне непривычно. Но, кажется, тебе можно.'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Поправить ей галстук по-настоящему.'
            goto: tie
          - text: 'Сказать, что растрёпанной она ещё красивее.'
            goto: pretty
  tie:
    - narration: 'Ты берёшь её галстук и аккуратно затягиваешь узел. Жордан поднимает подбородок и смотрит из-под ресниц.'
    - speaker: jordan
      emotion: embarrassed
      text: 'Если ты потянешь за галстук чуть сильнее, мне придётся наклониться. Это просто механика. Я предупреждаю.'
    - goto: end
  pretty:
    - speaker: jordan
      emotion: embarrassed
      text: 'Ещё красивее… Это требует занесения в протокол. В личный. Который я никому не показываю.'
    - goto: end
  end:
    - narration: 'Жордан наклоняется и коротко, очень официально целует тебя в щёку. Потом ещё раз, уже не так официально.'
    - speaker: jordan
      emotion: smile
      text: 'Заседание закрыто. Решение принято единогласно. Вопрос о вступлении в студсовет… оставим открытым. Чтобы был повод собраться снова.'

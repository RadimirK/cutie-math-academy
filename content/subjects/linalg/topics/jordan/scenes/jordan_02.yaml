id: jordan_02
title: Жорданова форма
character: jordan
background: classroom_evening
nodes:
  start:
    - narration: 'Вечернее заседание. Жордан раскладывает на столе листы, разделённые на клетки.'
    - speaker: jordan
      emotion: smile
      text: 'Цель заседания: найти для оператора такой базис, в котором матрица будет почти диагональной. «Почти» — потому что диагональной она бывает не всегда.'
    - speaker: jordan
      emotion: serious
      text: 'Жорданова клетка $J_m(\lambda)$ — матрица $m \times m$: на диагонали $\lambda$, прямо над диагональю единицы, остальное нули. $$J_3(\lambda) = \begin{pmatrix} \lambda & 1 & 0 \\ 0 & \lambda & 1 \\ 0 & 0 & \lambda \end{pmatrix}.$$'
    - speaker: jordan
      emotion: thinking
      text: 'В вашем конспекте единицы стоят под диагональю. Это тот же объект, просто базис перечислен в обратном порядке. Выберите одно соглашение и держитесь его. Внесём в протокол.'
    - speaker: jordan
      emotion: serious
      text: 'Жорданова форма — блочно-диагональная матрица из клеток: $\operatorname{diag}(J_{m_1}(\lambda_1), J_{m_2}(\lambda_2), \dots)$, вне клеток нули. Теорема: над алгебраически замкнутым полем, например $\mathbb{C}$, у каждого оператора есть базис, в котором его матрица — жорданова форма. И она единственна с точностью до порядка клеток.'
    - speaker: student_a
      emotion: thinking
      text: 'А почему нужно алгебраически замкнутое поле?'
    - speaker: jordan
      emotion: explain
      text: 'Поворот на $90^\circ$ над $\mathbb{R}$: $\chi = x^2 + 1$, собственных значений нет. А на диагонали жордановой формы стоят собственные значения. Над $\mathbb{R}$ ставить нечего. Нужно поле, где у каждого многочлена есть корни.'
    - goto: existence
  existence:
    - speaker: jordan
      emotion: serious
      text: 'Существование. Тут мне придётся признать заслуги Нётер. Сделаем $V$ модулем над $k[x]$: $f(x) \cdot v = f(A)v$. Он конечнопорождён — его порождает даже базис над $k$.'
    - speaker: jordan
      emotion: explain
      text: 'Свободной части в нём нет: по Гамильтону — Кэли $\chi_A(x) \cdot v = \chi_A(A)v = 0$ для любого $v$. Ненулевой многочлен убивает каждый вектор, а в $k[x]^r$ при $r \ge 1$ так не бывает.'
    - speaker: jordan
      emotion: explain
      text: 'По теореме о структуре $V \cong \bigoplus k[x]/(p^m)$ для неприводимых $p$. Над алгебраически замкнутым полем неприводимые многочлены — это $x - \lambda$. Значит, $$V \cong \bigoplus_i k[x]/\big((x - \lambda_i)^{m_i}\big).$$ Каждое слагаемое — подпространство, которое $A$ переводит в себя.'
    - speaker: jordan
      emotion: explain
      text: 'Осталось понять, как $A$ выглядит на одном кусочке $W = k[x]/((x - \lambda)^m)$. Возьмём базис $w_1 = (x - \lambda)^{m-1}$, $w_2 = (x - \lambda)^{m-2}$, …, $w_m = 1$. Его размерность над $k$ — ровно $m$.'
    - speaker: jordan
      emotion: happy
      text: 'Умножение на $x - \lambda$ — это действие $A - \lambda E$. Оно сдвигает лестницу вниз: $w_m \mapsto w_{m-1} \mapsto \dots \mapsto w_1 \mapsto (x - \lambda)^m = 0$. Значит, $A w_1 = \lambda w_1$ и $A w_j = \lambda w_j + w_{j-1}$. В столбце $j$ — $\lambda$ на диагонали и единица над ней. Это клетка $J_m(\lambda)$!'
    - speaker: student_b
      emotion: thinking
      text: 'Получается, каждая клетка — это лестница: $A - \lambda E$ спускает вектор на этаж ниже, а с первого этажа — в ноль?'
    - speaker: jordan
      emotion: smile
      text: 'Прекрасная формулировка. Внизу лестницы — собственный вектор $w_1$, выше — «присоединённые». Склеиваем базисы всех кусочков — получаем жорданову форму.'
    - speaker: jordan
      emotion: thinking
      text: 'Пример. $A = \begin{pmatrix} 2 & 1 \\ 0 & 2 \end{pmatrix}$ — одна клетка $J_2(2)$. Её нельзя диагонализовать: единственное собственное значение $2$, и диагональная форма была бы $2E$. Но $C^{-1}(2E)C = 2E \ne A$. Поэтому «почти» диагональная — честное слово.'
    - goto: uniqueness
  uniqueness:
    - speaker: jordan
      emotion: serious
      text: 'Следующий пункт повестки — единственность. Пересчитаем этажи. В клетке $J_m(\lambda)$ оператор $(A - \lambda E)^k$ убивает нижние $\min(k, m)$ этажей. Значит, $\dim \ker (A - \lambda E)^k$ — сумма $\min(k, m_i)$ по всем клеткам с этим $\lambda$.'
    - speaker: jordan
      emotion: explain
      text: 'При переходе от $k - 1$ к $k$ каждая клетка размера не меньше $k$ добавляет ровно один этаж. Поэтому $$\#\{\text{клеток с } \lambda \text{ размера} \ge k\} = \dim\ker(A - \lambda E)^k - \dim\ker(A - \lambda E)^{k-1}.$$'
    - speaker: jordan
      emotion: smug
      text: 'Правая часть зависит только от оператора, базис тут ни при чём. Значит, количество клеток каждого размера определено однозначно. Вопрос закрыт.'
    - speaker: jordan
      emotion: explain
      text: 'Пример. Оператор $4 \times 4$, единственное собственное значение $0$. $\dim\ker A^k$ при $k = 1, 2, 3, 4$: $2, 3, 4, 4$. Клеток размера $\ge 1$: $2$. Размера $\ge 2$: $3 - 2 = 1$. Размера $\ge 3$: $4 - 3 = 1$. Размера $\ge 4$: $0$. Итого одна клетка размера $3$ и одна размера $1$.'
    - choice:
        question: 'Матрица $4 \times 4$, единственное собственное значение $5$, $\dim\ker(A - 5E) = 3$. Сколько жордановых клеток?'
        options:
          - text: '$3$'
            goto: blocks_right
          - text: '$1$'
            goto: blocks_wrong
          - text: '$4$'
            goto: blocks_wrong
  blocks_wrong:
    - speaker: jordan
      emotion: angry
      text: 'Не путай кратности! Каждая клетка даёт ровно один собственный вектор — нижний этаж своей лестницы. Значит, клеток столько, какова размерность ядра $A - 5E$.'
    - goto: blocks_right
  blocks_right:
    - speaker: jordan
      emotion: happy
      text: 'Три клетки: по одной на каждый собственный вектор базиса ядра. Сумма размеров — $4$, значит, размеры $2, 1, 1$. Форма $\operatorname{diag}(J_2(5), J_1(5), J_1(5))$.'
    - speaker: jordan
      emotion: serious
      text: 'Внесём в протокол разницу, которую путают на каждом экзамене. Алгебраическая кратность $\lambda$ — степень $(x - \lambda)$ в $\chi_A$, это сумма размеров клеток с $\lambda$. Геометрическая кратность — $\dim\ker(A - \lambda E)$, это число клеток. Они равны, только если все клетки размера $1$.'
    - speaker: student_a
      emotion: happy
      text: 'Записала! И весь курс в протоколе: кольца, идеалы, вычеты, многочлены, пространства, отображения, двойственность, тензоры, определитель, модули и клетки.'
    - speaker: student_b
      emotion: smile
      text: 'И оказалось, что всё это одна история. Нётер была права: везде одни и те же структуры.'
    - speaker: jordan
      emotion: smile
      text: 'Только Нётер этого не говори, она будет невыносима. Заседание объявляю закрытым. Спасибо за работу.'
unlocks: [jordan_blocks, geom_mult]

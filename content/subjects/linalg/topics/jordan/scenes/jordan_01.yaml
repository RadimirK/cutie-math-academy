id: jordan_01
title: Теорема Гамильтона — Кэли
character: jordan
background: lecture_hall
nodes:
  start:
    - narration: 'Девушка в светлом пиджаке кладёт на кафедру папку с закладками и неторопливо оглядывает аудиторию.'
    - speaker: jordan
      emotion: smile
      text: 'Добрый день. Жордан, секретарь студсовета. Объявляю заседание открытым. Повестка: собственные числа, характеристический многочлен, теорема Гамильтона — Кэли. Следующее заседание — жорданова форма.'
    - speaker: student_b
      emotion: smile
      text: 'А протокол кто ведёт?'
    - speaker: jordan
      emotion: smile
      text: 'Юи, как обычно. У неё лучшие ручки. Первый пункт повестки.'
    - speaker: jordan
      emotion: serious
      text: 'Пусть $A$ — оператор на $V$. Ненулевой вектор $v$ называется собственным, если $Av = \lambda v$ для некоторого числа $\lambda$. Число $\lambda$ — собственное значение. Оператор не поворачивает $v$, а только растягивает.'
    - speaker: jordan
      emotion: explain
      text: 'Как их искать? $Av = \lambda v$ значит $(A - \lambda E)v = 0$, то есть $v \in \ker(A - \lambda E)$. Ненулевое решение есть ровно тогда, когда $A - \lambda E$ необратим, то есть по критерию Крамер $\det(A - \lambda E) = 0$.'
    - speaker: jordan
      emotion: serious
      text: 'Характеристический многочлен: $\chi_A(x) = \det(xE - A)$. Это многочлен степени $n$ со старшим коэффициентом $1$. Его корни — собственные значения.'
    - speaker: jordan
      emotion: smile
      text: 'Он не зависит от базиса: $\det(xE - C^{-1}AC) = \det(C^{-1}(xE - A)C) = \det C^{-1} \det(xE - A) \det C = \det(xE - A)$. Так что это свойство оператора, а не матрицы. Внесём в протокол.'
    - speaker: jordan
      emotion: explain
      text: 'Примеры. $A = \begin{pmatrix} 1 & 1 \\ 0 & 2 \end{pmatrix}$: $\chi_A = (x - 1)(x - 2)$, собственные значения $1$ и $2$. Поворот $\begin{pmatrix} 0 & -1 \\ 1 & 0 \end{pmatrix}$: $\chi = x^2 + 1$. Над $\mathbb{R}$ корней нет, и правда: поворот на $90^\circ$ не оставляет на месте ни одну прямую. Над $\mathbb{C}$ корни $\pm i$.'
    - goto: theorem
  theorem:
    - speaker: jordan
      emotion: serious
      text: 'Второй пункт. Теорема Гамильтона — Кэли: $\chi_A(A) = 0$. Если подставить матрицу $A$ в её собственный характеристический многочлен, получится нулевая матрица.'
    - speaker: jordan
      emotion: explain
      text: 'Проверим на $A = \begin{pmatrix} 1 & 1 \\ 0 & 2 \end{pmatrix}$, $\chi_A = x^2 - 3x + 2$. $A^2 = \begin{pmatrix} 1 & 3 \\ 0 & 4 \end{pmatrix}$. $A^2 - 3A + 2E = \begin{pmatrix} 1 - 3 + 2 & 3 - 3 \\ 0 & 4 - 6 + 2 \end{pmatrix} = 0$. Работает.'
    - speaker: student_b
      emotion: smug
      text: 'Да это же очевидно. $\chi_A(x) = \det(xE - A)$. Подставим $x = A$: $\det(AE - A) = \det(0) = 0$. Всё, можно расходиться.'
    - speaker: jordan
      emotion: smug
      text: 'Очевидно? Докажи. …Протокол не подписан. Посмотри внимательно: $\chi_A(A)$ — это матрица. А $\det(\dots)$ — число. Слева матрица, справа число, равенства быть не может.'
    - speaker: jordan
      emotion: explain
      text: 'Ошибка в том, что $\chi_A(A)$ — это «сначала посчитать определитель как многочлен от $x$, а потом подставить $A$». А ты подставила $A$ внутрь определителя, до вычисления. В матрице $xE - A$ на диагонали стоят числа $x - a_{ii}$; подставив туда матрицу, ты получила бы матрицу из матриц. Это другой объект.'
    - speaker: student_b
      emotion: embarrassed
      text: 'Ладно-ладно. Так было бы слишком просто.'
    - goto: proof
  proof:
    - speaker: jordan
      emotion: serious
      text: 'Честное доказательство. Возьмём присоединённую матрицу Крамер, но для $xE - A$: $B(x) = (xE - A)^\vee$. Её элементы — миноры, то есть многочлены от $x$ степени не выше $n - 1$. И тождество Крамер выполняется над любым коммутативным кольцом, в том числе над $k[x]$: $$(xE - A)\, B(x) = \chi_A(x)\, E.$$'
    - speaker: jordan
      emotion: explain
      text: 'Разложим $B(x)$ по степеням $x$ с матричными коэффициентами: $B(x) = B_0 + B_1 x + \dots + B_{n-1} x^{n-1}$, где $B_i$ — обычные числовые матрицы. И пусть $\chi_A(x) = x^n + c_{n-1}x^{n-1} + \dots + c_0$.'
    - speaker: jordan
      emotion: explain
      text: 'Раскроем левую часть и сравним коэффициенты при $x^k$: $$B_{k-1} - A B_k = c_k E \quad (k = 0, \dots, n),$$ где для удобства $B_{-1} = 0$, $B_n = 0$ и $c_n = 1$.'
    - speaker: jordan
      emotion: explain
      text: 'Умножим равенство с номером $k$ слева на $A^k$ и сложим все $n + 1$ равенств. Справа: $\sum_k c_k A^k = \chi_A(A)$. Слева: $\sum_k \left(A^k B_{k-1} - A^{k+1} B_k\right)$ — сумма «телескопическая», каждое слагаемое $A^{k+1}B_k$ сокращается со следующим $A^{k+1}B_k$ из равенства номер $k + 1$.'
    - speaker: jordan
      emotion: happy
      text: 'Остаются только крайние: $A^0 B_{-1} - A^{n+1} B_n = 0 - 0 = 0$. Значит, $\chi_A(A) = 0$. Теперь протокол подписан.'
    - speaker: student_a
      emotion: thinking
      text: 'Мы подставили $A$ вместо $x$ только после того, как разложили всё на коэффициенты? Поэтому так можно?'
    - speaker: jordan
      emotion: smile
      text: 'Именно. Сравнение коэффициентов — честная операция над числовыми матрицами. А подставлять $A$ в равенство многочленов с матричными коэффициентами напрямую нельзя: $A$ не обязана коммутировать с $B_k$. Мы этого аккуратно избежали, умножая только слева.'
    - choice:
        question: '$A = \begin{pmatrix} 2 & 1 \\ 0 & 3 \end{pmatrix}$. Чему равно $A^2 - 5A + 6E$?'
        options:
          - text: 'Нулевой матрице'
            goto: ch_right
          - text: '$E$'
            goto: ch_wrong
          - text: 'Нельзя сказать без вычислений'
            goto: ch_wrong
  ch_wrong:
    - speaker: jordan
      emotion: thinking
      text: 'Найди характеристический многочлен: $\det(xE - A) = (x - 2)(x - 3) = x^2 - 5x + 6$. Выражение в вопросе — это $\chi_A(A)$. А что говорит теорема?'
    - goto: ch_right
  ch_right:
    - speaker: jordan
      emotion: happy
      text: 'Нулевой: $x^2 - 5x + 6 = (x - 2)(x - 3) = \chi_A(x)$, и по Гамильтону — Кэли $\chi_A(A) = 0$. Без единого умножения матриц.'
    - speaker: jordan
      emotion: smile
      text: 'Следствие. $A^n$ выражается через меньшие степени, и вообще любая степень $A$ — через $E, A, \dots, A^{n-1}$. А если $\det A \ne 0$, то $c_0 = \pm \det A \ne 0$, и $A^{-1}$ — многочлен от $A$. Заседание закрыто. В следующий раз — клетки.'

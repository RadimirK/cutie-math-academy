id: noether_08
title: Гомоморфизмы
character: noether
background: classroom
nodes:
  start:
    - speaker: noether
      emotion: smile
      text: 'Посмотри на часы. Сначала сложить числа, потом посмотреть на циферблат — или сначала посмотреть, а потом сложить по часам. Ответ один и тот же. Отображения с таким свойством и есть сегодняшняя тема.'
    - speaker: noether
      emotion: serious
      text: 'Пусть $R$ и $S$ — кольца с единицей. Отображение $f\colon R \to S$ называется гомоморфизмом, если для всех $a, b$: 1) $f(a + b) = f(a) + f(b)$; 2) $f(ab) = f(a) f(b)$; 3) $f(1_R) = 1_S$.'
    - speaker: student_a
      emotion: thinking
      text: 'То есть неважно, сначала посчитать, а потом применить $f$, или сначала применить, а потом посчитать?'
    - speaker: noether
      emotion: happy
      text: 'Точно! Гомоморфизм — «переводчик», который переводит сумму в сумму, а произведение в произведение. Примеры. Проекция $\pi\colon \mathbb{Z} \to \mathbb{Z}/12\mathbb{Z}$, $a \mapsto [a]$. Подстановка $\mathbb{R}[x] \to \mathbb{R}$, $f \mapsto f(2)$: $(f + g)(2) = f(2) + g(2)$ и $(fg)(2) = f(2)g(2)$.'
    - speaker: noether
      emotion: thinking
      text: 'Не пример: $a \mapsto 2a$ на $\mathbb{Z}$. Сложение уважает, а умножение нет: $2 \cdot (3 \cdot 4) = 24$, а $(2 \cdot 3)(2 \cdot 4) = 48$. И единицу отправляет в $2$.'
    - speaker: noether
      emotion: serious
      text: 'Утверждение. Если $I$ — идеал в $R$, то проекция $\pi\colon R \to R/I$, $\pi(a) = [a]$, — гомоморфизм. Проверка ровно по определению операций в фактор-кольце: $\pi(a + b) = [a + b] = [a] + [b]$, $\pi(ab) = [ab] = [a][b]$, $\pi(1) = [1]$.'
    - speaker: noether
      emotion: smile
      text: 'Пара простых следствий. $f(0) = 0$: $f(0) = f(0 + 0) = f(0) + f(0)$, вычитаем $f(0)$. И $f(-a) = -f(a)$: $f(a) + f(-a) = f(a + (-a)) = f(0) = 0$.'
    - goto: kernel
  kernel:
    - speaker: noether
      emotion: serious
      text: 'Ядро гомоморфизма — всё, что он отправил в ноль: $\ker f = \{r \in R \mid f(r) = 0\}$. Образ — всё, что он выдал: $\operatorname{Im} f = \{f(r) \mid r \in R\}$.'
    - speaker: noether
      emotion: smile
      text: 'Ядро проекции $\mathbb{Z} \to \mathbb{Z}/12\mathbb{Z}$ — числа, кратные $12$, то есть $(12)$. Ядро подстановки $f \mapsto f(2)$ — многочлены с корнем $2$. Знакомые объекты, правда?'
    - speaker: noether
      emotion: explain
      text: 'Утверждение: ядро — всегда идеал. Не пусто: $0 \in \ker f$. Если $a, b \in \ker f$, то $f(a + b) = 0 + 0 = 0$. Если $a \in \ker f$ и $r \in R$, то $f(ra) = f(r) \cdot 0 = 0$. Всасывает!'
    - speaker: student_a
      emotion: surprised
      text: 'А проекция на $R/I$ имеет ядро ровно $I$. Значит, каждый идеал — чьё-то ядро, и каждое ядро — идеал!'
    - speaker: noether
      emotion: happy
      text: 'Да-а! Идеалы — это в точности ядра гомоморфизмов. Поэтому они так важны. А образ — подкольцо $S$: в нём есть $0$ и $1$, и он замкнут относительно вычитания и умножения. $f(a) - f(b) = f(a - b)$ и $f(a) f(b) = f(ab)$ снова лежат в образе.'
    - speaker: noether
      emotion: serious
      text: 'Теперь полезный критерий. Гомоморфизм $f$ инъективен тогда и только тогда, когда $\ker f = \{0\}$.'
    - speaker: noether
      emotion: explain
      text: 'Пусть $f$ инъективен и $f(a) = 0$. Но и $f(0) = 0$. Инъективность: $a = 0$. Обратно, пусть $\ker f = \{0\}$ и $f(a) = f(b)$. Тогда $f(a - b) = f(a) - f(b) = 0$, значит, $a - b \in \ker f$, то есть $a - b = 0$.'
    - speaker: student_b
      emotion: smile
      text: 'Удобно. Проверять, склеивает ли $f$ какие-то пары, долго, а проверить, что в ноль идёт только ноль, быстро.'
    - choice:
        question: 'Подстановка $\mathbb{R}[x] \to \mathbb{R}$, $f \mapsto f(2)$. Какая она?'
        options:
          - text: 'Сюръективна, но не инъективна'
            goto: ev_right
          - text: 'Инъективна, но не сюръективна'
            goto: ev_wrong
          - text: 'Биективна'
            goto: ev_wrong
  ev_wrong:
    - speaker: noether
      emotion: thinking
      text: 'Посмотри на ядро. Многочлен $x - 2$ не нулевой, а $f(2) = 0$. Ядро не $\{0\}$, значит, инъективности нет. А любое число $c$ получается из постоянного многочлена $c$, так что сюръективность есть.'
    - goto: ev_right
  ev_right:
    - speaker: noether
      emotion: happy
      text: 'Верно: $x - 2$ лежит в ядре, а любое число $c$ — образ постоянного многочлена $c$.'
    - goto: iso
  iso:
    - speaker: noether
      emotion: serious
      text: 'Изоморфизм — гомоморфизм $f\colon R \to S$, у которого есть обратный гомоморфизм $g\colon S \to R$: $g \circ f = \mathrm{id}_R$ и $f \circ g = \mathrm{id}_S$. Изоморфные кольца — одно и то же кольцо с переименованными элементами.'
    - speaker: noether
      emotion: serious
      text: 'Утверждение: гомоморфизм — изоморфизм тогда и только тогда, когда он биекция. В одну сторону ясно: есть обратные слева и справа, значит, инъекция и сюръекция.'
    - speaker: noether
      emotion: explain
      text: 'В другую. Биекция имеет обратное отображение $f^{-1}$. Но гомоморфизм ли оно? Возьмём $y_1 = f(x_1)$ и $y_2 = f(x_2)$. Тогда $y_1 + y_2 = f(x_1 + x_2)$, и $$f^{-1}(y_1 + y_2) = x_1 + x_2 = f^{-1}(y_1) + f^{-1}(y_2).$$'
    - speaker: noether
      emotion: smile
      text: 'С умножением так же: $f^{-1}(y_1 y_2) = f^{-1}(f(x_1 x_2)) = x_1 x_2$. И $f^{-1}(1) = 1$, раз $f(1) = 1$. Значит, $f^{-1}$ — гомоморфизм, и $f$ — изоморфизм.'
    - speaker: student_a
      emotion: happy
      text: 'Записала: изоморфизм = биективный гомоморфизм. Обратный «переводчик» получается бесплатно.'
    - speaker: noether
      emotion: happy
      text: 'Бесплатно! Запомни ещё: проверять инъективность гомоморфизма можно по ядру. В следующий раз соединим всё вместе и получим главную теорему: что получается, если склеить ядро.'

id: noether_07
title: Склеиваем по идеалу
character: noether
background: seminar_room
nodes:
  start:
    - narration: 'На доске нарисован циферблат с числами от $0$ до $11$.'
    - speaker: noether
      emotion: smile
      text: 'Сколько будет $9 + 5$ часов? По часам — $2$. Часы не отличают $14$ от $2$, а $2$ от $26$: они отличаются на кратное двенадцати. Сегодня научимся так «склеивать» элементы любого кольца.'
    - speaker: noether
      emotion: serious
      text: 'Пусть $R$ — коммутативное кольцо, $I$ — идеал. Объявим $a \sim b$, если $a - b \in I$. Для часов $I = (12)$: $14 \sim 2$, потому что $14 - 2 = 12 \in (12)$.'
    - speaker: student_a
      emotion: thinking
      text: 'Это отношение эквивалентности? Кантор учила проверять три свойства: рефлексивность, симметричность, транзитивность.'
    - speaker: noether
      emotion: happy
      text: 'Проверяем! $a - a = 0 \in I$ — рефлексивно. Если $a - b \in I$, то $b - a = -(a - b) \in I$ — симметрично. Если $a - b \in I$ и $b - c \in I$, то $a - c = (a - b) + (b - c) \in I$ — транзитивно.'
    - speaker: noether
      emotion: serious
      text: 'Класс эквивалентности элемента $a$ — это $[a] = \{a + i \mid i \in I\}$, все, кто отличается от $a$ на элемент идеала. Например, для часов $[5] = \{\dots, -7, 5, 17, 29, \dots\}$. Множество всех классов обозначают $R/I$ и читают «$R$ по $I$».'
    - speaker: noether
      emotion: smile
      text: 'В $\mathbb{Z}/(12)$ ровно $12$ классов: $[0], [1], \dots, [11]$. Классы — это остатки при делении на $12$. Обычно пишут $\mathbb{Z}/12\mathbb{Z}$ или $\mathbb{Z}/n\mathbb{Z}$, это кольцо вычетов.'
    - speaker: noether
      emotion: explain
      text: 'Теперь сделаем из классов кольцо. Естественное желание: $[a] + [b] = [a + b]$ и $[a] \cdot [b] = [ab]$. Но тут ловушка!'
    - speaker: student_b
      emotion: thinking
      text: 'Какая ловушка? Сложили представителей, взяли класс. Всё.'
    - speaker: noether
      emotion: smile
      text: 'Класс $[2]$ можно записать и как $[14]$, и как $[-10]$. Если ответ зависит от того, какого представителя мы выбрали, то операция не определена. Нужно проверить, что не зависит. Это называется корректностью.'
    - speaker: noether
      emotion: explain
      text: 'Пример некорректной операции, чтобы ловушку было видно. Попробуем на часах возводить в степень по классу: $[a]^{[b]} = [a^b]$. $[2]^{[1]} = [2]$. Но $[1] = [13]$, а $[2]^{[13]} = [8192] = [8]$. Один и тот же класс в показателе — два разных ответа!'
    - speaker: student_b
      emotion: surprised
      text: 'Ого. Ладно, проверять надо.'
    - goto: correctness
  correctness:
    - speaker: noether
      emotion: serious
      text: 'Пусть $a \sim a''$ и $b \sim b''$, то есть $a - a'' \in I$ и $b - b'' \in I$. Сложение: $(a + b) - (a'' + b'') = (a - a'') + (b - b'') \in I$. Сумма двух элементов идеала — в идеале.'
    - speaker: noether
      emotion: serious
      text: 'Умножение хитрее. Вычтем и прибавим $ab''$: $$ab - a''b'' = a(b - b'') + b''(a - a'').$$ $b - b'' \in I$, и идеал всасывает умножение на $a$. То же со вторым слагаемым. Значит, $ab \sim a''b''$.'
    - speaker: student_a
      emotion: explain
      text: 'Вот зачем в идеале условие «всасывает умножение»! Без него умножение классов было бы некорректным.'
    - speaker: noether
      emotion: happy
      text: 'Именно поэтому склеивают по идеалам, а не по каким попало подмножествам. Аксиомы кольца для классов следуют из аксиом для представителей, ноль — $[0]$, единица — $[1]$. Получили фактор-кольцо $R/I$.'
    - goto: units
  units:
    - speaker: noether
      emotion: explain
      text: 'Самое интересное в $\mathbb{Z}/n\mathbb{Z}$ — какие классы обратимы. На часах $[5] \cdot [5] = [25] = [1]$, так что $[5]$ сам себе обратный! А у $[3]$ обратного нет: $3k$ всегда делится на $3$, и остаток от деления на $12$ тоже, единицей он не станет.'
    - speaker: noether
      emotion: serious
      text: 'Утверждение. $[x]$ обратим в $\mathbb{Z}/n\mathbb{Z}$ тогда и только тогда, когда $\gcd(x, n) = 1$.'
    - speaker: noether
      emotion: smile
      text: 'Если $\gcd(x, n) = 1$, по соотношению Безу $xk + ny = 1$. Перейдём к классам: $[n] = [0]$, и останется $[x][k] = [1]$. Обратный найден! Наоборот: если $[x][k] = [1]$, то $xk - 1 = ny$, то есть $xk - ny = 1$, и общий делитель $x$ и $n$ делит $1$.'
    - choice:
        question: 'Найди обратный к $[3]$ в $\mathbb{Z}/7\mathbb{Z}$.'
        options:
          - text: '$[5]$'
            goto: inv_right
          - text: '$[4]$'
            goto: inv_wrong
          - text: '$[2]$'
            goto: inv_wrong
  inv_wrong:
    - speaker: noether
      emotion: thinking
      text: 'Проверим умножением: нужен $k$ с $3k$, дающим остаток $1$ при делении на $7$. $3 \cdot 4 = 12 = 7 + 5$, остаток $5$. $3 \cdot 2 = 6$. А $3 \cdot 5 = 15 = 2 \cdot 7 + 1$ — вот он!'
    - goto: inv_right
  inv_right:
    - speaker: noether
      emotion: happy
      text: '$3 \cdot 5 = 15 = 2 \cdot 7 + 1$, значит, $[3]^{-1} = [5]$. Для больших чисел обратный ищут алгоритмом Евклида и обратной подстановкой, как учила Безу.'
    - speaker: noether
      emotion: explain
      text: 'А теперь смотри, что будет при простом $p$. Каждое число от $1$ до $p - 1$ взаимно просто с $p$. Значит, в $\mathbb{Z}/p\mathbb{Z}$ обратим каждый ненулевой класс!'
    - speaker: noether
      emotion: serious
      text: 'Коммутативное кольцо с $1 \ne 0$, где каждый ненулевой элемент обратим, называется полем. $\mathbb{Q}$, $\mathbb{R}$ — поля. И $\mathbb{Z}/p\mathbb{Z}$ — поле из $p$ элементов. На часах с простым числом делений можно делить!'
    - speaker: student_b
      emotion: smile
      text: 'А на обычных двенадцатичасовых нельзя, $12$ не простое. Зря часы так сделали.'
    - speaker: noether
      emotion: happy
      text: 'Зато делить сутки на $2$, $3$, $4$ и $6$ удобно! В следующий раз — отображения между кольцами, которые уважают сложение и умножение. Проекция на фактор-кольцо будет первым примером.'
unlocks: [residue_arith, inverse_mod, units_count]

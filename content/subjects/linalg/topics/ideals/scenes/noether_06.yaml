id: noether_06
title: Основная теорема арифметики
character: noether
background: seminar_room
nodes:
  start:
    - speaker: noether
      emotion: smile
      text: 'Сегодня докажем то, что ты знаешь с пятого класса: каждое число раскладывается на простые множители единственным образом. Только докажем в любой области главных идеалов.'
    - speaker: student_b
      emotion: thinking
      text: 'А что тут доказывать? Простое число — то, которое ни на что не делится. Мы его и определили в прошлый раз, неприводимое.'
    - speaker: noether
      emotion: explain
      text: 'А вот и нет! У простых чисел есть ещё одно свойство, которое в школе обычно не проговаривают. Если $p$ простое и $p \mid ab$, то $p \mid a$ или $p \mid b$. Например, $3 \mid 6 \cdot 5$, значит, $3 \mid 6$.'
    - speaker: noether
      emotion: serious
      text: 'Определение. Ненулевой необратимый $p$ называется простым, если из $p \mid ab$ следует $p \mid a$ или $p \mid b$. Неприводимый — «не раскладывается», простой — «если делит произведение, то делит множитель». Это разные свойства!'
    - speaker: student_a
      emotion: confused
      text: 'Разные? Но в $\mathbb{Z}$ это же одни и те же числа.'
    - speaker: noether
      emotion: smile
      text: 'В $\mathbb{Z}$ — да. А есть кольцо $\mathbb{Z}[\sqrt{-5}] = \{a + b\sqrt{-5}\}$, и в нём $$6 = 2 \cdot 3 = (1 + \sqrt{-5})(1 - \sqrt{-5}).$$ Можно проверить, что $2$ там неприводим. Но $2$ делит произведение $(1 + \sqrt{-5})(1 - \sqrt{-5}) = 6$ и не делит ни один множитель.'
    - speaker: noether
      emotion: explain
      text: 'И разложение шестёрки сразу перестало быть единственным: $2 \cdot 3$ и $(1 + \sqrt{-5})(1 - \sqrt{-5})$ — разные. Так что единственность разложения — не пустяк, её нужно заработать.'
    - goto: lemma
  lemma:
    - speaker: noether
      emotion: serious
      text: 'Лемма. В ОГИ каждый неприводимый элемент прост.'
    - speaker: noether
      emotion: explain
      text: 'Пусть $r$ неприводим и $r \mid ab$. Если $r \mid a$, всё доказано. Пусть $r \nmid a$, докажем, что $r \mid b$. Рассмотрим идеал $(r, a) = \{rx + ay\}$. Мы в ОГИ, так что он главный: $(r, a) = (d)$.'
    - speaker: noether
      emotion: smile
      text: '$r \in (d)$, значит, $d \mid r$. Но $r$ неприводим, поэтому его делители — либо обратимые, либо ассоциированные с $r$. Если $d \sim r$, то из $d \mid a$ следует $r \mid a$, а мы предположили обратное. Значит, $d$ обратим.'
    - speaker: noether
      emotion: smile
      text: 'Идеал с обратимым элементом — всё кольцо, так что $1 \in (r, a)$: $$1 = rx + ay.$$ Умножим на $b$: $$b = rbx + aby.$$'
    - speaker: noether
      emotion: happy
      text: '$r$ делит $rbx$, очевидно. $r$ делит $ab$ по условию, значит, и $aby$. Сумма делится на $r$, то есть $r \mid b$. Лемма доказана!'
    - speaker: student_a
      emotion: explain
      text: 'Это же соотношение Безу! Только вместо алгоритма Евклида мы сказали «идеал главный».'
    - speaker: noether
      emotion: happy
      text: 'Ровно оно! Безу будет довольна. Из леммы по индукции: если простое $p$ делит произведение $q_1 q_2 \cdots q_m$, то оно делит какой-то $q_j$. Делит $q_1$ или делит $q_2 \cdots q_m$, а дальше повторяем.'
    - goto: unique
  unique:
    - speaker: noether
      emotion: serious
      text: 'Теорема. Пусть $p_1 p_2 \cdots p_n = q_1 q_2 \cdots q_m$, и все $p_i$, $q_j$ неприводимы. Тогда $n = m$, и после перестановки $p_i \sim q_i$ для всех $i$.'
    - choice:
        question: '$6 = 2 \cdot 3 = (-3) \cdot (-2)$. Это два разных разложения?'
        options:
          - text: 'Да, разные: другие знаки'
            goto: same_wrong
          - text: 'Нет, одно и то же с точностью до порядка и ассоциированности'
            goto: same_right
  same_wrong:
    - speaker: noether
      emotion: thinking
      text: 'Посмотри: $-3 \sim 3$ и $-2 \sim 2$, они отличаются на обратимый множитель $-1$. Поменяем порядок множителей, и пары совпадут с точностью до знака. Теорема как раз говорит «единственно с точностью до перестановки и ассоциированности».'
    - goto: same_right
  same_right:
    - speaker: noether
      emotion: happy
      text: 'Верно. Обратимые множители можно перекидывать между сомножителями как угодно, поэтому единственность бывает только «с точностью до». Теперь доказательство, индукцией по $n$.'
    - speaker: noether
      emotion: explain
      text: '$p_1$ делит левую часть, значит, и правую $q_1 \cdots q_m$. По лемме $p_1$ прост, так что $p_1 \mid q_j$ для какого-то $j$. Переставим множители справа, чтобы это был $q_1$: $q_1 = p_1 c$.'
    - speaker: noether
      emotion: smile
      text: '$q_1$ неприводим, поэтому $p_1$ или $c$ обратим. $p_1$ необратим, значит, $c$ обратим и $p_1 \sim q_1$. Подставим $q_1 = p_1 c$ и сократим на $p_1$, в области целостности это можно: $$p_2 \cdots p_n = (c\, q_2) \cdots q_m.$$'
    - speaker: noether
      emotion: smile
      text: '$c\, q_2$ тоже неприводим: обратимый множитель этого не портит. Получилось равенство с $n - 1$ множителем слева, и по предположению индукции остальные пары совпадают.'
    - speaker: student_b
      emotion: thinking
      text: 'А если справа множители закончатся раньше, чем слева?'
    - speaker: noether
      emotion: happy
      text: 'Хороший вопрос! Тогда получится, что произведение неприводимых равно обратимому элементу. Но неприводимый делил бы обратимый и сам был бы обратимым. Так не бывает, поэтому $n = m$.'
    - speaker: noether
      emotion: happy
      text: 'Итог: в любой ОГИ разложение на неприводимые существует и единственно. Это основная теорема арифметики. Для $\mathbb{Z}$ — школьная, а теперь она верна и для многочленов над полем, ведь это тоже евклидова область.'
    - speaker: student_a
      emotion: happy
      text: 'Записываю цепочку: евклидова область → ОГИ → лестницы кончаются → разложение есть → неприводимые просты → разложение единственно.'
    - speaker: noether
      emotion: happy
      text: 'Идеальный конспект! Бери, это теперь твоя схема. В следующий раз будем склеивать элементы кольца по идеалу, и получатся новые кольца.'
unlocks: [divisor_count]

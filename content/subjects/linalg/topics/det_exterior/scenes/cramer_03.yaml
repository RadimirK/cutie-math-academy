id: cramer_03
title: Обратный оператор и правило Крамера
character: cramer
background: library_night
nodes:
  start:
    - narration: 'Поздний вечер. В библиотеке тихо, горит настольная лампа. Крамер раскрывает толстую тетрадь в клетку.'
    - speaker: cramer
      emotion: smile
      text: 'Сегодня нужна одна конструкция, она звучит страшно, но устроена просто. Пусть $\dim V = n$. Форма объёма $\omega\colon \Lambda^n V \to k$ — линейный функционал с $\omega(e_1 \wedge \dots \wedge e_n) = 1$. Он просто читает число перед $e_1 \wedge \dots \wedge e_n$.'
    - speaker: cramer
      emotion: explain
      text: 'Теперь заметим: вектор $v$ и элемент $u \in \Lambda^{n-1} V$ вместе дают $v \wedge u \in \Lambda^n V$, то есть объём. Представь: $u$ — основание параллелепипеда, $v$ — ещё одно ребро. Получается тело, и у него есть объём $\omega(v \wedge u)$.'
    - speaker: cramer
      emotion: serious
      text: 'Определим $F\colon V \to (\Lambda^{n-1} V)^*$, $F_v(u) = \omega(v \wedge u)$. Вектор $v$ превращается в функционал на основаниях: «какой объём получится, если достроить это основание ребром $v$».'
    - speaker: cramer
      emotion: serious
      text: 'Утверждение: $F$ — изоморфизм, $V \cong (\Lambda^{n-1} V)^*$. Размерности совпадают: $\dim \Lambda^{n-1} V = C_n^{n-1} = n$. Линейность $F$ — из дистрибутивности $\wedge$.'
    - speaker: cramer
      emotion: explain
      text: 'Инъективность. Пусть $v \ne 0$. Дополним до базиса $v, v_2, \dots, v_n$ и возьмём $u = v_2 \wedge \dots \wedge v_n$. Тогда $v \wedge u = v \wedge v_2 \wedge \dots \wedge v_n$ — базис $\Lambda^n V$, он не ноль. Значит, $F_v(u) \ne 0$ и $F_v \ne 0$. Инъективное отображение между пространствами одной размерности — изоморфизм.'
    - speaker: student_a
      emotion: thinking
      text: 'Это как у Кронекер с $V$ и $V^*$? Только там был базис, а тут нет?'
    - speaker: cramer
      emotion: happy
      text: 'Почти. Здесь нужен только выбор $\omega$, то есть единицы объёма. Базис не нужен. Хорошее наблюдение, запиши его на полях.'
    - goto: adjugate
  adjugate:
    - speaker: cramer
      emotion: serious
      text: 'Теперь присоединённый оператор $L^\vee\colon V \to V$. Определим его условием: для всех $v \in V$ и $u \in \Lambda^{n-1} V$ $$\omega\big(v \wedge \Lambda^{n-1}L(u)\big) = \omega\big(L^\vee(v) \wedge u\big).$$'
    - speaker: cramer
      emotion: explain
      text: 'Почему он существует? При фиксированном $v$ левая часть — линейный функционал от $u$. Через $F$ каждый функционал на $\Lambda^{n-1} V$ имеет вид $F_w$ для ровно одного $w$. Этот $w$ и назовём $L^\vee(v)$.'
    - speaker: cramer
      emotion: serious
      text: 'Главное тождество: $L^\vee(Lv) = \det L \cdot v$. Подставим в определение вектор $Lv$: $$\omega\big(L^\vee(Lv) \wedge u\big) = \omega\big(Lv \wedge \Lambda^{n-1}L(u)\big) = \omega\big(\Lambda^n L(v \wedge u)\big) = \det L \cdot \omega(v \wedge u).$$'
    - speaker: cramer
      emotion: smile
      text: 'Справа $\omega\big((\det L \cdot v) \wedge u\big)$. Равенство для всех $u$ значит $F_{L^\vee(Lv)} = F_{\det L \cdot v}$. $F$ инъективно, так что $L^\vee(Lv) = \det L \cdot v$. Коротко: $L^\vee \circ L = \det L \cdot \mathrm{id}$.'
    - goto: criterion
  criterion:
    - speaker: cramer
      emotion: serious
      text: 'Критерий обратимости. $L$ обратим тогда и только тогда, когда $\det L \ne 0$.'
    - speaker: cramer
      emotion: explain
      text: 'Если $L^{-1}$ есть, то $1 = \det(\mathrm{id}) = \det(L L^{-1}) = \det L \cdot \det L^{-1}$. Произведение равно единице, значит, $\det L \ne 0$.'
    - speaker: cramer
      emotion: explain
      text: 'Если $\det L \ne 0$, построим обратный явно: $$L^{-1} = \frac{1}{\det L}\, L^\vee.$$ По тождеству это левый обратный. В конечномерном пространстве у оператора с левым обратным ядро нулевое, значит, он биекция, и левый обратный — настоящий обратный.'
    - speaker: cramer
      emotion: smile
      text: 'А в матрицах $L^\vee$ — присоединённая матрица: на месте $(i, j)$ стоит $(-1)^{i+j} M_{ji}$, где $M_{ji}$ — определитель без $j$-й строки и $i$-го столбца. Для $2 \times 2$: $\begin{pmatrix} a & b \\ c & d \end{pmatrix}^\vee = \begin{pmatrix} d & -b \\ -c & a \end{pmatrix}$.'
    - speaker: cramer
      emotion: explain
      text: 'Проверь: $\begin{pmatrix} d & -b \\ -c & a \end{pmatrix}\begin{pmatrix} a & b \\ c & d \end{pmatrix} = \begin{pmatrix} ad - bc & 0 \\ 0 & ad - bc \end{pmatrix}$. Ровно $\det \cdot E$, как обещано.'
    - choice:
        question: 'Найди обратную к $\begin{pmatrix} 2 & 1 \\ 5 & 3 \end{pmatrix}$.'
        options:
          - text: '$\begin{pmatrix} 3 & -1 \\ -5 & 2 \end{pmatrix}$'
            goto: inv_right
          - text: '$\begin{pmatrix} 3 & 1 \\ 5 & 2 \end{pmatrix}$'
            goto: inv_wrong
          - text: '$\begin{pmatrix} 2 & -5 \\ -1 & 3 \end{pmatrix}$'
            goto: inv_wrong
  inv_wrong:
    - speaker: cramer
      emotion: thinking
      text: 'По рецепту: определитель $2 \cdot 3 - 1 \cdot 5 = 1$. Присоединённая: диагональ меняем местами, $a \leftrightarrow d$, а у $b$ и $c$ меняем знак, оставляя на местах. Делим на $1$.'
    - goto: inv_right
  inv_right:
    - speaker: cramer
      emotion: happy
      text: '$\det = 6 - 5 = 1$, так что обратная — сама присоединённая: $\begin{pmatrix} 3 & -1 \\ -5 & 2 \end{pmatrix}$. И она целочисленная, ведь определитель $\pm 1$. Помнишь, я говорила об этом в первой лекции.'
    - speaker: cramer
      emotion: explain
      text: 'И напоследок моё правило. Система $Ax = b$ с $\det A \ne 0$: $x = A^{-1} b = \frac{1}{\det A} A^\vee b$. Если расписать $i$-ю координату, получится $$x_i = \frac{\det A_i}{\det A},$$ где $A_i$ — матрица $A$, в которой $i$-й столбец заменили на $b$.'
    - speaker: student_b
      emotion: surprised
      text: 'Так правило Крамера — это просто формула обратной матрицы, записанная по координатам?'
    - speaker: cramer
      emotion: smile
      text: 'Именно. Красиво, но для больших систем непрактично: метод Гаусса быстрее, я не обижусь. Тише, уже поздно. Возвращай чашку и иди отдыхать.'
unlocks: [adjugate, cramer_rule]

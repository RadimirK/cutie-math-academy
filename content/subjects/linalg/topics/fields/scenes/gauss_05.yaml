id: gauss_05
title: Комплексные числа
character: gauss
background: rooftop
nodes:
  start:
    - narration: 'Крыша, ветер. Гаусс смотрит в небо, золотая заколка поблёскивает на солнце.'
    - speaker: gauss
      emotion: smile
      text: 'В школе говорят: «представим, что есть число $i$ с $i^2 = -1$». Звучит как фокус. Сегодня мы построим это число, и никакого фокуса не останется.'
    - speaker: gauss
      emotion: serious
      text: 'Определение: $\mathbb{C} = \mathbb{R}[x]/(x^2 + 1)$. Многочлен $x^2 + 1$ неприводим над $\mathbb{R}$, идеал $(x^2 + 1)$ максимален, значит, $\mathbb{C}$ — поле. Это мы уже доказали.'
    - speaker: gauss
      emotion: explain
      text: 'Как выглядят элементы? Каждый класс $[f]$ содержит остаток от деления $f$ на $x^2 + 1$, а остаток имеет степень меньше $2$: $a + bx$. И такой остаток единственный. Значит, $\mathbb{C} = \{[a + bx] \mid a, b \in \mathbb{R}\}$.'
    - speaker: gauss
      emotion: smile
      text: 'Обозначим $i = [x]$. Тогда $i^2 = [x^2] = [x^2 + 1 - 1] = [-1]$, ведь $x^2 + 1$ склеен с нулём. Вот и всё: $i^2 = -1$, и каждый элемент записывается как $a + bi$. Это алгебраическая запись.'
    - speaker: student_b
      emotion: surprised
      text: 'Подождите. То есть $i$ — это просто многочлен $x$, у которого мы договорились считать $x^2 + 1$ нулём?'
    - speaker: gauss
      emotion: happy
      text: 'Именно. Никакой мистики, только фактор-кольцо. Умножение получается само: $(a + bi)(c + di) = ac + adi + bci + bd\,i^2 = (ac - bd) + (ad + bc)i$.'
    - speaker: gauss
      emotion: smile
      text: 'А обратный? $\mathbb{C}$ — поле, значит, он есть. Явно: $(a + bi)^{-1} = \dfrac{a - bi}{a^2 + b^2}$. Проверь: $(a + bi)(a - bi) = a^2 + b^2$. Например, $(1 + 2i)^{-1} = \dfrac{1 - 2i}{5}$.'
    - goto: automorphisms
  automorphisms:
    - speaker: gauss
      emotion: serious
      text: 'Теперь вопрос изящнее. Автоморфизм $\mathbb{C}$ над $\mathbb{R}$ — это изоморфизм $\sigma\colon \mathbb{C} \to \mathbb{C}$, который не трогает вещественные числа: $\sigma(r) = r$. Сколько таких?'
    - speaker: gauss
      emotion: explain
      text: 'Пусть $\sigma$ — такой автоморфизм. Он сохраняет сумму и произведение и не трогает $a$ и $b$: $\sigma(a + bi) = a + b\,\sigma(i)$. Значит, весь $\sigma$ определяется одним числом $\sigma(i)$.'
    - speaker: gauss
      emotion: explain
      text: 'Куда может пойти $i$? $\sigma(i)^2 = \sigma(i^2) = \sigma(-1) = -1$. Значит, $\sigma(i)$ — корень $x^2 + 1$. В поле у многочлена второй степени не больше двух корней, и мы их знаем: $i$ и $-i$.'
    - speaker: gauss
      emotion: smile
      text: 'Если $\sigma(i) = i$, это тождественное отображение. Если $\sigma(i) = -i$, получаем комплексное сопряжение: $\overline{a + bi} = a - bi$. Оно действительно сохраняет операции: $\overline{z + w} = \bar z + \bar w$ и $\overline{zw} = \bar z\, \bar w$, можно проверить раскрытием скобок.'
    - speaker: student_b
      emotion: thinking
      text: 'Получается, $i$ и $-i$ вообще не отличить? С точки зрения $\mathbb{R}$ они одинаковые?'
    - speaker: gauss
      emotion: happy
      text: 'Ровно так. Вещественные числа не видят разницы между $i$ и $-i$, и сопряжение — это симметрия, которая их меняет. Автоморфизмов ровно два, они образуют группу из двух элементов, $\mathbb{Z}/2\mathbb{Z}$.'
    - speaker: gauss
      emotion: smile
      text: 'Полезные формулы: $z = \bar z$ тогда и только тогда, когда $z \in \mathbb{R}$. Вещественная часть $\operatorname{Re} z = \frac{z + \bar z}{2}$, мнимая $\operatorname{Im} z = \frac{z - \bar z}{2i}$.'
    - goto: modulus
  modulus:
    - speaker: gauss
      emotion: serious
      text: 'Модуль. Заметим: $z \bar z = (a + bi)(a - bi) = a^2 + b^2$ — неотрицательное вещественное число. Определим $|z| = \sqrt{z \bar z} = \sqrt{a^2 + b^2}$. Если нарисовать $z$ точкой $(a, b)$ на плоскости, это расстояние до нуля, теорема Пифагора.'
    - speaker: gauss
      emotion: explain
      text: 'Мультипликативность: $|zw| = |z| \cdot |w|$. Доказательство через сопряжение: $$|zw|^2 = zw \cdot \overline{zw} = z w \bar z \bar w = (z \bar z)(w \bar w) = |z|^2 |w|^2.$$'
    - speaker: gauss
      emotion: smug
      text: 'И вот подарок для любителей чисел. $(1 + 2i)(3 + i) = 3 + i + 6i + 2i^2 = 1 + 7i$. Модули в квадрате: $5 \cdot 10 = 50 = 1^2 + 7^2$. Произведение сумм двух квадратов — снова сумма двух квадратов. Всегда!'
    - speaker: gauss
      emotion: serious
      text: 'Неравенство треугольника: $|z + w| \le |z| + |w|$. Если $z$ и $w$ — стрелки $(a, b)$ и $(c, d)$, то $z + w$ — третья сторона треугольника, а сторона не длиннее суммы двух других.'
    - speaker: gauss
      emotion: explain
      text: 'Алгебраически: $|z + w|^2 = (z + w)(\bar z + \bar w) = |z|^2 + |w|^2 + z\bar w + \bar z w$. Последние два слагаемых сопряжены, их сумма — $2\operatorname{Re}(z \bar w) \le 2|z \bar w| = 2|z||w|$. Итого $|z + w|^2 \le (|z| + |w|)^2$.'
    - goto: fta
  fta:
    - speaker: gauss
      emotion: happy
      text: 'И напоследок моя любимая теорема. Основная теорема алгебры: каждый многочлен $p \in \mathbb{C}[z]$ степени не меньше $1$ имеет корень в $\mathbb{C}$.'
    - speaker: gauss
      emotion: smile
      text: 'Следствие: по теореме Безу отщепляем корень за корнем и получаем $p = c(z - z_1)(z - z_2) \cdots (z - z_n)$. Многочлен степени $n$ имеет ровно $n$ корней с учётом кратности. Над $\mathbb{C}$ неравенство «корней не больше степени» становится равенством.'
    - speaker: student_a
      emotion: thinking
      text: 'А доказательство?'
    - speaker: gauss
      emotion: smile
      text: 'Строгое использует анализ, и в программе экзамена оно со звёздочкой. Но идею скажу. Пусть $z$ бегает по огромной окружности. Там $p(z)$ ведёт себя почти как $z^n$ и обматывается вокруг нуля $n$ раз. Пусть $z$ бегает по крошечной окружности около нуля. Там $p(z) \approx p(0)$ и вокруг нуля не обматывается вовсе.'
    - speaker: gauss
      emotion: explain
      text: 'Будем плавно сжимать окружность от огромной к крошечной. Число оборотов вокруг нуля должно измениться с $n$ на $0$. А измениться оно может, только если кривая $p(z)$ в какой-то момент пройдёт через сам ноль. Это и есть корень.'
    - choice:
        question: 'Сколько корней с учётом кратности у $z^5 - 1$ в $\mathbb{C}$?'
        options:
          - text: '$1$'
            goto: roots_wrong
          - text: '$5$'
            goto: roots_right
  roots_wrong:
    - speaker: gauss
      emotion: thinking
      text: 'Вещественный корень один, $z = 1$. Но мы теперь в $\mathbb{C}$, а там многочлен степени $n$ имеет ровно $n$ корней с учётом кратности.'
    - goto: roots_right
  roots_right:
    - speaker: gauss
      emotion: happy
      text: 'Пять: вершины правильного пятиугольника на окружности радиуса $1$. Вещественная из них только одна, $z = 1$. Остальные четыре живут в $\mathbb{C}$ и разбиваются на пары сопряжённых.'
    - speaker: gauss
      emotion: smile
      text: 'Итог. $\mathbb{C}$ — это $\mathbb{R}[x]/(x^2 + 1)$, автоморфизмов над $\mathbb{R}$ два, модуль мультипликативен, а над $\mathbb{C}$ любой многочлен раскладывается на линейные множители. Безупречно. Можешь идти, а я ещё посмотрю на небо.'
unlocks: [complex_arith, complex_abs]

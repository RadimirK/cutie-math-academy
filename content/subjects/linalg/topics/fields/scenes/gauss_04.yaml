id: gauss_04
title: Простые и максимальные идеалы
character: gauss
background: library
nodes:
  start:
    - speaker: gauss
      emotion: serious
      text: 'Сегодня ответим на вопрос: когда фактор-кольцо $R/I$ — поле? Ответ будет красивым. Но сначала два определения. $R$ везде коммутативное кольцо с единицей.'
    - speaker: gauss
      emotion: serious
      text: 'Идеал $I \ne R$ называется простым, если $ab \in I$ влечёт $a \in I$ или $b \in I$. Идеал $I \ne R$ называется максимальным, если между ним и $R$ нет других идеалов: из $I \subseteq J$ следует $J = I$ или $J = R$.'
    - speaker: gauss
      emotion: smile
      text: 'В $\mathbb{Z}$: $(p)$ для простого $p$ — простой идеал. Это ровно свойство «простое делит произведение — делит множитель». А $(6)$ не простой: $2 \cdot 3 \in (6)$, но ни $2$, ни $3$ туда не входят.'
    - speaker: gauss
      emotion: smile
      text: 'Максимальные в $\mathbb{Z}$: $(p)$ при простом $p$. Над $(p)$ может стоять только $(d)$ с $d \mid p$, то есть $(1)$ или $(p)$. А нулевой идеал $(0)$ простой: в $\mathbb{Z}$ нет делителей нуля. Но не максимальный, ведь $(0) \subsetneq (2) \subsetneq \mathbb{Z}$.'
    - goto: prime
  prime:
    - speaker: gauss
      emotion: serious
      text: 'Теорема 1. $I$ — простой идеал тогда и только тогда, когда $R/I$ — область целостности.'
    - speaker: gauss
      emotion: explain
      text: 'Переведём условие на язык классов. $[a][b] = [0]$ в $R/I$ означает $ab \in I$. А $[a] = [0]$ означает $a \in I$. Значит, «в $R/I$ из $[a][b] = 0$ следует $[a] = 0$ или $[b] = 0$» — это слово в слово «из $ab \in I$ следует $a \in I$ или $b \in I$».'
    - speaker: gauss
      emotion: smile
      text: 'А условие $I \ne R$ — это условие $[1] \ne [0]$ в фактор-кольце. Определения совпали. Безупречно и почти без вычислений.'
    - speaker: gauss
      emotion: serious
      text: 'Теорема 2. $I$ — максимальный идеал тогда и только тогда, когда $R/I$ — поле.'
    - speaker: gauss
      emotion: explain
      text: 'Пусть $I$ максимален и $[a] \ne [0]$, то есть $a \notin I$. Найдём обратный к $[a]$. Рассмотрим идеал $J = I + (a)$. Он содержит $I$ и ещё $a$, значит, строго больше $I$. По максимальности $J = R$.'
    - speaker: gauss
      emotion: smile
      text: 'Значит, $1 \in J$: $1 = i + ra$ для каких-то $i \in I$ и $r \in R$. Переходим к классам, $[i] = 0$: $[1] = [r][a]$. Обратный найден: $[a]^{-1} = [r]$.'
    - speaker: gauss
      emotion: explain
      text: 'Обратно, пусть $R/I$ — поле и $I \subsetneq J$. Возьмём $x \in J$, $x \notin I$. Тогда $[x] \ne 0$, и есть $[y]$ с $[x][y] = [1]$. Значит, $xy - 1 = i \in I$, и $1 = xy - i$. Оба слагаемых лежат в $J$, так что $1 \in J$ и $J = R$.'
    - speaker: student_a
      emotion: explain
      text: 'Поле — это область целостности, где ещё и всё обратимо. Значит, каждый максимальный идеал простой!'
    - speaker: gauss
      emotion: happy
      text: 'Безупречно. А обратное неверно: $(0)$ в $\mathbb{Z}$ прост, но не максимален. $\mathbb{Z}/(0) = \mathbb{Z}$ — область целостности, но не поле.'
    - goto: kx
  kx:
    - speaker: gauss
      emotion: serious
      text: 'Теперь многочлены. В $k[x]$ все идеалы главные. Утверждение: $(f)$ максимален тогда и только тогда, когда $f$ неприводим.'
    - speaker: gauss
      emotion: explain
      text: 'Пусть $f$ неприводим и $(f) \subseteq J$. $J$ главный: $J = (g)$, и $f \in (g)$, то есть $g \mid f$. Делители неприводимого — обратимые или ассоциированные с ним. Если $g$ обратим, $J = k[x]$. Если $g \sim f$, $J = (f)$. Третьего не дано — максимален.'
    - speaker: gauss
      emotion: explain
      text: 'Пусть $f$ приводим: $f = gh$, $\deg g \ge 1$, $\deg h \ge 1$. Тогда $(f) \subsetneq (g) \subsetneq k[x]$: $g$ не кратно $f$ по степени, и $g$ необратим. Нашёлся идеал посередине — не максимален.'
    - speaker: gauss
      emotion: happy
      text: 'Вывод: если $f$ неприводим, то $k[x]/(f)$ — поле. Это фабрика полей! Например, $x^2 + x + 1$ неприводим над $\mathbb{Z}/2$: ни $0$, ни $1$ не корни. Значит, $(\mathbb{Z}/2)[x]/(x^2 + x + 1)$ — поле из четырёх элементов $0, 1, x, x + 1$.'
    - choice:
        question: 'Является ли $\mathbb{R}[x]/(x^2 - 1)$ полем?'
        options:
          - text: 'Да'
            goto: field_wrong
          - text: 'Нет'
            goto: field_right
  field_wrong:
    - speaker: gauss
      emotion: thinking
      text: '$x^2 - 1 = (x - 1)(x + 1)$ приводим. В фактор-кольце $[x - 1] \cdot [x + 1] = [x^2 - 1] = [0]$, хотя оба множителя не ноль. Делители нуля — какое уж тут поле.'
    - goto: field_right
  field_right:
    - speaker: gauss
      emotion: smile
      text: 'Нет: $x^2 - 1 = (x - 1)(x + 1)$ приводим, и $[x - 1][x + 1] = 0$. А вот $x^2 + 1$ над $\mathbb{R}$ неприводим: многочлен второй степени раскладывается, только если у него есть корень, а у $x^2 + 1$ вещественных корней нет.'
    - speaker: gauss
      emotion: happy
      text: 'Значит, $\mathbb{R}[x]/(x^2 + 1)$ — поле. Это поле комплексных чисел. Его мы и построим в следующий раз, аккуратно, без всякого «представим, что $\sqrt{-1}$ существует».'

id: noether_11
title: Нормальная форма Смита
character: noether
background: classroom
nodes:
  start:
    - speaker: noether
      emotion: smile
      text: 'Напоминаю: $M \cong R^n / A R^m$, где $A$ — матрица соотношений. Мы хотим упростить $A$, но так, чтобы модуль не поменялся. Какие действия разрешены?'
    - speaker: noether
      emotion: explain
      text: 'Действия со столбцами: столбцы — это соотношения. Можно переставить их, прибавить к одному другой, умноженный на $r \in R$, умножить на обратимый элемент. Набор соотношений меняется, но их линейная оболочка — та же. Это умножение $A$ справа на обратимую матрицу $V$.'
    - speaker: noether
      emotion: explain
      text: 'Действия со строками: строки — это образующие. Прибавить к строке $i$ строку $j$, умноженную на $r$, — значит перейти к другому набору образующих $R^n$. Модуль от этого не меняется, меняется только его описание. Это умножение слева на обратимую $U$.'
    - speaker: noether
      emotion: serious
      text: 'Теорема Смита. Пусть $R$ — ОГИ, $A$ — матрица $n \times m$ над $R$. Существуют обратимые $U$ и $V$, такие что $UAV$ диагональна: на диагонали $d_1, d_2, \dots, d_t$, потом нули, вне диагонали нули, причём $$d_1 \mid d_2 \mid \dots \mid d_t.$$ Числа $d_i$ называются инвариантными множителями и определены однозначно с точностью до ассоциированности.'
    - goto: algorithm
  algorithm:
    - speaker: noether
      emotion: explain
      text: 'Алгоритм для евклидова кольца, например $\mathbb{Z}$. Шаг 1: переставим строки и столбцы так, чтобы в углу $(1, 1)$ стоял ненулевой элемент наименьшей нормы.'
    - speaker: noether
      emotion: explain
      text: 'Шаг 2: каждый элемент первого столбца делим с остатком на угловой и вычитаем из его строки первую строку, умноженную на частное. В первом столбце остаются остатки. С первой строкой — так же, столбцами. Если остался ненулевой остаток, он по норме меньше углового: переносим его в угол и повторяем.'
    - speaker: noether
      emotion: smile
      text: 'Норма угла каждый раз строго уменьшается, а бесконечно убывать натуральные числа не могут. Значит, однажды первая строка и первый столбец станут нулевыми, кроме угла.'
    - speaker: noether
      emotion: explain
      text: 'Шаг 3: если угловой $d$ не делит какой-то элемент $a_{ij}$ оставшейся матрицы, прибавим строку $i$ к первой строке и вернёмся к шагу 2: появится остаток меньше $d$. Иначе $d_1 = d$, и переходим к матрице без первой строки и столбца.'
    - speaker: noether
      emotion: thinking
      text: 'В общей ОГИ деления с остатком нет. Его заменяет соотношение Безу: если $d = \gcd(a, b) = ax + by$, то матрица $\begin{pmatrix} x & y \\ -b/d & a/d \end{pmatrix}$ обратима, её определитель равен $1$, и она переводит столбец $\binom{a}{b}$ в $\binom{d}{0}$.'
    - speaker: noether
      emotion: happy
      text: 'Пример из прошлого раза: $A = \begin{pmatrix} 2 & 4 \\ 6 & 8 \end{pmatrix}$. Из второй строки вычтем утроенную первую: $\begin{pmatrix} 2 & 4 \\ 0 & -4 \end{pmatrix}$. Из второго столбца вычтем удвоенный первый: $\begin{pmatrix} 2 & 0 \\ 0 & -4 \end{pmatrix}$. Умножим вторую строку на обратимое $-1$: $\begin{pmatrix} 2 & 0 \\ 0 & 4 \end{pmatrix}$.'
    - speaker: noether
      emotion: smile
      text: '$2 \mid 4$, форма Смита готова. Значит, наша группа $\cong \mathbb{Z}/2 \oplus \mathbb{Z}/4$. В ней $2 \cdot 4 = 8$ элементов, как я обещала. И $|\det A| = |16 - 24| = 8$ — не совпадение: определитель меняется только на обратимый множитель.'
    - goto: divisibility
  divisibility:
    - speaker: student_a
      emotion: thinking
      text: 'А зачем условие $d_1 \mid d_2$? Матрица $\begin{pmatrix} 2 & 0 \\ 0 & 3 \end{pmatrix}$ уже диагональная.'
    - speaker: noether
      emotion: explain
      text: 'Чтобы ответ был единственным! Смотри. $\gcd(2, 3) = 1$, значит, форма Смита — $\operatorname{diag}(1, 6)$. Проверим шагом 3: прибавим вторую строку к первой: $\begin{pmatrix} 2 & 3 \\ 0 & 3 \end{pmatrix}$. Вычтем первый столбец из второго: $\begin{pmatrix} 2 & 1 \\ 0 & 3 \end{pmatrix}$.'
    - speaker: noether
      emotion: explain
      text: 'Переставим столбцы: $\begin{pmatrix} 1 & 2 \\ 3 & 0 \end{pmatrix}$. Вычтем удвоенный первый столбец из второго: $\begin{pmatrix} 1 & 0 \\ 3 & -6 \end{pmatrix}$. Вычтем утроенную первую строку из второй: $\begin{pmatrix} 1 & 0 \\ 0 & -6 \end{pmatrix}$. Готово: $\operatorname{diag}(1, 6)$.'
    - speaker: student_a
      emotion: surprised
      text: 'Значит, $\mathbb{Z}/2 \oplus \mathbb{Z}/3 \cong \mathbb{Z}/1 \oplus \mathbb{Z}/6 = \mathbb{Z}/6$. Это же китайская теорема!'
    - speaker: noether
      emotion: happy
      text: 'Китайская теорема в матрицах! Гаусс будет довольна. Без условия делимости один модуль записывался бы двумя способами. С ним — одним.'
    - speaker: noether
      emotion: serious
      text: 'Почему $d_i$ определены однозначно: произведение $d_1 d_2 \cdots d_k$ равно НОД всех миноров размера $k \times k$ матрицы $A$, с точностью до ассоциированности. А НОД миноров не меняется при умножении на обратимые матрицы. Эту часть доказательства мы оставим на факультатив.'
    - choice:
        question: 'Какова форма Смита матрицы $\begin{pmatrix} 4 & 6 \end{pmatrix}$ над $\mathbb{Z}$?'
        options:
          - text: '$\begin{pmatrix} 2 & 0 \end{pmatrix}$'
            goto: smith_right
          - text: '$\begin{pmatrix} 4 & 0 \end{pmatrix}$'
            goto: smith_wrong
          - text: '$\begin{pmatrix} 1 & 0 \end{pmatrix}$'
            goto: smith_wrong
  smith_wrong:
    - speaker: noether
      emotion: thinking
      text: 'Работаем столбцами, как алгоритмом Евклида: $(4, 6) \to (4, 2) \to (0, 2) \to (2, 0)$. Получается НОД. А НОД четырёх и шести — …'
    - goto: smith_right
  smith_right:
    - speaker: noether
      emotion: happy
      text: '$(2\ 0)$: операции со столбцами — это алгоритм Евклида, и в углу остаётся $\gcd(4, 6) = 2$. Значит, $\mathbb{Z} / (4\mathbb{Z} + 6\mathbb{Z}) = \mathbb{Z}/2$.'
    - speaker: noether
      emotion: smile
      text: 'Итог. Любую матрицу над ОГИ обратимыми преобразованиями строк и столбцов можно привести к диагональной с $d_1 \mid d_2 \mid \dots$. В следующий раз — что это говорит о самих модулях.'
unlocks: [group_order, smith_factor]

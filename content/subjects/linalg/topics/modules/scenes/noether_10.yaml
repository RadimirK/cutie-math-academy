id: noether_10
title: Модули
character: noether
background: lecture_hall
nodes:
  start:
    - narration: 'Большая аудитория. Нётер вбегает с охапкой бумаг, роняет половину и не обращает на это внимания.'
    - speaker: noether
      emotion: happy
      text: 'Я вернулась! Грассман и Кронекер рассказали вам про векторные пространства над полем. А теперь — забудь, что это поле!'
    - speaker: student_b
      emotion: thinking
      text: 'Опять «забудь»? Что на этот раз?'
    - speaker: noether
      emotion: explain
      text: 'Возьмём определение векторного пространства и заменим поле $k$ на коммутативное кольцо $R$ с единицей. Всё остальное оставим. Получится модуль.'
    - speaker: noether
      emotion: serious
      text: 'Модуль над $R$ — это абелева группа $(M, +)$ с умножением $R \times M \to M$, такая что для всех $r, r_1, r_2 \in R$, $m, m_1, m_2 \in M$: $$(r_1 + r_2)m = r_1 m + r_2 m, \quad r(m_1 + m_2) = r m_1 + r m_2, \quad r_1(r_2 m) = (r_1 r_2)m, \quad 1 \cdot m = m.$$'
    - speaker: noether
      emotion: smile
      text: 'Примеры! Векторное пространство — модуль над полем. $R^n$ — столбцы с элементами из $R$. Любой идеал $I \subseteq R$ — модуль над $R$. И важнейший: любая абелева группа — модуль над $\mathbb{Z}$, если положить $n \cdot m = m + m + \dots + m$, $n$ раз.'
    - speaker: noether
      emotion: explain
      text: 'И ещё один, для Жордан. Пусть $V$ — пространство над $k$, $A$ — оператор на нём. Определим умножение многочлена на вектор: $f(x) \cdot v = f(A)v$. Например, $(x^2 + 1) \cdot v = A^2 v + v$. Получится модуль над $k[x]$. Запомни его, он вернётся.'
    - goto: torsion
  torsion:
    - speaker: noether
      emotion: thinking
      text: 'Чем модули отличаются от пространств? Посмотри на $\mathbb{Z}/6$ как на $\mathbb{Z}$-модуль. Элемент $1$ порождает всё: любой $m = m \cdot 1$. Но $6 \cdot 1 = 0$, хотя $6 \ne 0$ в $\mathbb{Z}$.'
    - speaker: student_a
      emotion: confused
      text: 'То есть $\{1\}$ порождает, но не независимо? Ненулевой коэффициент дал ноль.'
    - speaker: noether
      emotion: happy
      text: 'Именно. В векторном пространстве мы бы поделили на $6$ и получили противоречие. А в $\mathbb{Z}$ делить на $6$ нельзя. Такие элементы, которые какое-то ненулевое $r$ отправляет в ноль, называют кручением.'
    - speaker: noether
      emotion: serious
      text: 'Определения. Модуль конечнопорождён, если есть $m_1, \dots, m_n$, такие что каждый $x \in M$ равен $r_1 m_1 + \dots + r_n m_n$. Модуль свободен, если $M \cong R^n$, то есть у него есть базис — порождающее и линейно независимое множество.'
    - speaker: noether
      emotion: smile
      text: 'Над полем каждый конечнопорождённый модуль свободен, это теорема Грассман о базисе. Над $\mathbb{Z}$ — нет. $\mathbb{Z}^2$ свободен. $\mathbb{Z}/6$ конечнопорождён, но не свободен. А $\mathbb{Q}$ как $\mathbb{Z}$-модуль даже не конечнопорождён: у конечного набора дробей знаменатели ограничены.'
    - choice:
        question: 'Является ли $\mathbb{Z}/6$ свободным $\mathbb{Z}$-модулем?'
        options:
          - text: 'Да, его порождает $1$'
            goto: free_wrong
          - text: 'Нет'
            goto: free_right
  free_wrong:
    - speaker: noether
      emotion: thinking
      text: 'Порождать — мало. Свободный значит $\cong \mathbb{Z}^n$. Но $\mathbb{Z}^n$ либо нулевой, либо бесконечный, а в $\mathbb{Z}/6$ шесть элементов. И базиса в нём нет: любой элемент умножение на $6$ отправляет в ноль.'
    - goto: free_right
  free_right:
    - speaker: noether
      emotion: happy
      text: 'Нет: $\mathbb{Z}^n$ бесконечен при $n \ge 1$, а $\mathbb{Z}/6$ конечен. Кручение мешает быть свободным.'
    - goto: presentation
  presentation:
    - speaker: noether
      emotion: explain
      text: 'Теперь главная техника: как описать любой конечнопорождённый модуль. Пусть $m_1, \dots, m_n$ его порождают. Отображение $\pi\colon R^n \to M$, $(r_1, \dots, r_n) \mapsto \sum r_i m_i$, — гомоморфизм модулей, и оно сюръективно.'
    - speaker: noether
      emotion: serious
      text: 'Ядро $K = \ker\pi$ — это все соотношения между образующими: наборы $(r_1, \dots, r_n)$ с $\sum r_i m_i = 0$. По теореме об изоморфизме, которая для модулей доказывается так же, как для колец, $M \cong R^n / K$.'
    - speaker: noether
      emotion: explain
      text: 'Если $R$ — ОГИ, то $K$, подмодуль в $R^n$, тоже конечнопорождён. Это факт, который мы примем: над ОГИ подмодуль свободного модуля ранга $n$ свободен ранга не больше $n$. Выберем образующие $K$ и запишем их столбцами матрицы $A$ размера $n \times m$.'
    - speaker: noether
      emotion: happy
      text: 'Тогда $K = A R^m$ — все комбинации столбцов, и $$M \cong R^n / A R^m.$$ Это копредставление модуля: образующие плюс матрица соотношений. Весь модуль закодирован одной матрицей!'
    - speaker: noether
      emotion: smile
      text: 'Пример. $\mathbb{Z}/6$: одна образующая, одно соотношение $6 \cdot 1 = 0$. Матрица $A = (6)$, и $\mathbb{Z}^1 / 6\mathbb{Z} = \mathbb{Z}/6$.'
    - speaker: noether
      emotion: explain
      text: 'Пример посложнее. Абелева группа с образующими $a, b$ и соотношениями $2a + 6b = 0$, $4a + 8b = 0$. Матрица соотношений по столбцам: $A = \begin{pmatrix} 2 & 4 \\ 6 & 8 \end{pmatrix}$. Что это за группа?'
    - speaker: student_b
      emotion: confused
      text: 'Понятия не имею. Сколько в ней хотя бы элементов?'
    - speaker: noether
      emotion: happy
      text: 'Вот! По матрице сразу не видно. Нужно упростить матрицу, не меняя модуль. Это и есть нормальная форма Смита, следующая лекция. Спойлер: элементов восемь.'

id: grassmann_bond_1
title: Ветер на крыше
character: grassmann
background: rooftop_sunset
nodes:
  start:
    - narration: 'Крыша на закате. На перилах звенит самодельная музыка ветра из ракушек. Грассман сидит рядом со старой книгой на коленях; буквы в ней не латинские.'
    - speaker: grassmann
      emotion: smile
      text: 'Это санскрит. Я читаю его, когда хочу отдохнуть. Старые слова похожи на ракушки: приложишь к уху — и слышно, откуда они пришли.'
    - narration: 'Налетает порыв ветра. Он срывает с Грассман ободок, и небесно-голубые волосы взлетают ей на лицо. Длинная юбка надувается колоколом, и Грассман с тихим «ах» прижимает её обеими руками.'
    - speaker: grassmann
      emotion: embarrassed
      text: 'Ободок! Он улетает… А я не могу отпустить юбку… Ох, ветер сегодня такой нахальный…'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Поймать ободок.'
            goto: catch
          - text: 'Встать с наветренной стороны и заслонить её от ветра.'
            goto: shield
  catch:
    - narration: 'Ты ловишь ободок у самого края крыши. Когда оборачиваешься, Грассман стоит, придерживая юбку, а волосы закрывают ей пол-лица.'
    - speaker: grassmann
      emotion: embarrassed
      text: 'Наденешь? У меня обе руки… заняты.'
    - narration: 'Ты убираешь волосы с её лица и надеваешь ободок. Она стоит очень тихо и смотрит снизу вверх, не моргая.'
    - goto: talk
  shield:
    - narration: 'Ты встаёшь так, чтобы ветер бил в спину тебе. Грассман оказывается совсем близко, почти уткнувшись тебе в грудь.'
    - speaker: grassmann
      emotion: embarrassed
      text: 'Так… ветра нет. Совсем. Только очень близко. Если проще: мне так нравится.'
    - goto: talk
  talk:
    - narration: 'Ветер стихает. Солнце опускается за крыши. Вы сидите рядом, и её плечо касается твоего.'
    - speaker: grassmann
      emotion: thinking
      text: 'Знаешь, в старом языке «друг» и «другой» почти одно слово. Друг — это тот, кто другой, но всё равно рядом.'
    - speaker: grassmann
      emotion: sad
      text: 'Меня долго никто не понимал. Говорили, что я слишком туманная. Я привыкла повторять всё по три раза разными словами.'
    - speaker: grassmann
      emotion: smile
      text: 'А тебе ничего не надо объяснять. Ты просто… слышишь. Это очень странное чувство. Тёплое.'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Взять её за руку.'
            goto: hand
          - text: 'Спросить, есть ли в санскрите слово для этого чувства.'
            goto: word
  hand:
    - narration: 'Её пальцы сначала вздрагивают, потом медленно переплетаются с твоими.'
    - speaker: grassmann
      emotion: embarrassed
      text: 'Две руки… переплелись. Если проще: я не отпущу. Даже если снова подует ветер.'
    - goto: end
  word:
    - speaker: grassmann
      emotion: thinking
      text: 'Есть. «Снеха» — нежность. Оно родственно слову «масло», «то, что делает мягким».'
    - speaker: grassmann
      emotion: embarrassed
      text: 'Если проще… рядом с тобой я становлюсь мягче. Вот.'
    - goto: end
  end:
    - narration: 'Грассман отвязывает от перил одну ракушку и вкладывает тебе в ладонь, а потом, пока ты разглядываешь ракушку, быстро целует тебя в висок.'
    - speaker: grassmann
      emotion: smile
      text: 'Приложи к уху, когда будет грустно. Там будет шум моря. И, может быть, немножко меня.'

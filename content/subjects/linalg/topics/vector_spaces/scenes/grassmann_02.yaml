id: grassmann_02
title: Лемма о замене и размерность
character: grassmann
background: rooftop
nodes:
  start:
    - speaker: grassmann
      emotion: smile
      text: 'Сегодня три вопроса. Есть ли базис у любого пространства? Можно ли достроить до базиса любые независимые векторы? И почему в базисе плоскости всегда два вектора, а не то два, то три?'
    - speaker: grassmann
      emotion: serious
      text: 'Теорема о дополнении. Если $S \subseteq V$ линейно независимо, то есть базис $B$, такой что $S \subseteq B$.'
    - speaker: grassmann
      emotion: explain
      text: 'Сначала идея на понятном языке. Пока $S$ не порождает всё, найдётся вектор $v \notin \langle S \rangle$. Добавим его: $S \cup \{v\}$ останется независимым. Если $\sum \alpha_i s_i + \beta v = 0$ и $\beta \ne 0$, то $v$ выразился бы через $S$. Значит, $\beta = 0$, а тогда и все $\alpha_i = 0$.'
    - speaker: grassmann
      emotion: smile
      text: 'Добавляем, добавляем… Если пространство конечномерно, процесс закончится. Почему — покажет лемма Стейница чуть позже. Закончится он на максимальном независимом множестве, а это базис по прошлой теореме.'
    - speaker: student_b
      emotion: thinking
      text: 'А если пространство бесконечномерное? Многочлены, например. Там добавлять можно вечно.'
    - speaker: grassmann
      emotion: serious
      text: 'Тогда нужна лемма Цорна. Пусть в частично упорядоченном множестве у любой цепочки есть верхняя граница. Тогда в нём есть максимальный элемент. Это утверждение равносильно аксиоме выбора, его принимают без доказательства.'
    - speaker: grassmann
      emotion: explain
      text: 'Рассмотрим $\mathcal{A}$ — все независимые множества, содержащие $S$, упорядоченные по включению. Возьмём цепочку $X_1 \subseteq X_2 \subseteq \dots$ и объединим её: $A_c = \bigcup X$. Независимость проверяется на конечных наборах векторов. А любой конечный набор из $A_c$ уже лежит в одном $X$ цепочки, где он независим.'
    - speaker: grassmann
      emotion: smile
      text: 'Значит, $A_c \in \mathcal{A}$ — верхняя граница цепочки. По лемме Цорна в $\mathcal{A}$ есть максимальный элемент $B$. Он содержит $S$ и является максимальным независимым множеством, то есть базисом.'
    - speaker: grassmann
      emotion: embarrassed
      text: 'Звучит туманно, я знаю. Если проще: в конечномерном случае просто добавляем векторы по одному, а лемма Цорна — способ сказать «и так до конца» для бесконечного случая.'
    - goto: steinitz
  steinitz:
    - speaker: grassmann
      emotion: serious
      text: 'Лемма Стейница, или лемма о замене. Пусть $S = \{w_1, \dots, w_m\}$ порождает $V$, а $L = \{v_1, \dots, v_n\}$ линейно независимо. Тогда $n \le m$, и после перенумерации $S$ набор $\{v_1, \dots, v_n, w_{n+1}, \dots, w_m\}$ тоже порождает $V$.'
    - speaker: grassmann
      emotion: explain
      text: 'Представь: у тебя набор кирпичей $w$, из которого строится всё. Лемма говорит, что независимые векторы $v$ можно вставлять в набор, каждый раз вынимая один $w$, и набор не перестанет строить всё. А раз каждому $v$ нужен свой вынутый $w$, их не больше, чем $w$.'
    - speaker: grassmann
      emotion: serious
      text: 'Доказательство индукцией по $n$. При $n = 0$ менять нечего. Пусть для $n - 1$ уже доказано: $S'' = \{v_1, \dots, v_{n-1}, w_n, \dots, w_m\}$ порождает. Тогда и $v_n$ через него выражается: $$v_n = \sum_{i < n} \alpha_i v_i + \sum_{i \ge n} \beta_i w_i.$$'
    - speaker: grassmann
      emotion: explain
      text: 'Если все $\beta_i = 0$, то $v_n$ — комбинация $v_1, \dots, v_{n-1}$, и $L$ зависимо. Нельзя. Значит, какой-то $\beta_i \ne 0$. В частности, хоть один $w$ в $S''$ остался, то есть $m \ge n$. Перенумеруем так, чтобы $\beta_n \ne 0$.'
    - speaker: grassmann
      emotion: explain
      text: 'Выразим $w_n$: $$w_n = \frac{1}{\beta_n}\Big(v_n - \sum_{i < n} \alpha_i v_i - \sum_{i > n} \beta_i w_i\Big).$$ Значит, $w_n$ лежит в оболочке $S'''' = \{v_1, \dots, v_n, w_{n+1}, \dots, w_m\}$. А всё остальное из $S''$ там лежит тем более. Значит, $S''''$ порождает всё, что порождало $S''$, то есть $V$.'
    - speaker: grassmann
      emotion: smile
      text: 'Пример в $\mathbb{R}^3$. $S = \{e_1, e_2, e_3\}$, $L = \{(1, 1, 0), (0, 1, 1)\}$. $v_1 = e_1 + e_2$, коэффициент при $e_1$ не ноль — меняем $e_1$ на $v_1$. Потом $v_2 = e_2 + e_3$, коэффициент при $e_2$ не ноль — меняем $e_2$. Получился порождающий набор $\{v_1, v_2, e_3\}$.'
    - goto: dimension
  dimension:
    - speaker: grassmann
      emotion: serious
      text: 'Теорема о корректности размерности. Если у $V$ есть конечный базис $B$, то любой другой базис $B''$ имеет столько же элементов.'
    - speaker: grassmann
      emotion: explain
      text: '$B$ порождает, $B''$ независимо. По лемме Стейница любой конечный кусок $B''$ содержит не больше $|B|$ векторов. Значит, $B''$ конечен и $|B''| \le |B|$. Теперь поменяем роли: $B''$ порождает, $B$ независимо, значит, $|B| \le |B''|$. Итого $|B| = |B''|$.'
    - speaker: grassmann
      emotion: happy
      text: 'Это число называется размерностью: $\dim V = |B|$. Мера протяжённости пространства. Наконец-то можно говорить это слово без смущения.'
    - speaker: grassmann
      emotion: smile
      text: 'Примеры. $\dim k^n = n$, базис — столбцы с одной единицей. $\dim_{\mathbb{R}} \mathbb{C} = 2$, базис $\{1, i\}$. А у многочленов $k[x]$ бесконечный базис $1, x, x^2, \dots$, это бесконечномерное пространство.'
    - choice:
        question: 'Какова размерность пространства многочленов степени не выше $3$ над $\mathbb{R}$, включая ноль?'
        options:
          - text: '$3$'
            goto: dim_wrong
          - text: '$4$'
            goto: dim_right
  dim_wrong:
    - speaker: grassmann
      emotion: thinking
      text: 'Выпиши базис: $1, x, x^2, x^3$. Не забудь про константу $1$, без неё не собрать свободный член. Сколько векторов?'
    - goto: dim_right
  dim_right:
    - speaker: grassmann
      emotion: happy
      text: 'Четыре: базис $1, x, x^2, x^3$. Многочлен $a + bx + cx^2 + dx^3$ — это вектор с координатами $(a, b, c, d)$.'
    - speaker: student_b
      emotion: thinking
      text: 'А то, что на плоскости любые три вектора зависимы, теперь тоже доказано? Плоскость порождают два вектора, значит, независимых не больше двух.'
    - speaker: grassmann
      emotion: happy
      text: 'Да, ровно по лемме Стейница. Ты перевела лемму на человеческий язык лучше меня. Спасибо, Хината.'

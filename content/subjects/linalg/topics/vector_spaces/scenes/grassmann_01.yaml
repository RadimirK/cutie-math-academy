id: grassmann_01
title: Стрелки и основание
character: grassmann
background: rooftop
nodes:
  start:
    - narration: 'На крыше дует ветер. Девушка с небесно-голубыми волосами придерживает ободок и смотрит на облака так, будто считает их.'
    - speaker: grassmann
      emotion: smile
      text: 'Ой. Вы пришли? Правда пришли на лекцию? Я Грассман. Обычно на слове «протяжённость» все уходят, так что… спасибо.'
    - speaker: grassmann
      emotion: explain
      text: 'Представь стрелку на плоскости. Её можно приложить к другой стрелке, конец к началу, и получить третью — это сумма. Её можно растянуть в два раза или развернуть — это умножение на число. Вот и всё, что умеют векторы.'
    - speaker: student_b
      emotion: thinking
      text: 'Это как в физике? Сложение сил по правилу параллелограмма?'
    - speaker: grassmann
      emotion: happy
      text: 'Да! Но я хочу говорить не только про стрелки. Многочлены тоже можно складывать и умножать на числа. И функции. И столбцы чисел. Если проще: всё, что складывается и растягивается по тем же правилам, — векторы.'
    - speaker: grassmann
      emotion: serious
      text: 'Определение. Векторное пространство над полем $k$ — это множество $V$ с двумя операциями: сложение $V \times V \to V$ и умножение на число $k \times V \to V$. Причём $(V, +)$ — абелева группа, и для всех $\alpha, \beta \in k$ и $v, w \in V$:'
    - speaker: grassmann
      emotion: serious
      text: '$$(\alpha + \beta)v = \alpha v + \beta v, \quad \alpha(v + w) = \alpha v + \alpha w, \quad (\alpha\beta)v = \alpha(\beta v), \quad 1 \cdot v = v.$$ Числа из $k$ называют скалярами, от латинского scala — «лестница», шкала растяжения.'
    - speaker: grassmann
      emotion: smile
      text: 'Примеры. $k^n$ — столбцы из $n$ чисел, складываем покомпонентно. Многочлены $k[x]$. Функции $\mathbb{R} \to \mathbb{R}$. И $\mathbb{C}$ над $\mathbb{R}$: комплексное число — стрелка $(a, b)$ на плоскости.'
    - goto: independence
  independence:
    - speaker: grassmann
      emotion: serious
      text: 'Линейная комбинация векторов $v_1, \dots, v_n$ — это $\alpha_1 v_1 + \dots + \alpha_n v_n$. Линейная оболочка $\langle S \rangle$ — все линейные комбинации векторов из $S$. Если $\langle S \rangle = V$, множество $S$ называют порождающим: из него собирается всё.'
    - speaker: grassmann
      emotion: serious
      text: 'Векторы $v_1, \dots, v_n$ линейно независимы, если из $\alpha_1 v_1 + \dots + \alpha_n v_n = 0$ следует $\alpha_1 = \dots = \alpha_n = 0$. Ноль получается только «честным» способом, когда все коэффициенты нулевые.'
    - speaker: grassmann
      emotion: explain
      text: 'Если проще: независимые векторы не дублируют друг друга. Ни один из них нельзя собрать из остальных. Пример: $(1, 2)$ и $(2, 4)$ зависимы, ведь $2 \cdot (1, 2) - (2, 4) = 0$. Вторая стрелка лежит на той же прямой, что и первая.'
    - speaker: grassmann
      emotion: smile
      text: 'А $(1, 0)$ и $(0, 1)$ независимы: $\alpha(1, 0) + \beta(0, 1) = (\alpha, \beta)$, и это ноль только при $\alpha = \beta = 0$.'
    - speaker: grassmann
      emotion: serious
      text: 'Базис — от греческого «основание». Это множество, которое одновременно порождающее и линейно независимое. Всё пространство стоит на нём: каждый вектор собирается из базиса, и ровно одним способом. Коэффициенты этой сборки — координаты вектора.'
    - speaker: student_a
      emotion: explain
      text: 'Как три цвета в мониторе! Красный, зелёный, синий. Любой цвет смешивается из них, и ни один из трёх не получить из двух других.'
    - speaker: grassmann
      emotion: surprised
      text: 'Ой, как хорошо. Да, именно так. Можно я буду так объяснять? Это лучше моих стрелок.'
    - goto: theorem
  theorem:
    - speaker: grassmann
      emotion: serious
      text: 'Теорема. Для множества $B \subseteq V$ равносильно: 1) $B$ — базис; 2) $B$ — максимальное по включению линейно независимое множество; 3) $B$ — минимальное по включению порождающее множество.'
    - speaker: grassmann
      emotion: smile
      text: '«Максимальное» значит: добавь любой вектор — и независимость сломается. «Минимальное» значит: убери любой вектор — и порождать всё перестанет.'
    - speaker: grassmann
      emotion: explain
      text: '$1 \Rightarrow 2$. Пусть $B$ — базис, $v \notin B$. Тогда $v = \sum \alpha_i e_i$ по базису, то есть $\sum \alpha_i e_i - v = 0$. Коэффициент при $v$ равен $-1 \ne 0$, так что $B \cup \{v\}$ зависимо.'
    - speaker: grassmann
      emotion: explain
      text: '$2 \Rightarrow 1$. Нужно показать, что $B$ порождает. Возьмём $v \notin B$. $B \cup \{v\}$ зависимо: $\sum \alpha_i e_i + \beta v = 0$, не все коэффициенты ноль. Если $\beta = 0$, то зависимо само $B$ — нельзя. Значит, $\beta \ne 0$, и $v = -\sum \frac{\alpha_i}{\beta} e_i$.'
    - speaker: grassmann
      emotion: smile
      text: 'Заметь: мы поделили на $\beta$. Тут и нужно, что $k$ — поле. Над кольцами всё сложнее, Нётер потом расскажет про модули.'
    - speaker: grassmann
      emotion: explain
      text: '$1 \Rightarrow 3$. Пусть $B$ — базис, и мы убрали из него $e$. Если $B \setminus \{e\}$ всё ещё порождает, то $e = \sum \alpha_i e_i$ по остальным, и $B$ зависимо. Противоречие.'
    - speaker: grassmann
      emotion: explain
      text: '$3 \Rightarrow 1$. Нужна независимость. Пусть $\sum \alpha_i e_i = 0$ и $\alpha_k \ne 0$. Тогда $e_k = -\sum_{i \ne k} \frac{\alpha_i}{\alpha_k} e_i$. Везде, где нужен $e_k$, подставим это выражение, и $B \setminus \{e_k\}$ тоже порождает всё. Это противоречит минимальности.'
    - choice:
        question: 'Является ли $\{(1, 0), (0, 1), (1, 1)\}$ базисом $\mathbb{R}^2$?'
        options:
          - text: 'Да, оно порождает всю плоскость'
            goto: three_wrong
          - text: 'Нет'
            goto: three_right
  three_wrong:
    - speaker: grassmann
      emotion: thinking
      text: 'Порождает — да. Но оно не минимальное: $(1, 1) = (1, 0) + (0, 1)$, третий вектор лишний. Значит, зависимое, и базисом не является.'
    - goto: three_right
  three_right:
    - speaker: grassmann
      emotion: happy
      text: 'Нет: $(1, 1) = (1, 0) + (0, 1)$, вектор дублирует остальных. Порождать умеет, а независимости нет. Уберём лишний — получим базис.'
    - speaker: grassmann
      emotion: smile
      text: 'В следующий раз выясним, всегда ли базис есть и почему у всех базисов одного пространства одинаковое число векторов. Это и есть размерность — мера протяжённости. …Простите, я опять это слово.'
unlocks: [independent_check, span_dim]

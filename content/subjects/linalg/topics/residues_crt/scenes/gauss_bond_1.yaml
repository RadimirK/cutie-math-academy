id: gauss_bond_1
title: Поправить воротник
character: gauss
background: classroom
nodes:
  start:
    - narration: 'Утро перед занятиями. В пустой аудитории Гаусс стоит перед карманным зеркальцем и очень серьёзно растягивает губы в улыбку. Потом в другую. Потом в третью.'
    - speaker: gauss
      emotion: surprised
      text: '…Давно ты здесь стоишь?'
    - speaker: gauss
      emotion: serious
      text: 'Неважно. Ничего не было. Сегодня фотографируют для альбома академии, и я проверяла, всё ли безупречно.'
    - speaker: gauss
      emotion: embarrassed
      text: 'Не всё. Воротник перекосился, бант съехал, а у меня руки дрожат от кофе. Поправь. Это не просьба. Это… ладно, просьба.'
    - narration: 'Она поднимает подбородок и замирает. Чтобы поправить бант, приходится встать к ней почти вплотную. От неё пахнет чем-то дорогим и прохладным.'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Аккуратно перевязать бант.'
            goto: bow
          - text: 'Поправить ей прядь волос, упавшую на глаза.'
            goto: hair
  bow:
    - narration: 'Пальцы касаются её шеи, когда ты затягиваешь бант. Гаусс задерживает дыхание и смотрит куда угодно, только не на тебя.'
    - speaker: gauss
      emotion: embarrassed
      text: 'Медленнее. Нет, быстрее. Нет… как было. Как было — правильно.'
    - goto: close
  hair:
    - narration: 'Ты убираешь серебристую прядь ей за ухо. Гаусс вздрагивает и поднимает на тебя золотые глаза.'
    - speaker: gauss
      emotion: surprised
      text: 'Я просила бант. Не волосы. …Но так тоже безупречно. Оставь.'
    - goto: close
  close:
    - narration: 'Ты заканчиваешь, но не отходишь. Она тоже. Лица совсем рядом.'
    - speaker: gauss
      emotion: smug
      text: 'Ты на меня смотришь. Очень пристально. Нравится то, что видишь?'
    - choice:
        question: 'Что ответить?'
        options:
          - text: 'Очень.'
            goto: very
          - text: 'Улыбнись. Вот так ты и должна выйти на фото.'
            goto: photo
  very:
    - narration: 'Самоуверенная улыбка медленно сползает с её лица. Гаусс краснеет от шеи до кончиков ушей. Такого, кажется, не видел никто.'
    - speaker: gauss
      emotion: embarrassed
      text: 'Ты… нельзя отвечать так прямо. Я рассчитывала на смущение. С твоей стороны. Не с моей.'
    - goto: end
  photo:
    - narration: 'Гаусс открывает рот, чтобы возразить, и вдруг смеётся. Не надменно, а по-настоящему, прикрыв рот ладонью.'
    - speaker: gauss
      emotion: happy
      text: 'Вот так? Это лицо невозможно повторить по заказу. Только если ты будешь стоять рядом с фотографом.'
    - goto: end
  end:
    - narration: 'Через час на снимке для альбома Гаусс выходит румяной и смеющейся, глядя куда-то мимо объектива. Фотограф показывает большой палец.'
    - narration: 'После съёмки она догоняет тебя в коридоре, оглядывается и быстро, почти незаметно касается губами твоей щеки.'
    - speaker: gauss
      emotion: smug
      text: 'Плата за услуги стилиста. Безупречно. И об этом, разумеется, никто не узнает.'

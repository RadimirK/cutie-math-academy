id: ring_kind
title: Какое это кольцо?
difficulty: 1
answer_type: choice
params:
  q:
    type: pick
    values:
      - {s: '(\mathbb{Z}, +, \cdot)', ans: 'Коммутативное с единицей'}
      - {s: '(3\mathbb{Z}, +, \cdot)', ans: 'Коммутативное без единицы'}
      - {s: '(M_2(\mathbb{R}), +, \cdot)', ans: 'Некоммутативное с единицей'}
      - {s: '(\mathbb{R}[x], +, \cdot)', ans: 'Коммутативное с единицей'}
      - {s: '(\mathbb{N}, +, \cdot)', ans: 'Не кольцо'}
      - {s: '(\mathbb{R}^3, +, \times),\ \times \text{ — векторное произведение}', ans: 'Не кольцо'}
      - {s: '\text{верхнетреугольные матрицы } 2 \times 2 \text{ с } +, \cdot', ans: 'Некоммутативное с единицей'}
      - {s: '(\mathbb{Z}, +, *),\ a * b = 0', ans: 'Коммутативное без единицы'}
      - {s: '\text{нечётные числа с } +, \cdot', ans: 'Не кольцо'}
      - {s: '(\mathbb{Q}, +, \cdot)', ans: 'Коммутативное с единицей'}
      - {s: '(2^{\{1, 2, 3\}}, \triangle, \cap)', ans: 'Коммутативное с единицей'}
      - {s: '\text{функции } \mathbb{R} \to \mathbb{R} \text{ с поточечными } +, \cdot', ans: 'Коммутативное с единицей'}
      - {s: '(2\mathbb{Z}, +, \cdot)', ans: 'Коммутативное без единицы'}
statement: 'Что можно сказать про $<<q.s>>$? Кольцо здесь обязательно ассоциативно, $\mathbb{N} = \{1, 2, 3, \ldots\}$.'
config:
  options: ['Коммутативное с единицей', 'Коммутативное без единицы', 'Некоммутативное с единицей', 'Не кольцо']
answer: '<<q.ans>>'
hint: 'Сложение должно давать абелеву группу, умножение — быть ассоциативным, а вместе — дистрибутивность.'

id: structure_kind
title: Группа, моноид или полугруппа?
difficulty: 1
answer_type: choice
params:
  q:
    type: pick
    values:
      - {s: '(\mathbb{Z}, +)', ans: 'Группа'}
      - {s: '(\mathbb{N}, +)', ans: 'Полугруппа, но не моноид'}
      - {s: '(\mathbb{N} \cup \{0\}, +)', ans: 'Моноид, но не группа'}
      - {s: '(\mathbb{N}, \cdot)', ans: 'Моноид, но не группа'}
      - {s: '(\mathbb{Z}, -)', ans: 'Не полугруппа'}
      - {s: '(\mathbb{Q} \setminus \{0\}, \cdot)', ans: 'Группа'}
      - {s: '(\mathbb{Q}, \cdot)', ans: 'Моноид, но не группа'}
      - {s: '(2\mathbb{Z}, \cdot)', ans: 'Полугруппа, но не моноид'}
      - {s: '(\mathbb{R}, *),\ a * b = \tfrac{a + b}{2}', ans: 'Не полугруппа'}
      - {s: '(\mathbb{Z}, *),\ a * b = \max(a, b)', ans: 'Полугруппа, но не моноид'}
      - {s: '(\mathbb{N} \cup \{0\}, *),\ a * b = \max(a, b)', ans: 'Моноид, но не группа'}
      - {s: '(\mathbb{R}, *),\ a * b = a', ans: 'Полугруппа, но не моноид'}
      - {s: '(2^{\{1, 2, 3\}}, \cap)', ans: 'Моноид, но не группа'}
      - {s: '(2^{\{1, 2, 3\}}, \triangle)', ans: 'Группа'}
      - {s: '(\mathbb{Z}, *),\ a * b = a + b + 1', ans: 'Группа'}
      - {s: '(M_2(\mathbb{R}), \cdot)', ans: 'Моноид, но не группа'}
      - {s: '\text{биекции } \{1, 2, 3\} \to \{1, 2, 3\} \text{ с композицией}', ans: 'Группа'}
      - {s: '\text{все отображения } \{1, 2, 3\} \to \{1, 2, 3\} \text{ с композицией}', ans: 'Моноид, но не группа'}
statement: 'Что такое $<<q.s>>$? Здесь $\mathbb{N} = \{1, 2, 3, \ldots\}$, $\triangle$ — симметрическая разность.'
config:
  options: ['Группа', 'Моноид, но не группа', 'Полугруппа, но не моноид', 'Не полугруппа']
answer: '<<q.ans>>'
hint: 'Проверяйте по порядку: ассоциативность, нейтральный элемент, обратные.'

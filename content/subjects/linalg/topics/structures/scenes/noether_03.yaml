id: noether_03
title: Почему минус на минус даёт плюс
character: noether
background: classroom
nodes:
  start:
    - narration: 'Аудитория поменьше. Нётер пишет на доске «$+$» и «$\cdot$» и обводит их в один круг.'
    - speaker: noether
      emotion: smile
      text: 'В целых числах две операции: сложение и умножение. И они не сами по себе, они связаны: $2 \cdot (3 + 4) = 2 \cdot 3 + 2 \cdot 4$. Вот такую пару операций мы сегодня и опишем.'
    - speaker: noether
      emotion: serious
      text: 'Кольцо — это множество $R$ с двумя бинарными операциями $+$ и $\cdot$, такими что: 1) $(R, +)$ — абелева группа; 2) $(R, \cdot)$ — полугруппа, то есть умножение ассоциативно; 3) выполнена дистрибутивность: $a(b + c) = ab + ac$ и $(a + b)c = ac + bc$.'
    - speaker: student_a
      emotion: thinking
      text: 'Абелева группа по сложению — это значит, есть ноль, у каждого есть минус, и складывать можно в любом порядке?'
    - speaker: noether
      emotion: happy
      text: 'Ровно так! Нейтральный по сложению называем $0$, обратный к $a$ по сложению — $-a$. А вот с умножением требований меньше: обратных может не быть, и даже единицы может не быть.'
    - speaker: noether
      emotion: smile
      text: 'Уточнения. Если у умножения есть нейтральный элемент $1$, это кольцо с единицей. Если $ab = ba$ всегда, кольцо коммутативное. Ассоциативность умножения у нас входит в определение. Бывают и неассоциативные кольца, но в этом курсе они нам не встретятся.'
    - speaker: student_b
      emotion: thinking
      text: 'А примеры, кроме $\mathbb{Z}$?'
    - speaker: noether
      emotion: explain
      text: 'Сколько угодно! $\mathbb{Z}$, $\mathbb{Q}$, $\mathbb{R}$ — коммутативные кольца с единицей. $3\mathbb{Z} = \{\dots, -3, 0, 3, 6, \dots\}$ — коммутативное кольцо без единицы: $1$ в нём нет, а больше никто нейтральным быть не может.'
    - speaker: noether
      emotion: smile
      text: 'Многочлены с вещественными коэффициентами $\mathbb{R}[x]$ — кольцо: их складывают и перемножают. Функции $\mathbb{R} \to \mathbb{R}$ с поточечными операциями — тоже кольцо.'
    - speaker: noether
      emotion: explain
      text: 'А матрицы $2 \times 2$ — кольцо некоммутативное. Смотри: $\begin{pmatrix} 0 & 1 \\ 0 & 0 \end{pmatrix} \begin{pmatrix} 0 & 0 \\ 1 & 0 \end{pmatrix} = \begin{pmatrix} 1 & 0 \\ 0 & 0 \end{pmatrix}$, а в обратном порядке получится $\begin{pmatrix} 0 & 0 \\ 0 & 1 \end{pmatrix}$.'
    - speaker: student_a
      emotion: surprised
      text: 'Разные! Значит, в кольце матриц $AB \ne BA$, и это нормально?'
    - speaker: noether
      emotion: happy
      text: 'Совершенно нормально. Поэтому в определении дистрибутивность записана с двух сторон: в некоммутативном кольце одна не следует из другой.'
    - goto: zero
  zero:
    - speaker: noether
      emotion: explain
      text: 'А теперь фокус. Докажем, что $a \cdot 0 = 0$ в любом кольце.'
    - speaker: student_b
      emotion: confused
      text: 'Доказывать, что на ноль умножить — будет ноль? Это же все знают с первого класса.'
    - speaker: noether
      emotion: smile
      text: 'Про числа — знают. А кольцо — это любое множество с операциями, где выполнены аксиомы. В аксиомах про $a \cdot 0$ ни слова! Ноль там только нейтральный по сложению. Забудь, что это числа: что мы точно знаем?'
    - speaker: noether
      emotion: serious
      text: 'Знаем, что $0 + 0 = 0$. Умножим на $a$ и раскроем скобки по дистрибутивности: $$a \cdot 0 = a \cdot (0 + 0) = a \cdot 0 + a \cdot 0.$$'
    - speaker: noether
      emotion: smile
      text: 'Обозначим $x = a \cdot 0$. Получилось $x = x + x$. Прибавим к обеим частям $-x$, он есть, ведь по сложению у нас группа: $0 = x$. То есть $a \cdot 0 = 0$. Это и есть закон нуля. Так же $0 \cdot a = 0$.'
    - speaker: student_a
      emotion: happy
      text: 'Ноль поглощает всё только потому, что сложение и умножение связаны дистрибутивностью!'
    - speaker: noether
      emotion: happy
      text: 'Именно! Без дистрибутивности никакой связи между нулём сложения и умножением не было бы. А теперь главный школьный вопрос.'
    - goto: minus
  minus:
    - speaker: noether
      emotion: explain
      text: 'Почему «минус на минус даёт плюс»? В школе это правило просто сообщают. Мы докажем его из аксиом. Пусть кольцо с единицей. Сначала: $(-1) \cdot a = -a$.'
    - speaker: noether
      emotion: serious
      text: 'Сложим $a$ и $(-1) \cdot a$: $$a + (-1)a = 1 \cdot a + (-1) \cdot a = (1 + (-1)) \cdot a = 0 \cdot a = 0.$$ Последнее равенство — закон нуля.'
    - speaker: noether
      emotion: smile
      text: 'Получилось, что $(-1)a$ в сумме с $a$ даёт $0$. То есть $(-1)a$ — обратный к $a$ по сложению. А обратный элемент в группе единственный, мы доказали это в прошлый раз. Значит, $(-1)a = -a$.'
    - choice:
        question: 'Чему тогда равно $(-1) \cdot (-1)$?'
        options:
          - text: '$-1$'
            goto: mm_wrong
          - text: '$1$'
            goto: mm_right
  mm_wrong:
    - speaker: noether
      emotion: thinking
      text: 'Воспользуемся только что доказанным: $(-1) \cdot a = -a$ при любом $a$. Подставь $a = -1$: получится $(-1)(-1) = -(-1)$. А что такое минус от минус единицы?'
    - speaker: student_b
      emotion: thinking
      text: '$-(-1)$ — это то, что в сумме с $-1$ даёт ноль… Это $1$!'
    - goto: mm_right
  mm_right:
    - speaker: noether
      emotion: happy
      text: '$(-1)(-1) = -(-1) = 1$, ведь $1$ — это как раз тот, кто в сумме с $-1$ даёт ноль. И это следует только из аксиом кольца, поэтому верно и для чисел, и для матриц, и для многочленов.'
    - speaker: student_b
      emotion: surprised
      text: 'То есть правило «минус на минус» — не договорённость, а теорема?'
    - speaker: noether
      emotion: happy
      text: 'Теорема! Если хочешь, чтобы работала дистрибутивность, у тебя просто нет выбора. Точно так же доказывается $(-a)(-b) = ab$: $(-a)(-b) = (-1)a(-1)b = (-1)(-1)ab = ab$. Тут ещё нужно переставлять $-1$, это можно, она коммутирует со всем.'
    - speaker: noether
      emotion: thinking
      text: 'И напоследок загадка. Бывает ли кольцо с единицей, где $1 = 0$?'
    - speaker: student_a
      emotion: thinking
      text: 'Если $1 = 0$, то для любого $a$: $a = a \cdot 1 = a \cdot 0 = 0$. Значит, все элементы — ноль?'
    - speaker: noether
      emotion: happy
      text: 'Да! Такое кольцо есть, оно состоит из одного нуля и называется нулевым. Скучное, но законное. Во всех остальных кольцах с единицей $1 \ne 0$.'
    - speaker: noether
      emotion: smile
      text: 'Итог. Кольцо — две операции, связанные дистрибутивностью. Из одних аксиом мы вывели закон нуля и правило знаков. Дальше начнём в кольцах делить. Вести будет Безу, она это обожает.'

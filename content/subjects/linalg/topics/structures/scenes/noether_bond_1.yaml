id: noether_bond_1
title: Игра с печеньем
character: noether
background: corridor
nodes:
  start:
    - narration: 'Перемена. По коридору, лавируя между студентами, несётся Нётер с огромной жестяной коробкой. Очки съехали на кончик носа, на щеке мука.'
    - speaker: noether
      emotion: happy
      text: 'Смотри! Я вчера пекла! Овсяное, с шоколадом. И палочки, длинные, в глазури. Бери, мне не жалко!'
    - narration: 'Она раздаёт печенье направо и налево. Через минуту в коробке остаётся одна-единственная длинная шоколадная палочка.'
    - speaker: noether
      emotion: surprised
      text: 'Ой. Последняя. А я себе опять не оставила.'
    - speaker: noether
      emotion: smug
      text: 'Знаешь игру? Каждый откусывает со своего конца. Кто первый отпустит, тот проиграл. Говорят, её придумали для вечеринок. Хочешь… попробовать?'
    - choice:
        question: 'Что ответить?'
        options:
          - text: 'Давай.'
            goto: game
          - text: 'А ты знаешь, чем она обычно заканчивается?'
            goto: know
  know:
    - speaker: noether
      emotion: embarrassed
      text: 'Знаю. Поэтому и предлагаю. Ой. Я сказала это вслух? Забудь. Нет, не забывай. Давай играть!'
    - goto: game
  game:
    - narration: 'Нётер берёт палочку в зубы и поворачивается к тебе. Ты берёшь другой конец. Между вами двадцать сантиметров шоколада.'
    - narration: 'Хрум. Пятнадцать. Хрум. Десять. Её медовые глаза за очками широко раскрыты. Хрум. Пять. Ты чувствуешь её дыхание.'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Откусить ещё.'
            goto: bite
          - text: 'Остановиться и посмотреть, что сделает она.'
            goto: wait
  bite:
    - narration: 'Хрум. Остаётся сантиметр. Нётер зажмуривается…'
    - narration: '…и тут палочка ломается. Половинки падают на пол, а ваши носы сталкиваются.'
    - speaker: noether
      emotion: surprised
      text: 'Ай! Нос! Ничья! Это ничья! Палочка была слишком хрупкая, я пережарила глазурь!'
    - speaker: noether
      emotion: embarrassed
      text: 'Значит… надо будет испечь покрепче. И сыграть ещё раз. Без свидетелей.'
    - goto: end
  wait:
    - narration: 'Ты замираешь. Нётер тоже. Секунда, две… Потом она краснеет, откусывает последний кусочек и на мгновение касается твоих губ своими. Сладко и очень коротко.'
    - speaker: noether
      emotion: embarrassed
      text: 'Я… выиграла? Или проиграла? Я не знаю правил! То есть знаю, но не думала, что дойдёт до конца!'
    - goto: end
  end:
    - narration: 'Вы стоите у окна. Нётер сдвигает очки на лоб и тут же начинает искать их по карманам.'
    - speaker: noether
      emotion: confused
      text: 'Где же они… Я точно брала их утром…'
    - narration: 'Ты молча опускаешь очки ей на нос, а заодно стираешь большим пальцем муку со щеки. Нётер прижимается щекой к твоей ладони.'
    - speaker: noether
      emotion: smile
      text: 'Знаешь, я всё время всем всё раздаю. И забываю, что мне тоже можно что-то оставить. Себе.'
    - speaker: noether
      emotion: happy
      text: 'Завтра испеку целую коробку палочек. Только для нас. И отрепетируем. Много раз! Звонок! Бегу!'

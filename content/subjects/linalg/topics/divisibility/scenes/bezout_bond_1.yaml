id: bezout_bond_1
title: Человек за бортом
character: bezout
background: courtyard_after_rain
nodes:
  start:
    - narration: 'После вчерашнего ливня посреди двора разлилась огромная лужа. На её берегу, уперев руку в бок, стоит Безу со стопкой бумажных корабликов.'
    - speaker: bezout
      emotion: happy
      text: 'Кадет! Вовремя! Объявляю морские учения! Флот готов, не хватает только второго капитана!'
    - narration: 'Кораблики один за другим отправляются в плавание. Безу присаживается на самом краю лужи, чтобы подтолкнуть отставший.'
    - speaker: bezout
      emotion: surprised
      text: 'Ой-ой-ой… Равновесие! Держи меня!'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Схватить её за руку.'
            goto: grab
          - text: 'Обхватить её за талию.'
            goto: waist
  grab:
    - narration: 'Ты ловишь её руку, но Безу уже падает и утягивает тебя за собой. Плеск. Теперь в луже сидите вы вдвоём, по пояс.'
    - goto: wet
  waist:
    - narration: 'Ты обхватываешь её за талию и тянешь на себя. Безу влетает тебе в объятия, но ботинок съезжает по мокрой глине. Плеск. Вы сидите в луже, а она — у тебя на коленях.'
    - speaker: bezout
      emotion: embarrassed
      text: 'Человек за бортом… Два человека. Один… на другом.'
    - goto: wet
  wet:
    - speaker: bezout
      emotion: happy
      text: 'Ха-ха-ха! Мокрые насквозь! Настоящее морское крещение!'
    - narration: 'Белая матроска потемнела от воды и прилипла к плечам, красный платок обвис. Безу выжимает подол юбки и вдруг замечает, куда ты смотришь.'
    - speaker: bezout
      emotion: embarrassed
      text: 'Э-эй! Глаза на горизонт, кадет! Это приказ! …Хотя я и сама не знаю, куда смотреть. Тут всё мокрое!'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Отдать ей свою куртку, она хоть немного суше.'
            goto: jacket
          - text: 'Брызнуть в неё водой. Терять уже нечего.'
            goto: splash
  jacket:
    - narration: 'Безу натягивает твою куртку. Рукава свисают ниже пальцев.'
    - speaker: bezout
      emotion: embarrassed
      text: 'Тёплая. И пахнет тобой. Капитаны в таких случаях не краснеют. Я и не краснею. Это от холода!'
    - goto: end
  splash:
    - speaker: bezout
      emotion: surprised
      text: 'Ах так?! Бунт на корабле! К бою!'
    - narration: 'Следующие пять минут над двором летят брызги и хохот. Комендант выглядывает из окна, качает головой и задёргивает штору.'
    - speaker: bezout
      emotion: happy
      text: 'Сдаюсь! Сдаюсь! Ты — гроза морей!'
    - goto: end
  end:
    - narration: 'Мокрые и замёрзшие, вы бредёте к общежитию. У дверей Безу дёргает тебя за рукав.'
    - speaker: bezout
      emotion: smile
      text: 'Слушай… Капитаны обязаны благодарить команду. Это морской закон.'
    - narration: 'Она встаёт на носочки и чмокает тебя в щёку. Губы у неё холодные и пахнут дождём.'
    - speaker: bezout
      emotion: embarrassed
      text: 'Всё! Морской закон соблюдён! Отдать швартовы! И Гаусс — ни слова!'

id: bezout_02
title: Алгоритм Евклида
character: bezout
background: courtyard
nodes:
  start:
    - narration: 'Безу рисует мелом на асфальте таблицу из четырёх столбцов: «делимое», «делитель», «частное», «остаток».'
    - speaker: bezout
      emotion: smile
      text: 'Сегодня делим добычу. $30$ монет на $12$ кадетов: каждому по $2$, и $6$ остаётся. Пишем: $30 = 12 \cdot 2 + 6$. Остаток $6$ меньше $12$, значит, раздали до конца: ещё по одной всем не хватит.'
    - speaker: bezout
      emotion: serious
      text: 'Кольцо, где так можно делить всегда, называют евклидовой областью. Это область целостности $R$, у которой есть норма $N\colon R \setminus \{0\} \to \mathbb{N} \cup \{0\}$ — «размер» элемента — с двумя свойствами.'
    - speaker: bezout
      emotion: serious
      text: 'Первое: $N(ab) \ge N(a)$ при $b \ne 0$, умножение не уменьшает размер. Второе, главное, — деление с остатком: для любых $a$ и $b \ne 0$ найдутся $q$ и $r$, такие что $a = bq + r$, причём $r = 0$ или $N(r) < N(b)$.'
    - speaker: student_a
      emotion: thinking
      text: 'В $\mathbb{Z}$ норма — это модуль числа? $N(a) = |a|$?'
    - speaker: bezout
      emotion: happy
      text: 'Да! И остаток по модулю меньше делителя. Ещё пример — многочлены над полем, там норма — степень. Их разберём отдельно. Гаусс любит третий пример, целые гауссовы числа $a + bi$ с нормой $a^2 + b^2$.'
    - speaker: bezout
      emotion: serious
      text: 'Теперь НОД. Элемент $d$ — наибольший общий делитель $a$ и $b$, если: 1) $d \mid a$ и $d \mid b$; 2) любой общий делитель $c$ делит $d$.'
    - speaker: student_b
      emotion: confused
      text: 'А где тут «наибольший»? Ни слова про «больше».'
    - speaker: bezout
      emotion: smug
      text: 'Хороший вопрос, кадет! В кольце может не быть никакого «больше». «Наибольший» здесь — по делимости: все остальные общие делители делят его. В $\mathbb{Z}$ для $12$ и $18$ общие делители $\pm 1, \pm 2, \pm 3, \pm 6$, и все они делят $6$.'
    - speaker: bezout
      emotion: smile
      text: 'Но они делят и $-6$! Так что НОД определён с точностью до ассоциированности. Если $d$ и $d''$ — оба НОД, то $d \mid d''$ и $d'' \mid d$: каждый общий делитель делит другого. Значит, $d \sim d''$. В $\mathbb{Z}$ обычно берут положительный.'
    - goto: euclid
  euclid:
    - speaker: bezout
      emotion: explain
      text: 'Полный вперёд, алгоритм Евклида! Найдём $\gcd(252, 105)$. Делим большее на меньшее, потом делитель на остаток, и так, пока не разделится нацело.'
    - speaker: bezout
      emotion: smile
      text: '$$252 = 105 \cdot 2 + 42,$$ $$105 = 42 \cdot 2 + 21,$$ $$42 = 21 \cdot 2 + 0.$$ Последний ненулевой остаток — $21$. Это и есть НОД.'
    - speaker: student_b
      emotion: thinking
      text: 'Быстро. Но почему он вообще закончится? Вдруг остатки будут идти вечно?'
    - speaker: bezout
      emotion: happy
      text: 'Не будут! Каждый следующий остаток по норме меньше предыдущего: $N(r_0) > N(r_1) > N(r_2) > \dots$. А нормы — натуральные числа. Строго убывать вечно натуральные числа не могут, когда-нибудь остаток станет нулём.'
    - speaker: bezout
      emotion: explain
      text: 'Почему последний ненулевой остаток — НОД? Всё держится на одном наблюдении. Если $a = bq + r$, то общие делители пары $(a, b)$ и пары $(b, r)$ — одни и те же.'
    - speaker: bezout
      emotion: smile
      text: 'Проверим. Если $c \mid a$ и $c \mid b$, то $c$ делит и $r = a - bq$. Если $c \mid b$ и $c \mid r$, то $c$ делит и $a = bq + r$. Значит, пары $(252, 105)$, $(105, 42)$, $(42, 21)$, $(21, 0)$ имеют одинаковые общие делители.'
    - speaker: bezout
      emotion: happy
      text: 'А у пары $(21, 0)$ НОД очевиден: это $21$, ноль делится на всё. Значит, и у $(252, 105)$ НОД $21$. В общем случае: в евклидовой области НОД любых двух элементов существует, и алгоритм Евклида его находит.'
    - speaker: student_a
      emotion: thinking
      text: 'А если одно из чисел ноль с самого начала?'
    - speaker: bezout
      emotion: smile
      text: 'Тогда всё совсем просто: $\gcd(a, 0) = a$. И сразу запишем это в нужной форме: $a = a \cdot 1 + 0 \cdot 0$. Зачем такая странная запись — сейчас поймёшь.'
    - goto: bezout
  bezout:
    - speaker: bezout
      emotion: smug
      text: 'А теперь моя теорема! Соотношение Безу: в евклидовой области НОД представляется в виде $d = ax + by$ для некоторых $x, y \in R$. Мне за неё до сих пор приятно.'
    - speaker: bezout
      emotion: explain
      text: 'Найдём $x$ и $y$ для $252$ и $105$. Идём по алгоритму снизу вверх. Из второй строки: $21 = 105 - 2 \cdot 42$. Из первой: $42 = 252 - 2 \cdot 105$. Подставляем:'
    - speaker: bezout
      emotion: smile
      text: '$$21 = 105 - 2 \cdot (252 - 2 \cdot 105) = 5 \cdot 105 - 2 \cdot 252.$$ Проверка на палубе: $525 - 504 = 21$. Сошлось! $x = -2$, $y = 5$.'
    - speaker: bezout
      emotion: serious
      text: 'В общем виде так. Каждый остаток выражается через $a$ и $b$: $r_0 = a - q_0 b$, $r_1 = b - q_1 r_0 = -q_1 a + (1 + q_0 q_1) b$, и дальше по индукции. Каждый следующий остаток — разность двух предыдущих с коэффициентом, а они уже вида $Sa + Tb$. Значит, и последний остаток $d = Sa + Tb$.'
    - speaker: bezout
      emotion: smile
      text: 'Кстати, отсюда второй способ увидеть, что $d$ — НОД. Любой общий делитель $c$ делит $a$ и $b$, а значит, и $Sa + Tb = d$. Это ровно условие 2 из определения.'
    - choice:
        question: '$\gcd(30, 12) = 6$. Какая пара $(x, y)$ даёт $30x + 12y = 6$?'
        options:
          - text: '$x = 1$, $y = -2$'
            goto: pair_right
          - text: '$x = 2$, $y = -5$'
            goto: pair_wrong
          - text: '$x = 1$, $y = 2$'
            goto: pair_wrong
  pair_wrong:
    - speaker: bezout
      emotion: thinking
      text: 'Проверим подстановкой. Алгоритм: $30 = 12 \cdot 2 + 6$, значит, $6 = 30 - 2 \cdot 12 = 30 \cdot 1 + 12 \cdot (-2)$. Попробуй свою пару: получится не $6$.'
    - goto: pair_right
  pair_right:
    - speaker: bezout
      emotion: happy
      text: '$30 - 24 = 6$, курс верный! Кстати, пара не единственная: $x = -1$, $y = 3$ тоже подходит, $-30 + 36 = 6$. Соотношение Безу говорит, что пара есть, но не что она одна.'
    - speaker: bezout
      emotion: explain
      text: 'И главное следствие, запиши его крупно. $\gcd(a, b) = 1$ тогда и только тогда, когда $ax + by = 1$ для каких-то $x, y$. Туда — по соотношению Безу. Обратно — любой общий делитель делит $ax + by = 1$, значит, обратим.'
    - speaker: student_a
      emotion: happy
      text: 'Записала красным! А зачем оно нам?'
    - speaker: bezout
      emotion: smug
      text: 'Затем, что из $ax + by = 1$ получается обратный элемент на часах. Это расскажет Гаусс. А Нётер покажет, что из деления с остатком следует ещё кое-что: все идеалы главные. Сдаю вахту!'
unlocks: [gcd_euclid, bezout_min_x]

id: heine_bond_1
title: Зрительный контакт
character: heine
background: seminar_room
nodes:
  start:
    - narration: 'Аудитория дискуссионного клуба. Гейне ходит между рядами, размахивая карточками, и спорит сама с собой на два голоса.'
    - speaker: heine
      emotion: happy
      text: 'О, ты как раз вовремя! Завтра финал, а у меня проблема. Тренер говорит, что я не держу зрительный контакт. Начинаю волноваться и смотрю в пол.'
    - speaker: heine
      emotion: smug
      text: 'Есть упражнение: двое смотрят друг другу в глаза. Кто первый отвёл взгляд, тот проиграл. Сыграешь со мной? Проигравший исполняет желание!'
    - choice:
        question: 'Что ответить?'
        options:
          - text: 'Давай. Только чур с близкого расстояния.'
            goto: close
          - text: 'А какое желание у тебя?'
            goto: wish
  wish:
    - speaker: heine
      emotion: smug
      text: 'Секрет! Скажу, когда выиграю. А я выиграю, я капитан клуба!'
    - goto: close
  close:
    - narration: 'Гейне ставит два стула друг напротив друга и садится так близко, что ваши колени соприкасаются.'
    - speaker: heine
      emotion: smile
      text: 'Начали. Смотрим. Не моргаем. Я вообще-то в этом профи.'
    - narration: 'Её малиновые глаза совсем рядом. Через десять секунд она начинает краснеть. Через двадцать — кусать губу.'
    - speaker: heine
      emotion: embarrassed
      text: 'Это… это нечестно. Почему ты так смотришь? Ох, я даже говорить не могу нормально!'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Наклониться ещё ближе.'
            goto: closer
          - text: 'Улыбнуться.'
            goto: smile
  closer:
    - narration: 'Ты наклоняешься. Гейне не отводит взгляд. Между вами остаётся сантиметр, и она шумно сглатывает.'
    - speaker: heine
      emotion: embarrassed
      text: 'Контраргумент…'
    - narration: 'И она закрывает глаза. Секунду ничего не происходит, а потом Гейне вскакивает, опрокидывая стул.'
    - speaker: heine
      emotion: surprised
      text: 'Я закрыла глаза! Это считается как отвела взгляд! Я проиграла! Как я могла проиграть, я же… ой.'
    - goto: end
  smile:
    - narration: 'Ты улыбаешься. Гейне держится ещё секунду и сдаётся: прячет лицо в карточках.'
    - speaker: heine
      emotion: embarrassed
      text: 'Удар ниже пояса! Улыбаться было нельзя! В правилах этого не было, но было нельзя!'
    - goto: end
  end:
    - speaker: heine
      emotion: smile
      text: 'Ладно. Признаю поражение. Честно. Говори своё желание.'
    - choice:
        question: 'Какое желание?'
        options:
          - text: 'Завтра после победы — свидание.'
            goto: date
          - text: 'Скажи, какое желание было у тебя.'
            goto: her_wish
  date:
    - speaker: heine
      emotion: embarrassed
      text: 'Свидание?! Это… это не желание, это… Ладно. Принято. Но только после победы. Значит, мне придётся победить. Обязательно!'
    - goto: final
  her_wish:
    - speaker: heine
      emotion: embarrassed
      text: 'Моё? Я хотела… Короче! Чтобы завтра в первом ряду было твоё лицо. И смотрело на меня. Вот так же.'
    - goto: final
  final:
    - narration: 'У двери Гейне вдруг возвращается, быстро целует тебя в щёку и отскакивает на безопасное расстояние.'
    - speaker: heine
      emotion: smug
      text: 'Это тренировка! Перед финалом нужно победить хоть в чём-нибудь!'

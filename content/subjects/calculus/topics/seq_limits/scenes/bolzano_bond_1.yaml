id: bolzano_bond_1
title: Глава с поцелуем
character: bolzano
background: library
nodes:
  start:
    - narration: 'Дальний угол библиотеки. Больцано читает, поджав ноги на стуле. Книга обёрнута в обложку от учебника, но читает она её с подозрительно розовыми щеками.'
    - speaker: bolzano
      emotion: surprised
      text: '…Ой! Привет. Я… читаю учебник. Очень… увлекательный.'
    - narration: 'Из-под обложки выглядывает край настоящей: розовая, с принцем, обнимающим принцессу.'
    - choice:
        question: 'Что сказать?'
        options:
          - text: 'Прочитаешь мне вслух?'
            goto: read
          - text: 'Это та самая глава, где они наконец целуются?'
            goto: kiss_chapter
  kiss_chapter:
    - speaker: bolzano
      emotion: embarrassed
      text: 'Ты… ты знаешь эту книгу? Да. Это та самая глава. Я… читаю её третий раз.'
    - goto: read
  read:
    - speaker: bolzano
      emotion: embarrassed
      text: 'Вслух? Это… можно я тихо? Очень тихо?'
    - narration: 'Ты садишься рядом. Больцано читает, и голос у неё становится всё тише, так что приходится наклоняться всё ближе.'
    - speaker: bolzano
      emotion: embarrassed
      text: '«…Он взял её за подбородок, и она поняла, что больше не может отвести взгляд…» Ой. Дальше я не могу. Дальше… слишком.'
    - narration: 'Она поднимает глаза и обнаруживает, что ваши лица почти соприкасаются. Очки начинают запотевать.'
    - speaker: bolzano
      emotion: embarrassed
      text: 'Можно я спрошу… Как ты думаешь, в жизни это бывает так же? Как в книжке?'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Мягко взять её за подбородок, как в книге.'
            goto: chin
          - text: 'Снять с неё запотевшие очки.'
            goto: glasses
  chin:
    - narration: 'Больцано замирает. Её губы приоткрываются, она закрывает глаза…'
    - narration: '…и тут её очки стукаются о твой нос.'
    - speaker: bolzano
      emotion: surprised
      text: 'Ай! Прости! Прости, прости! В книжке у неё не было очков!'
    - speaker: bolzano
      emotion: embarrassed
      text: 'Значит… в жизни не так, как в книжке. Значит, надо… надо попробовать ещё раз. Когда-нибудь. Когда я сниму очки. Наверное.'
    - goto: end
  glasses:
    - narration: 'Ты осторожно снимаешь с неё очки. Без них Больцано щурится и наклоняется ещё ближе, чтобы рассмотреть твоё лицо.'
    - speaker: bolzano
      emotion: embarrassed
      text: 'Я тебя почти не вижу. Только… очень близко. Вот так видно. Ой. Это слишком близко?'
    - speaker: bolzano
      emotion: smile
      text: '…Мне кажется, нет.'
    - narration: 'Она быстро, неумело клюёт тебя в щёку и прячется за книгой.'
    - goto: end
  end:
    - speaker: bolzano
      emotion: embarrassed
      text: 'Можно я дочитаю главу одна? И… можно я потом расскажу, чем кончилось? Лично. Тебе.'
    - narration: 'Из-за книги видны только розовые уши.'

id: student_a_bond_1
title: Клубничное мороженое
character: student_a
background: courtyard
nodes:
  start:
    - narration: 'Контрольная позади. Во дворе пахнет сиренью. Юи сидит на скамейке с рожком клубничного мороженого и жмурится от солнца.'
    - speaker: student_a
      emotion: happy
      text: 'Всё закончилось! Я так переживала, что ночью мне снилось, будто я пришла на контрольную в пижаме. Со звёздочками!'
    - speaker: student_a
      emotion: smile
      text: 'Садись! Я и тебе взяла. Клубничное, как у меня. Я подумала… ну, что тебе тоже понравится.'
    - narration: 'Мороженое тает быстрее, чем вы его едите. Юи откусывает слишком большой кусок, и розовая капля стекает с рожка ей на шею, к самой ключице.'
    - speaker: student_a
      emotion: surprised
      text: 'Ой! Холодно! Ой-ой, оно течёт за воротник! У меня руки заняты, у меня сумка, у меня рожок…'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Достать платок и вытереть каплю.'
            goto: wipe
          - text: 'Подержать её рожок, пока она справится сама.'
            goto: hold
  wipe:
    - narration: 'Ты осторожно проводишь платком по её шее. Юи замирает и запрокидывает голову, открывая шею ещё больше. Кожа под платком тёплая и стремительно розовеет.'
    - speaker: student_a
      emotion: embarrassed
      text: 'Щекотно… Нет, не останавливайся, там ещё… ниже… Ой, нет, ниже не надо! То есть… уже всё. Спасибо!'
    - goto: talk
  hold:
    - narration: 'Ты берёшь её рожок. Юи расстёгивает верхнюю пуговицу блузки и торопливо вытирает шею салфеткой, то и дело поглядывая на тебя.'
    - speaker: student_a
      emotion: embarrassed
      text: 'Не смотри так! То есть смотри… но не туда. На мороженое смотри! Оно тоже тает!'
    - goto: talk
  talk:
    - narration: 'Юи застёгивает воротник обратно, но щёки у неё ещё долго не остывают.'
    - speaker: student_a
      emotion: thinking
      text: 'Знаешь, я всё время волнуюсь. Перед контрольными, перед разговорами, перед тем, как зайти в столовую. Хината говорит, что я переживаю за двоих.'
    - speaker: student_a
      emotion: smile
      text: 'А с тобой спокойно. Даже когда сердце колотится. Особенно когда колотится. Это странно, да?'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Взять её за руку.'
            goto: hand
          - text: 'Сказать: «У меня тоже колотится».'
            goto: heart
  hand:
    - speaker: student_a
      emotion: embarrassed
      text: 'За руку?! У меня пальцы липкие от мороженого! Подожди… а, ладно!'
    - narration: 'Она переплетает свои пальцы с твоими. Они холодные, сладкие и немного дрожат.'
    - goto: end
  heart:
    - speaker: student_a
      emotion: surprised
      text: 'Правда? Можно… проверить?'
    - narration: 'Юи прикладывает ладонь к твоей груди, слушает, широко раскрыв глаза, и вдруг краснеет до корней волос.'
    - speaker: student_a
      emotion: embarrassed
      text: 'Колотится. Очень. Из-за меня? …Не отвечай! Я сама додумаю. Цветными ручками.'
    - goto: end
  end:
    - narration: 'Юи вскакивает, быстро наклоняется и целует тебя в щёку. От неё пахнет клубникой.'
    - speaker: student_a
      emotion: embarrassed
      text: 'Это… это было клубничное! Не я! Мороженое! Пока!'
    - narration: 'Она убегает, прижимая сумку к груди, и спотыкается на ровном месте у самых ворот.'

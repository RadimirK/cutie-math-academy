id: student_b_bond_1
title: Подушка на перемене
character: student_b
background: corridor
nodes:
  start:
    - narration: 'Большая перемена. Хината сидит на широком подоконнике в коридоре, болтает ногами и с тоской смотрит на пустую обёртку от шоколадки.'
    - speaker: student_b
      emotion: sad
      text: 'О, привет. Я опять пропустила обед. Сначала дедлайн, потом очередь. Шоколадка — это почти еда, если долго на неё смотреть.'
    - narration: 'Ты садишься рядом и открываешь своё бенто. Хината смотрит на него, как кошка на сметану.'
    - speaker: student_b
      emotion: smug
      text: 'Слушай… а покорми меня? Ну, «а-а-ам», как в аниме. У меня руки устали. От дедлайна.'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Покормить её с палочек.'
            goto: feed
          - text: 'Протянуть палочки: «Сама справишься».'
            goto: tease
  tease:
    - speaker: student_b
      emotion: angry
      text: 'Жестоко! Бессердечно! …Ладно, тогда я сама. Но ты держишь коробку. Близко.'
    - narration: 'Она ест прямо из коробки у тебя в руках, наклоняясь так низко, что её чёлка касается твоих пальцев.'
    - goto: crumb
  feed:
    - speaker: student_b
      emotion: happy
      text: 'А-а-ам!'
    - narration: 'Хината съедает рисовый шарик с твоих палочек и довольно жмурится. Потом ещё один. И ещё.'
    - speaker: student_b
      emotion: embarrassed
      text: 'Вкусно… Слушай, это оказалось смущающе. В аниме это выглядит проще. Почему у меня горят уши?'
    - goto: crumb
  crumb:
    - narration: 'У неё на губе остаётся рисинка.'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Снять рисинку пальцем.'
            goto: finger
          - text: 'Показать на свою губу: «У тебя тут…»'
            goto: point
  finger:
    - narration: 'Ты снимаешь рисинку с её губы. Хината замирает с полуоткрытым ртом.'
    - speaker: student_b
      emotion: embarrassed
      text: '…Если ты ещё раз так сделаешь, я влюблюсь. Я предупреждаю. Это опасно. Для тебя.'
    - goto: nap
  point:
    - speaker: student_b
      emotion: smug
      text: 'Тут? Не вижу. Короче, сними!'
    - narration: 'Она подставляет лицо и закрывает глаза. Рисинка снимается легко. А вот Хината глаза открывать не спешит.'
    - goto: nap
  nap:
    - narration: 'Сытая Хината зевает, смотрит на тебя, на твои колени и, не спрашивая, укладывает на них голову.'
    - speaker: student_b
      emotion: smile
      text: 'Пять минут. Разбуди перед звонком. У тебя удобные колени. Я это запомню и буду использовать.'
    - narration: 'Через минуту она спит. Рыжая прядка-завиток щекочет тебе ладонь.'
    - narration: 'Звенит звонок. Хината открывает один глаз.'
    - speaker: student_b
      emotion: embarrassed
      text: 'Звонок уже был? И меня никто не будил? Ты специально, да? Чтобы я подольше полежала?'
    - speaker: student_b
      emotion: happy
      text: 'Завтра обед с меня. Честно-честно. И колени тоже с меня. То есть… ну, ты понимаешь. Пока!'

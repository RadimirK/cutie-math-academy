id: weierstrass_bond_1
title: Молния на спине
character: weierstrass
background: dressing_room
nodes:
  start:
    - narration: 'Вечер. Аудиторию на время превратили в гримёрку театрального кружка: вешалки с костюмами, зеркало, коробки с блёстками. Из-за ширмы доносится сдавленное ворчание.'
    - speaker: weierstrass
      emotion: smug
      text: 'А, дружок. Как вовремя. Режиссёр наконец-то дал мне роль феи. И костюм. Который явно шили для кого-то другого.'
    - narration: 'Вейерштрасс выходит из-за ширмы в лёгком серебристом платье с прозрачными крылышками. Платье сидит идеально, кроме одного: молния на спине расстёгнута до самой талии.'
    - speaker: weierstrass
      emotion: embarrassed
      text: 'Не дотягиваюсь. Ни сверху, ни снизу. Это заговор. Застегнёшь?'
    - narration: 'Она поворачивается спиной и откидывает волосы на плечо. Открывается светлая кожа и тонкая полоска бретельки.'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Медленно застегнуть молнию.'
            goto: slow
          - text: 'Застегнуть быстро, глядя в потолок.'
            goto: fast
  slow:
    - narration: 'Молния ползёт вверх с тихим шорохом. Пальцы случайно касаются её спины, и Вейерштрасс вздрагивает.'
    - speaker: weierstrass
      emotion: smug
      text: 'Руки холодные. И дрожат. Волнуешься, юный аналитик?'
    - speaker: weierstrass
      emotion: embarrassed
      text: '…Я тоже. Только тихо. Это ломает мой образ.'
    - goto: mirror
  fast:
    - narration: 'Ты застёгиваешь молнию одним движением, старательно изучая трещины на потолке.'
    - speaker: weierstrass
      emotion: smug
      text: 'Какая скромность. Знаешь, это даже обидно. Можно было и посмотреть. Чуть-чуть.'
    - goto: mirror
  mirror:
    - narration: 'Вейерштрасс поворачивается к зеркалу. Крылышки дрожат, подол переливается. Без ухмылки и халата она выглядит совсем по-другому.'
    - speaker: weierstrass
      emotion: thinking
      text: 'Все годы мне давали злодеек. «У тебя злодейское лицо». А я всю жизнь хотела вот это. Крылышки. Свет. Чтобы спасать, а не пугать.'
    - speaker: weierstrass
      emotion: embarrassed
      text: 'Ну? Как я? Только честно. Нет, не честно. Скажи, что хорошо.'
    - choice:
        question: 'Что сказать?'
        options:
          - text: 'Ты потрясающая. Я не могу отвести глаз.'
            goto: stunning
          - text: 'Самая красивая фея, какую видели эти стены.'
            goto: fairy
  stunning:
    - narration: 'Вейерштрасс открывает рот для какой-нибудь колкости и не находит ни одной. Кажется, впервые в жизни.'
    - speaker: weierstrass
      emotion: embarrassed
      text: '…Нечестно. Мне нечем крыть. Совсем нечем.'
    - goto: end
  fairy:
    - speaker: weierstrass
      emotion: happy
      text: 'Ха! Эти стены видели многое. Значит, я лучшая. Принимается.'
    - goto: end
  end:
    - narration: 'Она подходит ближе, поднимает руку, будто волшебную палочку, и тихо произносит реплику из роли.'
    - speaker: weierstrass
      emotion: smile
      text: '«Не бойся, дитя. Даже в самом тёмном лесу есть тропинка домой.»'
    - narration: 'И вместо взмаха палочкой наклоняется и целует тебя в лоб. Медленно.'
    - speaker: weierstrass
      emotion: smug
      text: 'Это фейское благословение. На удачу. А теперь брысь: мне ещё снимать это платье. И нет, расстёгивать помогать не надо. …Пока не надо.'

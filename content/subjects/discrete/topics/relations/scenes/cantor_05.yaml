id: cantor_05
title: Эквивалентность и порядок
character: cantor
background: library
nodes:
  start:
    - speaker: cantor
      emotion: smile
      text: 'Из пяти свойств особенно ценны две комбинации. Первая: рефлексивность, симметричность и транзитивность. Такое отношение называется отношением эквивалентности. Пример: $a \equiv_7 b$.'
    - speaker: student_a
      emotion: thinking
      text: 'А по-человечески: что такое эквивалентность?'
    - speaker: cantor
      emotion: happy
      text: '«Одинаковость по какому-то признаку»: одинаковый остаток, одинаковый цвет, одинаковый день рождения. Любое отношение вида $x \sim y \iff g(x) = g(y)$ — эквивалентность. Проверь: все три свойства наследуются от равенства.'
    - speaker: cantor
      emotion: thinking
      text: 'Главный факт: эквивалентность $\sim$ разбивает множество на непересекающиеся классы эквивалентности. Элементы одного класса эквивалентны, элементы разных классов — нет.'
    - speaker: student_b
      emotion: thinking
      text: 'Почему классы не могут пересекаться? Вдруг элемент в двух классах сразу.'
    - speaker: cantor
      emotion: smile
      text: 'Возьмём элемент $a$ и соберём всех, кто ему эквивалентен: класс $[a]$. По симметричности и транзитивности они эквивалентны и друг другу. Если бы $c$ лежал в $[a]$ и в $[b]$, то $a \sim c \sim b$, и по транзитивности $a \sim b$ — то есть $[a] = [b]$.'
    - speaker: cantor
      emotion: smile
      text: 'Множество классов называется фактормножеством и обозначается $A / {\sim}$. Для $\equiv_7$ на $\mathbb{Z}$ классы — вычеты по модулю $7$: $[0] = \{\ldots, -7, 0, 7, 14, \ldots\}$, $[1] = \{\ldots, -6, 1, 8, 15, \ldots\}$.'
    - choice:
        question: 'Сколько элементов в фактормножестве $\mathbb{Z} / {\equiv_7}$?'
        options:
          - text: 'Бесконечно много'
            goto: wrong
          - text: '$7$'
            goto: right
          - text: '$6$'
            goto: wrong
  wrong:
    - speaker: cantor
      emotion: thinking
      text: 'Каждый класс бесконечен, но самих классов мало: класс числа определяется его остатком от деления на $7$. Остатки — это $0, 1, \ldots, 6$.'
    - goto: right
  right:
    - speaker: cantor
      emotion: happy
      text: 'Семь классов, по одному на каждый остаток $0, 1, \ldots, 6$. Классы бесконечны, а фактормножество конечно.'
    - speaker: student_a
      emotion: happy
      text: 'Получается, у $x \sim y \iff g(x) = g(y)$ классов столько, сколько разных значений у $g$!'
    - speaker: cantor
      emotion: happy
      text: 'Точно. Этим удобно считать классы: придумай $g$, которое ровно описывает признак, и посчитай его значения.'
    - speaker: cantor
      emotion: smile
      text: 'Вторая комбинация: рефлексивность, антисимметричность и транзитивность. Это частичный порядок. Примеры: $\le$ на $\mathbb{R}$, делимость на $\mathbb{N}$, $\subseteq$ на $2^A$. Множество с частичным порядком называют частично упорядоченным (poset).'
    - speaker: student_b
      emotion: thinking
      text: 'А почему «частичный»?'
    - speaker: cantor
      emotion: thinking
      text: 'Некоторые элементы несравнимы: ни $2$ не делится на $3$, ни $3$ на $2$. Ни $\{1\} \subseteq \{2\}$, ни наоборот. У $\le$ на $\mathbb{R}$ несравнимых нет — это линейный порядок.'
    - speaker: cantor
      emotion: thinking
      text: 'Если заменить рефлексивность на антирефлексивность, получится строгий порядок, например $<$. Поэтому $<$ — не частичный порядок в нашем смысле: оно не рефлексивно.'
    - speaker: post
      emotion: smile
      text: 'Кстати, на наборах из нулей и единиц есть покомпонентный частичный порядок: $\alpha \le \beta$, если $\alpha_i \le \beta_i$ во всех позициях. Наборы $10$ и $01$ несравнимы. Он понадобится мне для монотонных функций.'
    - speaker: cantor
      emotion: happy
      text: 'Хитрый пример напоследок: равенство $x = y$. Оно рефлексивно, симметрично, антисимметрично и транзитивно — одновременно и эквивалентность, и частичный порядок! Каждый класс — один элемент, и никакие два разных элемента не сравнимы.'
unlocks: [equiv_or_order, equiv_classes]

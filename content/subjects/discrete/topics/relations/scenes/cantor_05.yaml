id: cantor_05
title: Эквивалентность и порядок
character: cantor
background: library
nodes:
  start:
    - speaker: cantor
      emotion: smile
      text: 'Из пяти свойств особенно ценны две комбинации. Первая: рефлексивность, симметричность и транзитивность. Такое отношение называется отношением эквивалентности. Пример: $a \equiv_7 b$.'
    - speaker: cantor
      emotion: thinking
      text: 'Главный факт: эквивалентность $\sim$ разбивает множество на непересекающиеся классы эквивалентности. Элементы одного класса эквивалентны, элементы разных классов — нет.'
    - speaker: cantor
      emotion: smile
      text: 'Почему так? Возьмём элемент $a$ и соберём всех, кто ему эквивалентен. По симметричности и транзитивности они эквивалентны и друг другу. Если бы кто-то вне этого класса был эквивалентен кому-то внутри, то по транзитивности он был бы эквивалентен и $a$. Значит, классы не пересекаются.'
    - speaker: cantor
      emotion: smile
      text: 'Множество классов называется фактормножеством и обозначается $A / {\sim}$. Для $\equiv_7$ на $\mathbb{Z}$ классы — вычеты по модулю $7$. Например, $[0] = \{\ldots, -7, 0, 7, 14, \ldots\}$, $[1] = \{\ldots, -6, 1, 8, 15, \ldots\}$.'
    - choice:
        question: 'Сколько элементов в фактормножестве $\mathbb{Z} / {\equiv_7}$?'
        options:
          - text: 'Бесконечно много'
            goto: wrong
          - text: '$7$'
            goto: right
          - text: '$6$'
            goto: wrong
  wrong:
    - speaker: cantor
      emotion: thinking
      text: 'Каждый класс бесконечен, но самих классов мало: класс числа определяется его остатком от деления на $7$. Остатки — это $0, 1, \ldots, 6$.'
    - goto: right
  right:
    - speaker: cantor
      emotion: happy
      text: 'Семь классов, по одному на каждый остаток $0, 1, \ldots, 6$. Классы бесконечны, а фактормножество конечно.'
    - speaker: cantor
      emotion: smile
      text: 'Вторая комбинация: рефлексивность, антисимметричность и транзитивность. Это частичный порядок. Примеры: $\le$ на $\mathbb{R}$, делимость на $\mathbb{N}$, $\subseteq$ на $2^A$. Множество с частичным порядком называют частично упорядоченным (по-английски poset).'
    - speaker: cantor
      emotion: thinking
      text: 'Почему «частичный»? Некоторые элементы несравнимы: ни $2$ не делится на $3$, ни $3$ на $2$. Если заменить рефлексивность на антирефлексивность, получится строгий порядок, например $<$. Отношение $>$ не частичный порядок: оно не рефлексивно.'
    - speaker: cantor
      emotion: happy
      text: 'Хитрый пример: равенство $x = y$. Оно рефлексивно, симметрично, антисимметрично и транзитивно — одновременно и эквивалентность, и частичный порядок! Каждый класс эквивалентности — один элемент, и никакие два разных элемента не сравнимы.'
unlocks: [equiv_or_order, equiv_classes]

id: cantor_06
title: Композиция и транзитивное замыкание
character: cantor
background: library
nodes:
  start:
    - speaker: cantor
      emotion: smile
      text: 'Отношения можно перемножать. Композиция $RS$ отношений $R$ и $S$ на $A$: $a \mathrel{RS} b$, если существует промежуточный $c$, такой что $a \mathrel{R} c$ и $c \mathrel{S} b$. На графе это путь: сначала стрелка $R$, потом стрелка $S$.'
    - speaker: cantor
      emotion: thinking
      text: 'Осторожно: в некоторых книгах порядок обратный, как у композиции функций $g \circ f$. У нас сначала $R$, потом $S$.'
    - speaker: cantor
      emotion: smile
      text: 'Композиция отношения с самим собой — квадрат: $R^2 = RR$. Дальше $R^k$: $a \mathrel{R^k} b$, если из $a$ в $b$ есть путь ровно из $k$ стрелок $R$. А $R^0$ — отношение равенства: путь из нуля стрелок ведёт только в себя. Равенство нейтрально относительно композиции, как единица при умножении.'
    - speaker: cantor
      emotion: smile
      text: 'Пример. На $\{1, 2, 3, 4\}$ пусть $x \mathrel{R} y$, если $y = x + 1$. Тогда $R = \{\langle 1, 2 \rangle, \langle 2, 3 \rangle, \langle 3, 4 \rangle\}$. Оно не транзитивно: $1 \mathrel{R} 2$, $2 \mathrel{R} 3$, но не $1 \mathrel{R} 3$.'
    - speaker: cantor
      emotion: thinking
      text: '$R^2$ — «больше на $2$»: $\{\langle 1, 3 \rangle, \langle 2, 4 \rangle\}$. $R^3$ — «больше на $3$»: $\{\langle 1, 4 \rangle\}$. $R^4$ здесь пусто. Заметь сходство: транзитивность говорит, что $R^2 \subseteq R$.'
    - speaker: cantor
      emotion: smile
      text: 'Хочется починить $R$: добавить как можно меньше пар, чтобы оно стало транзитивным. Добавим $R^2$ — появятся пути длины $3$, которых не хватает. Добавим $R^3$ — и так далее. Получаем транзитивное замыкание: $$R^+ = \bigcup_{i = 1}^{\infty} R^i.$$'
    - choice:
        question: 'Сколько пар в $R^+$ для нашего $R$ на $\{1, 2, 3, 4\}$?'
        options:
          - text: '$5$'
            goto: wrong
          - text: '$6$'
            goto: right
          - text: '$10$'
            goto: wrong
  wrong:
    - speaker: cantor
      emotion: thinking
      text: 'Сложи: в $R$ три пары, в $R^2$ две, в $R^3$ одна, дальше пусто. Или проще: $R^+$ — это «$x < y$», то есть все пары различных чисел, где первое меньше.'
    - goto: right
  right:
    - speaker: cantor
      emotion: happy
      text: '$3 + 2 + 1 = 6$: $R^+$ — это отношение $<$ на $\{1, 2, 3, 4\}$, $\binom{4}{2} = 6$ пар.'
    - speaker: cantor
      emotion: thinking
      text: 'Есть второе определение: транзитивное замыкание — минимальное по включению транзитивное отношение, содержащее $R$. «По включению» значит, что пары можно только добавлять. «Минимальное» значит, что у любого его собственного подмножества одно из свойств ломается.'
    - speaker: cantor
      emotion: smile
      text: 'Существует ли такое минимальное? Пересечение любых транзитивных отношений транзитивно: если $a \to b \to c$ есть в каждом, то и $a \to c$ есть в каждом. Это верно даже для бесконечного семейства. Поэтому минимальное — пересечение всех транзитивных $S \supseteq R$.'
    - speaker: cantor
      emotion: thinking
      text: 'Теорема: $R^+$ совпадает с этим пересечением. Докажем два включения. Первое: $R^+$ транзитивно (путь плюс путь — путь) и содержит $R$, так что пересечение лежит в $R^+$.'
    - speaker: cantor
      emotion: thinking
      text: 'Второе: индукцией по $i$ докажем, что $R^i$ лежит в любом транзитивном $S \supseteq R$. База: $R^1 = R \subseteq S$. Переход: если $a \mathrel{R^i} c$ и $c \mathrel{R} b$, то $a \mathrel{S} c$ и $c \mathrel{S} b$, а по транзитивности $a \mathrel{S} b$.'
    - speaker: cantor
      emotion: happy
      text: 'Общий принцип: минимальный объект с нужным свойством часто совпадает с тем, что получается конечным числом «починок». Ещё есть $R^* = \bigcup_{i = 0}^{\infty} R^i$ — рефлексивно-транзитивное замыкание, «дойти за ноль и более шагов». На алгоритмах ты встретишь его в алгоритме Флойда — Уоршелла.'
unlocks: [relation_power, closure_size]

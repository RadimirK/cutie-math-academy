id: cantor_06
title: Композиция и транзитивное замыкание
character: cantor
background: library
nodes:
  start:
    - speaker: cantor
      emotion: smile
      text: 'Отношения можно перемножать. Композиция $RS$ отношений $R$ и $S$ на $A$: $a \mathrel{RS} b$, если существует промежуточный $c$, такой что $a \mathrel{R} c$ и $c \mathrel{S} b$. На графе это путь: сначала стрелка $R$, потом стрелка $S$.'
    - speaker: student_a
      emotion: thinking
      text: 'Пример бы. Что будет, если скомпоновать «быть родителем» с самим собой?'
    - speaker: cantor
      emotion: happy
      text: '«Быть бабушкой или дедушкой»! $a$ — родитель $c$, $c$ — родитель $b$. А «быть родителем» скомпоновать с «быть братом или сестрой» даст… родителя брата — то есть обычно тоже родителя.'
    - speaker: cantor
      emotion: explain
      text: 'Осторожно: в некоторых книгах порядок обратный, как у композиции функций $g \circ f$. У нас сначала $R$, потом $S$.'
    - speaker: cantor
      emotion: smile
      text: 'Композиция отношения с самим собой — квадрат: $R^2 = RR$. Дальше $R^k$: $a \mathrel{R^k} b$, если из $a$ в $b$ есть путь ровно из $k$ стрелок $R$.'
    - speaker: student_b
      emotion: thinking
      text: 'А $R^0$? Путь из нуля стрелок?'
    - speaker: cantor
      emotion: smile
      text: 'Путь из нуля стрелок никуда не ведёт: из $a$ можно «дойти» только до самого $a$. Поэтому $R^0$ — отношение равенства. Оно нейтрально относительно композиции, как единица при умножении: $R \cdot R^0 = R$.'
    - speaker: cantor
      emotion: smile
      text: 'Пример. На $\{1, 2, 3, 4\}$ пусть $x \mathrel{R} y$, если $y = x + 1$. Тогда $R = \{\langle 1, 2 \rangle, \langle 2, 3 \rangle, \langle 3, 4 \rangle\}$. Оно не транзитивно: $1 \mathrel{R} 2$, $2 \mathrel{R} 3$, но не $1 \mathrel{R} 3$.'
    - speaker: cantor
      emotion: thinking
      text: '$R^2$ — «больше на $2$»: $\{\langle 1, 3 \rangle, \langle 2, 4 \rangle\}$. $R^3$ — «больше на $3$»: $\{\langle 1, 4 \rangle\}$. $R^4$ здесь пусто.'
    - speaker: student_a
      emotion: explain
      text: 'Смотрите: транзитивность — это ровно $R^2 \subseteq R$! «Если дошёл за два шага, дойдёшь и за один».'
    - speaker: cantor
      emotion: happy
      text: 'Прекрасно подмечено. Теперь хочется починить $R$: добавить как можно меньше пар, чтобы оно стало транзитивным.'
    - speaker: student_b
      emotion: smile
      text: 'Легко: добавим $R^2$, и всё.'
    - speaker: cantor
      emotion: thinking
      text: 'Проверим. В $R \cup R^2$ есть $1 \to 3$ и $3 \to 4$, а $1 \to 4$ нет. Починили одно — сломали другое: теперь есть пути длины $3$, которые нужно укоротить. Добавим $R^3$, потом $R^4$… Получаем транзитивное замыкание: $$R^+ = \bigcup_{i = 1}^{\infty} R^i.$$'
    - choice:
        question: 'Сколько пар в $R^+$ для нашего $R$ на $\{1, 2, 3, 4\}$?'
        options:
          - text: '$5$'
            goto: wrong
          - text: '$6$'
            goto: right
          - text: '$10$'
            goto: wrong
  wrong:
    - speaker: cantor
      emotion: thinking
      text: 'Сложи: в $R$ три пары, в $R^2$ две, в $R^3$ одна, дальше пусто. Или проще: $R^+$ — это «$x < y$», то есть все пары различных чисел, где первое меньше.'
    - goto: right
  right:
    - speaker: cantor
      emotion: happy
      text: '$3 + 2 + 1 = 6$: $R^+$ — это отношение $<$ на $\{1, 2, 3, 4\}$, $\binom{4}{2} = 6$ пар.'
    - speaker: student_b
      emotion: thinking
      text: 'А бесконечная степень $R^\infty$ бывает? Раз уж объединение до бесконечности.'
    - speaker: cantor
      emotion: smile
      text: 'Нет: путь бесконечной длины никуда не приходит. Объединение бесконечное, но каждый путь в нём конечен. На конечном множестве из $n$ элементов хватит степеней до $n$.'
    - speaker: cantor
      emotion: thinking
      text: 'Есть второе определение: транзитивное замыкание — минимальное по включению транзитивное отношение, содержащее $R$. «По включению» значит, что пары можно только добавлять. «Минимальное» значит, что у любого его собственного подмножества одно из свойств ломается.'
    - speaker: student_a
      emotion: thinking
      text: 'А минимальное всегда существует? Вдруг их несколько и они несравнимы.'
    - speaker: cantor
      emotion: smile
      text: 'Хороший вопрос. Ключ: пересечение транзитивных отношений транзитивно. Если $a \to b \to c$ есть в каждом, то и $a \to c$ есть в каждом. Это верно даже для бесконечного семейства. Значит, пересечение всех транзитивных $S \supseteq R$ — само транзитивно, содержит $R$ и лежит в любом другом таком $S$.'
    - speaker: cantor
      emotion: explain
      text: 'Теорема: $R^+$ совпадает с этим пересечением. Докажем два включения. Первое: $R^+$ транзитивно (путь плюс путь — путь) и содержит $R$ — значит, это одно из пересекаемых отношений, и пересечение лежит в $R^+$.'
    - speaker: cantor
      emotion: thinking
      text: 'Второе: индукцией по $i$ докажем, что $R^i$ лежит в любом транзитивном $S \supseteq R$. База: $R^1 = R \subseteq S$. Переход: если $a \mathrel{R^i} c$ и $c \mathrel{R} b$, то по предположению $a \mathrel{S} c$, а $c \mathrel{S} b$, и по транзитивности $a \mathrel{S} b$.'
    - speaker: student_b
      emotion: thinking
      text: 'Я потерялась. Зачем два определения одного и того же?'
    - speaker: cantor
      emotion: happy
      text: 'Первое удобно вычислять: добавляй пути. Второе удобно доказывать: «самое маленькое с нужным свойством». Общий принцип, который встретится ещё не раз: минимальный объект с нужным свойством совпадает с тем, что получается конечным числом «починок».'
    - speaker: cantor
      emotion: smile
      text: 'Ещё есть $R^* = \bigcup_{i = 0}^{\infty} R^i$ — рефлексивно-транзитивное замыкание: «дойти за ноль и более шагов». На алгоритмах ты встретишь его в алгоритме Флойда — Уоршелла.'
    - speaker: boole
      emotion: smile
      text: 'А замыкание множества функций относительно подстановок будет у меня. Та же идея: всё, что можно получить конечным числом шагов.'
unlocks: [relation_power, closure_size]

id: cantor_04
title: Отношения и их свойства
character: cantor
background: classroom
nodes:
  start:
    - speaker: cantor
      emotion: smile
      text: 'Функция — это множество пар с условием: у каждого $x$ ровно один $y$. Уберём условие, и получится отношение. Отношение между $X$ и $Y$ — любое подмножество $R \subseteq X \times Y$.'
    - speaker: student_b
      emotion: thinking
      text: 'Любое? Даже пустое?'
    - speaker: cantor
      emotion: smile
      text: 'Даже пустое, и даже всё $X \times Y$. Примеры из жизни: $X$ и $Y$ — люди, $\langle x, y \rangle \in R$, если $x$ — родитель $y$. Или $X$ — люди, $Y$ — собаки, и $x$ — хозяин $y$.'
    - speaker: student_a
      emotion: thinking
      text: 'Но у бродячей собаки нет хозяина, а у меня две собаки. Для функции так нельзя.'
    - speaker: cantor
      emotion: happy
      text: 'Именно поэтому это отношение, а не функция. Никаких ограничений: у кого-то нет пар, у кого-то много.'
    - speaker: cantor
      emotion: thinking
      text: 'Из математики: $\le$ на $\mathbb{R}$ — это множество пар $\langle x, y \rangle$, где $x \le y$. Пара $\langle 1, 2 \rangle$ в нём есть, а $\langle 2, 0 \rangle$ нет. Вместо $\langle x, y \rangle \in R$ обычно пишут инфиксно: $x \mathrel{R} y$, как $x \le y$.'
    - speaker: student_b
      emotion: thinking
      text: 'Звучит как замкнутый круг: $\le$ — это множество пар, где $x \le y$.'
    - speaker: cantor
      emotion: smile
      text: 'Порядок на $\mathbb{R}$ определяют на матанализе, когда строят вещественные числа. Мы лишь собираем готовый порядок во множество пар и даём ему имя.'
    - speaker: cantor
      emotion: smile
      text: 'Если $X = Y = A$, говорят «отношение на $A$». Для таких отношений есть пять важных свойств. Кванторы «для любых $x, y, z$» в определениях обычно опускают.'
    - speaker: cantor
      emotion: smile
      text: '1. Рефлексивность: $x \mathrel{R} x$ для всех $x$. 2. Антирефлексивность: $x \mathrel{R} x$ не выполнено ни для одного $x$.'
    - speaker: student_a
      emotion: thinking
      text: 'Разве это не противоположности? Не рефлексивное — значит антирефлексивное.'
    - speaker: cantor
      emotion: thinking
      text: 'Нет! Бывает ни то ни другое: «$x$ — законный представитель $y$». Взрослый сам себе представитель, а ребёнок нет. «Не для всех» и «ни для одного» — разные вещи.'
    - speaker: cantor
      emotion: smile
      text: '3. Симметричность: $x \mathrel{R} y \Rightarrow y \mathrel{R} x$. Пары $\langle x, x \rangle$ на неё не влияют. Пример: $a \equiv_7 b$ — «$a$ и $b$ дают одинаковый остаток при делении на $7$».'
    - speaker: cantor
      emotion: thinking
      text: '4. Антисимметричность: при $x \ne y$ не бывает сразу $x \mathrel{R} y$ и $y \mathrel{R} x$. Равносильно: $x \mathrel{R} y \wedge y \mathrel{R} x \Rightarrow x = y$. Диагональные пары снова не мешают — ими ведают свойства 1 и 2. Пример: $\le$.'
    - speaker: student_b
      emotion: thinking
      text: 'Опять не противоположности? Не симметричное — значит антисимметричное?'
    - speaker: cantor
      emotion: smile
      text: 'Опять нет. $|x - y| \le 1$ на $\mathbb{Z}$ — симметрично. Делимость на $\mathbb{Z}$ — ни то ни другое. А равенство $x = y$ — и то и другое сразу!'
    - speaker: cantor
      emotion: smile
      text: '5. Транзитивность: $x \mathrel{R} y \wedge y \mathrel{R} z \Rightarrow x \mathrel{R} z$. Примеры: $<$, $\le$, делимость, $\equiv_7$. А «быть родителем» не транзитивно: родитель родителя — дедушка.'
    - choice:
        question: 'Антисимметрично ли отношение «$a$ делится на $b$» на целых числах $\mathbb{Z}$?'
        options:
          - text: 'Да, как и на $\mathbb{N}$'
            goto: wrong
          - text: 'Нет'
            goto: right
  wrong:
    - speaker: cantor
      emotion: thinking
      text: 'На $\mathbb{N}$ да: если $a$ делится на $b$, а $b$ на $a$, то $a = b$. Но на $\mathbb{Z}$ возьми $2$ и $-2$: они делятся друг на друга, а равными не являются.'
    - goto: right
  right:
    - speaker: cantor
      emotion: happy
      text: 'Верно, не антисимметрично: $2$ и $-2$ делятся друг на друга, но $2 \ne -2$. Вот почему важно, на каком множестве задано отношение.'
    - speaker: student_a
      emotion: thinking
      text: 'А как проверять транзитивность, если пар много? Перебирать все тройки?'
    - speaker: cantor
      emotion: smile
      text: 'Нарисуй граф: элементы — вершины, пара $\langle x, y \rangle$ — стрелка из $x$ в $y$. Рефлексивность — петли у всех вершин. Симметричность — у каждой стрелки есть обратная. Транзитивность — у каждого пути из двух стрелок есть «короткий путь» из одной.'
      figure: {type: relation, nodes: [1, 2, 3], edges: '1>1 2>2 3>3 1>2 2>3 1>3'}
    - speaker: cantor
      emotion: smile
      text: 'Вот $\le$ на $\{1, 2, 3\}$. Петли у всех — рефлексивно. Обратных стрелок нет — антисимметрично. Путь $1 \to 2 \to 3$ срезан стрелкой $1 \to 3$ — транзитивно.'
    - speaker: student_b
      emotion: thinking
      text: 'А если стереть стрелку $1 \to 3$?'
      figure: {type: relation, nodes: [1, 2, 3], edges: '1>1 2>2 3>3 1>2 2>3'}
    - speaker: cantor
      emotion: thinking
      text: 'Тогда путь $1 \to 2 \to 3$ остался без «короткого пути», и транзитивность пропала. А вот $1 \to 2$ и $2 \to 1$ — путь из двух стрелок, который возвращается в $1$. Его «короткий путь» — петля в $1$.'
      figure: {type: relation, nodes: [1, 2, 3], edges: '1>2 2>1 1>1 2>2'}
    - speaker: boole
      emotion: thinking
      text: 'И осторожнее с пустыми случаями! Пустое отношение транзитивно и симметрично: посылка «$x \mathrel{R} y$» не выполняется ни разу, а контрпример должен её выполнить.'
      figure: {type: relation, nodes: [1, 2, 3]}
    - speaker: cantor
      emotion: happy
      text: 'Сколько вообще отношений на $n$-элементном множестве $A$? Отношение — подмножество $A \times A$, где $n^2$ пар. Каждую пару берём или нет, значит, отношений $2^{n^2}$.'
      figure: null
    - speaker: student_b
      emotion: thinking
      text: 'А рефлексивных?'
    - speaker: cantor
      emotion: smile
      text: 'Считай, какие пары выбираются свободно. У рефлексивного все $n$ диагональных пар обязаны быть, остальные $n^2 - n$ — свободны. Для симметричного выбираем диагональ и по одному решению на каждую пару $\{x, y\}$. Попробуй сама в задачах.'
unlocks: [relation_props, count_relations, count_antisymmetric, relation_graph]

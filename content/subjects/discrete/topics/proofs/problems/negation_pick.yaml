id: negation_pick
title: Отрицание утверждения
difficulty: 1
answer_type: choice
params:
  q:
    type: pick
    values:
      - {s: 'для любого $x \in A$ верно $P(x)$', x: 'существует $x \in A$, для которого $P(x)$ неверно', y: 'для любого $x \in A$ утверждение $P(x)$ неверно', z: 'существует $x \in A$, для которого $P(x)$ верно', ans: 'существует $x \in A$, для которого $P(x)$ неверно'}
      - {s: '$f$ инъективна: для любых $x_1 \ne x_2$ верно $f(x_1) \ne f(x_2)$', x: 'для любых $x_1 \ne x_2$ верно $f(x_1) = f(x_2)$', y: 'существуют $x_1 \ne x_2$, для которых $f(x_1) = f(x_2)$', z: 'существуют $x_1 = x_2$, для которых $f(x_1) \ne f(x_2)$', ans: 'существуют $x_1 \ne x_2$, для которых $f(x_1) = f(x_2)$'}
      - {s: '$f$ сюръективна: для любого $y$ существует $x$, что $f(x) = y$', x: 'для любого $y$ существует $x$, что $f(x) \ne y$', y: 'существует $x$, что для любого $y$ верно $f(x) \ne y$', z: 'существует $y$, что для любого $x$ верно $f(x) \ne y$', ans: 'существует $y$, что для любого $x$ верно $f(x) \ne y$'}
      - {s: '$R$ транзитивно: из $x \mathrel{R} y$ и $y \mathrel{R} z$ следует $x \mathrel{R} z$', x: 'существуют $x, y, z$: $x \mathrel{R} y$, $y \mathrel{R} z$, но не $x \mathrel{R} z$', y: 'существуют $x, y, z$: не $x \mathrel{R} y$, не $y \mathrel{R} z$, но $x \mathrel{R} z$', z: 'для любых $x, y, z$ из $x \mathrel{R} y$ и $y \mathrel{R} z$ следует не $x \mathrel{R} z$', ans: 'существуют $x, y, z$: $x \mathrel{R} y$, $y \mathrel{R} z$, но не $x \mathrel{R} z$'}
      - {s: 'если $P$, то $Q$', x: 'если не $P$, то не $Q$', y: '$P$ и не $Q$', z: 'если $Q$, то $P$', ans: '$P$ и не $Q$'}
      - {s: 'существует функция, лежащая во всех классах Поста', x: 'существует функция, не лежащая ни в одном классе Поста', y: 'любая функция не лежит ни в одном классе Поста', z: 'любая функция не лежит хотя бы в одном классе Поста', ans: 'любая функция не лежит хотя бы в одном классе Поста'}
      - {s: 'система $A$ полна: любая функция выражается через $A$', x: 'существует функция, которая не выражается через $A$', y: 'никакая функция не выражается через $A$', z: 'любая функция не выражается через $A$ хотя бы одним способом', ans: 'существует функция, которая не выражается через $A$'}
statement: 'Какое утверждение является отрицанием утверждения «<<q.s>>»?'
config:
  options: ['<<q.x>>', '<<q.y>>', '<<q.z>>']
answer: '<<q.ans>>'
hint: '$\neg \forall = \exists \neg$, $\neg \exists = \forall \neg$, $\neg(P \Rightarrow Q) = P \wedge \neg Q$. Посылку импликации не отрицают.'

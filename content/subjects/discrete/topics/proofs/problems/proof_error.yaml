id: proof_error
title: Найди ошибку
difficulty: 2
answer_type: choice
params:
  q:
    type: pick
    values:
      - {p: '«Все булевы функции от двух переменных монотонны: $\wedge$ монотонна и $\vee$ монотонна.»', x: 'Проверены лишь примеры, а утверждение — «для всех»', y: 'Неверно определена монотонность', z: 'Ошибки нет', ans: 'Проверены лишь примеры, а утверждение — «для всех»'}
      - {p: '«Все лошади одного цвета. База: одна лошадь. Переход: уберём из $n + 1$ лошадей первую, потом последнюю — обе группы одноцветны, значит, все.»', x: 'Нет базы индукции', y: 'Переход не работает при $n = 1$: у двух групп нет общей лошади', z: 'Индукцию нельзя применять к лошадям', ans: 'Переход не работает при $n = 1$: у двух групп нет общей лошади'}
      - {p: '«$\wedge$ нельзя выразить через $\{\to\}$, потому что $\to \notin T_0$, а $\wedge \in T_0$.»', x: 'Класс $T_0$ не замкнут', y: 'Ошибки нет', z: 'Нужно, чтобы вся система лежала в классе, а $g$ — нет; здесь наоборот', ans: 'Нужно, чтобы вся система лежала в классе, а $g$ — нет; здесь наоборот'}
      - {p: '«Если $n^2$ чётно, то $n$ чётно. Доказательство: пусть $n = 2k$, тогда $n^2 = 4k^2$ чётно.»', x: 'Доказано обратное утверждение', y: 'Нужна индукция', z: 'Ошибки нет', ans: 'Доказано обратное утверждение'}
      - {p: '«КНФ $F$ задаёт $f$: на каждой единице $f$ все дизъюнкты $F$ истинны.»', x: 'КНФ не может задавать функцию', y: 'Не проверено, что на каждом нуле $f$ формула $F$ ложна', z: 'Ошибки нет', ans: 'Не проверено, что на каждом нуле $f$ формула $F$ ложна'}
      - {p: '«$\wedge$ нельзя выразить через $\{\downarrow\}$: у $\downarrow$ есть свойство $f(0, \ldots, 0) = 1$, у $\wedge$ — нет.»', x: 'У $\downarrow$ нет этого свойства', y: 'Ошибки нет', z: 'Свойством не обладают переменные, поэтому оно не сохраняется при подстановках', ans: 'Свойством не обладают переменные, поэтому оно не сохраняется при подстановках'}
      - {p: '«Функция $f$ не монотонна, потому что $f(1, 0) = 1$, а $f(0, 1) = 0$.»', x: 'Наборы $10$ и $01$ несравнимы, это не нарушение монотонности', y: 'Нужно проверить все наборы', z: 'Ошибки нет', ans: 'Наборы $10$ и $01$ несравнимы, это не нарушение монотонности'}
statement: 'Найдите ошибку в рассуждении: <<q.p>>'
config:
  options: ['<<q.x>>', '<<q.y>>', '<<q.z>>']
answer: '<<q.ans>>'
hint: 'Проверьте: доказано ли утверждение для всех объектов, в нужную ли сторону импликация, выполнены ли все условия применяемого метода.'

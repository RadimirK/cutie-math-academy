id: proof_02
title: Индукция
character: cantor
background: library
nodes:
  start:
    - speaker: cantor
      emotion: smile
      text: 'Главный инструмент дискретки — математическая индукция. Хотим доказать $P(n)$ для всех $n \ge 1$. База: доказываем $P(1)$. Переход: доказываем, что из $P(n)$ следует $P(n + 1)$ для любого $n$. Тогда $P$ верно для всех: от $1$ по цепочке доберёмся до любого $n$.'
    - speaker: cantor
      emotion: smile
      text: 'Пример: $|2^A| = 2^{|A|}$ индукцией по $|A|$. База: $|A| = 0$, подмножество одно — пустое, $2^0 = 1$. Переход: добавим к $A$ новый элемент $a$. Каждое старое подмножество $S$ даёт два новых — $S$ и $S \cup \{a\}$. Подмножеств стало вдвое больше.'
    - speaker: student_b
      emotion: happy
      text: 'Я тоже умею! Докажу, что все лошади одного цвета. База: одна лошадь — одного цвета. Переход: из $n + 1$ лошадей уберём первую — оставшиеся $n$ одного цвета. Уберём последнюю — тоже. Значит, все $n + 1$ одного цвета.'
    - choice:
        question: 'Где ошибка у Хинаты?'
        options:
          - text: 'Нет базы'
            goto: wrong_base
          - text: 'Переход не работает при $n = 1$'
            goto: right
          - text: 'Индукцию нельзя применять к лошадям'
            goto: wrong_horses
  wrong_base:
    - speaker: cantor
      emotion: thinking
      text: 'База есть и верна: одна лошадь одного цвета. Проверь переход при самом маленьком $n$: из двух лошадей.'
    - goto: right
  wrong_horses:
    - speaker: cantor
      emotion: thinking
      text: 'Лошади тут ни при чём, индукция применима к любому утверждению про натуральное $n$. Проверь переход при самом маленьком $n$.'
    - goto: right
  right:
    - speaker: cantor
      emotion: happy
      text: 'Переход должен работать для каждого $n$, в том числе для самого маленького. При $n = 1$ две группы — «без первой» и «без последней» — не пересекаются, и склеить их цвета нельзя. Всегда проверяй переход на самом маленьком случае.'
    - speaker: cantor
      emotion: smile
      text: 'Варианты индукции. Сильная индукция: разрешаем в переходе опираться на все меньшие значения, а не только на $n - 1$. Структурная индукция: по дереву формулы, по числу шагов алгоритма, по числу переменных. Буль и Пост пользовались ею постоянно.'
    - speaker: cantor
      emotion: thinking
      text: 'Самый важный приём — усиление предположения. Бывает, что утверждение $P(n)$ индукцией не доказывается: предположения $P(n)$ не хватает для перехода. Тогда доказывают более сильное утверждение — и индукция проходит!'
    - speaker: student_a
      emotion: thinking
      text: 'Как более сильное может доказываться легче?'
    - speaker: cantor
      emotion: happy
      text: 'Потому что предположение индукции тоже становится сильнее. Пример: $1 + \frac{1}{4} + \frac{1}{9} + \ldots + \frac{1}{n^2} < 2$. Переход ломается: из «$S_n < 2$» не следует «$S_n + \frac{1}{(n + 1)^2} < 2$».'
    - speaker: cantor
      emotion: thinking
      text: 'Усилим: $S_n \le 2 - \frac{1}{n}$. База: $1 \le 2 - 1$. Переход: $S_{n + 1} \le 2 - \frac{1}{n} + \frac{1}{(n + 1)^2} \le 2 - \frac{1}{n + 1}$, потому что $\frac{1}{(n + 1)^2} \le \frac{1}{n(n + 1)} = \frac{1}{n} - \frac{1}{n + 1}$. Прошло!'
    - speaker: post
      emotion: smile
      text: 'Тот же трюк у меня в теме про длину формул: доказывали не «у $f$ есть короткая формула», а «у пары $f$, $\neg f$ есть короткие формулы». И в теореме о медиане: индукция по числу переменных внутри класса монотонных самодвойственных функций.'
    - speaker: cantor
      emotion: smile
      text: 'Индукция часто даёт рекурренту. Например, $L(n) \le 2L(n - 1) + c$. Как её оценить? Развернём: $$L(n) \le 2L(n - 1) + c \le 4L(n - 2) + 2c + c \le \ldots \le 2^{n - 1} L(1) + c(2^{n - 1} - 1).$$'
    - speaker: cantor
      emotion: smile
      text: 'Значит, $L(n) \le 2^{n - 1}(L(1) + c)$. Развёрнутую формулу можно сначала угадать, а потом строго доказать индукцией: подставь её в переход и проверь.'
    - speaker: student_a
      emotion: happy
      text: 'То есть план такой: развернуть, угадать закрытую формулу, доказать индукцией.'
    - speaker: cantor
      emotion: happy
      text: 'Именно. А если в рекурренте сумма по всем меньшим, как $2^{2^n} = \sum_k \binom{n}{k} E(k)$, то это сильная индукция: $E(n)$ выражается через все предыдущие.'
unlocks: [recurrence_value]

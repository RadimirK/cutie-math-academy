id: cantor_01
title: Множество всего на свете
character: cantor
background: classroom
nodes:
  start:
    - narration: 'Первая пара по дискретной математике. У доски стоит Кантор и рисует огромные фигурные скобки.'
    - speaker: cantor
      emotion: smile
      text: 'Я Кантор. Дискретная математика стоит на одном понятии, которое мы даже не будем определять, — на множестве.'
    - speaker: student_b
      emotion: thinking
      text: 'Как это «не будем определять»? Множество — это же просто набор элементов.'
    - speaker: cantor
      emotion: thinking
      text: 'А что такое набор? «Совокупность»? А совокупность — это что? Любое определение сведётся к синониму. Поэтому множество — базовое понятие, как точка в геометрии. Мы знаем только, как с ним обращаться.'
    - speaker: cantor
      emotion: smile
      text: 'Про объект $x$ и множество $A$ можно спросить одно: лежит ли $x$ в $A$. Пишем $x \in A$ или $x \notin A$. Ответ — только «да» или «нет».'
    - speaker: student_a
      emotion: thinking
      text: 'Тогда элемент не может лежать в множестве дважды? $\{1, 1, 2\}$ — это то же, что $\{1, 2\}$?'
    - speaker: cantor
      emotion: happy
      text: 'Именно! Если повторы важны, это мультимножество. Но его можно выразить через обычные множества — например, как функцию «элемент → сколько раз он встречается». Новая аксиома не нужна.'
    - speaker: cantor
      emotion: smile
      text: 'Самый простой способ задать множество — перечислить элементы: $\{1, 2, 3\}$. Если не перечислить никого, получится пустое множество $\varnothing = \{\}$. Но так задаются только конечные множества.'
    - speaker: cantor
      emotion: smile
      text: 'Бесконечные задаём условием. Сначала фиксируем универсум — все объекты, о которых идёт речь, например целые числа $\mathbb{Z}$. Потом выбираем: $\{k \mid k \text{ делится на } 2\}$ — все чётные числа. Черта $\mid$ читается «таких, что».'
    - speaker: student_b
      emotion: thinking
      text: 'А зачем универсум? Можно же написать прямо в скобках: $\{k \mid k \in \mathbb{Z},\ k \text{ чётно}\}$. И вообще, пусть в множестве лежит что угодно.'
    - speaker: cantor
      emotion: thinking
      text: 'Давай попробуем. Разрешим брать что угодно, в том числе другие множества. Например, $\{1, \mathbb{N}, \{\text{студенты группы}\}\}$. Пока не страшно. Но тогда про множество можно спросить, лежит ли оно в самом себе.'
    - speaker: cantor
      emotion: thinking
      text: 'Рассмотрим $R = \{X \mid X \notin X\}$ — множество всех множеств, которые не содержат сами себя. Выглядит даже безобиднее, чем множество, содержащее само себя.'
    - choice:
        question: 'Лежит ли $R$ в самом себе?'
        options:
          - text: 'Да, $R \in R$'
            goto: yes_branch
          - text: 'Нет, $R \notin R$'
            goto: no_branch
  yes_branch:
    - speaker: cantor
      emotion: thinking
      text: 'Пусть $R \in R$. Тогда $R$ — один из элементов $R$ и удовлетворяет их условию: $R \notin R$. Противоречие!'
    - speaker: student_b
      emotion: smile
      text: 'Ну тогда $R \notin R$, делов-то.'
    - speaker: cantor
      emotion: smile
      text: 'Проверим. Если $R \notin R$, то $R$ подходит под условие $X \notin X$ — значит, обязано лежать в $R$. Снова противоречие.'
    - goto: paradox
  no_branch:
    - speaker: cantor
      emotion: thinking
      text: 'Пусть $R \notin R$. Но тогда $R$ подходит под условие $X \notin X$ и обязано лежать в $R$. Противоречие!'
    - speaker: student_b
      emotion: smile
      text: 'Ну тогда $R \in R$, делов-то.'
    - speaker: cantor
      emotion: smile
      text: 'Проверим. Если $R \in R$, то $R$ удовлетворяет условию своих элементов: $R \notin R$. Снова противоречие.'
    - goto: paradox
  paradox:
    - speaker: student_b
      emotion: thinking
      text: 'Подождите. Оба варианта невозможны? Но $R$ же существует, я его только что написала!'
    - speaker: cantor
      emotion: happy
      text: 'В этом и соль. Это парадокс Рассела: не всякое описание «множество таких $X$, что…» задаёт множество. Множества всех множеств просто не существует.'
    - speaker: student_a
      emotion: thinking
      text: 'Похоже на брадобрея, который бреет всех, кто не бреется сам. Бреет ли он себя?'
    - speaker: cantor
      emotion: smile
      text: 'Та же ловушка. Вывод про брадобрея простой: такого брадобрея нет. А вот что множество, записанное на бумаге, может не существовать, — для математиков начала XX века это был шок.'
    - speaker: cantor
      emotion: smile
      text: 'Бороться с этим можно по-разному. В аксиоматике Цермело — Френкеля множества строятся из пустого по строгим правилам, и сослаться на себя нельзя. Мы поступим конкретнее: всегда работаем внутри фиксированного универсума конкретных объектов — чисел, людей, цветов.'
    - speaker: student_a
      emotion: thinking
      text: 'А какие универсумы хорошие? «Множество людей» подойдёт?'
    - speaker: cantor
      emotion: thinking
      text: 'С точки зрения парадоксов — да, хотя «человек» определён расплывчато: живые? предки? Хорошие универсумы — $\mathbb{Z}$, $\mathbb{N}$, $\mathbb{R}$. А «множество всех функций» — плохой: из какого множества в какое? Он выводит нас за рамки любого универсума.'
    - narration: 'Кантор стирает доску и рисует два пересекающихся круга.'
      figure: {type: venn, sets: [A, B]}
    - speaker: cantor
      emotion: smile
      text: 'Теперь операции. Объединение $A \cup B$ — элементы, лежащие хотя бы в одном.'
      figure: {type: venn, sets: [A, B], shade: 'A | B'}
    - speaker: cantor
      emotion: smile
      text: 'Пересечение $A \cap B$ — лежащие в обоих.'
      figure: {type: venn, sets: [A, B], shade: 'A & B'}
    - speaker: cantor
      emotion: smile
      text: 'Разность $A \setminus B$ — лежащие в $A$, но не в $B$.'
      figure: {type: venn, sets: [A, B], shade: 'A - B'}
    - speaker: student_b
      emotion: thinking
      text: 'А если $B$ больше $A$? Из маленького вычитать большое нельзя.'
    - speaker: cantor
      emotion: smile
      text: 'Можно! Разность не требует, чтобы $B$ было частью $A$. $\{1, 2\} \setminus \{2, 3, 4, 5\} = \{1\}$: просто выкидываем из $A$ то, что есть в $B$.'
      figure: {type: venn, sets: [A, B], shade: 'A - B', elements: {A: 1, AB: 2, B: '3 4 5'}}
    - speaker: cantor
      emotion: thinking
      text: 'Симметрическая разность $A \oplus B$ (ещё пишут $A \triangle B$) — элементы, лежащие ровно в одном из двух: $A \oplus B = (A \setminus B) \cup (B \setminus A)$. Значок $\oplus$ ещё встретится нам как «исключающее или».'
      figure: {type: venn, sets: [A, B], shade: 'A ^ B'}
    - speaker: cantor
      emotion: happy
      text: 'Пример: $A = \{1, 2, 3, 4\}$, $B = \{3, 4, 5\}$. $A \cup B = \{1, 2, 3, 4, 5\}$, $A \cap B = \{3, 4\}$, $A \setminus B = \{1, 2\}$, $A \oplus B = \{1, 2, 5\}$. На кругах Эйлера — Венна это разные закрашенные области.'
      figure: {type: venn, sets: [A, B], shade: 'A ^ B', elements: {A: '1 2', AB: '3 4', B: 5}}
    - speaker: student_a
      emotion: happy
      text: 'Записала! $|A \oplus B| = |A| + |B| - 2|A \cap B|$ — общую часть мы посчитали дважды и выкинули оба раза.'
    - speaker: cantor
      emotion: happy
      text: 'Отличное наблюдение. Такие формулы подсчёта нам ещё не раз пригодятся.'
    - speaker: cantor
      emotion: smile
      text: 'С тремя множествами областей уже восемь. Например, $(A \cup B) \setminus C$ — всё, что в $A$ или в $B$, кроме попавшего в $C$. Научись читать такие картинки — в задачах они встретятся.'
      figure: {type: venn, sets: [A, B, C], shade: '(A | B) - C'}
unlocks: [set_ops, set_expr, venn_pick]

id: cantor_01
title: Множество всего на свете
character: cantor
background: classroom
nodes:
  start:
    - speaker: cantor
      emotion: smile
      text: 'Я Кантор. Дискретная математика стоит на одном понятии, которое не определяется, — на множестве. Скажешь «множество — это набор», и я спрошу, что такое набор. Скажешь «совокупность», и я спрошу снова. Поэтому множество просто берём за основу.'
    - speaker: cantor
      emotion: thinking
      text: 'Про любой объект $x$ и множество $A$ можно спросить одно: лежит ли $x$ в $A$. Пишем $x \in A$ или $x \notin A$. Ответ только «да» или «нет», поэтому элемент не может лежать в множестве «дважды»: $\{1, 1, 2\} = \{1, 2\}$. Если повторы нужны, это уже мультимножество, но его можно выразить через обычные множества.'
    - speaker: cantor
      emotion: smile
      text: 'Самый простой способ задать множество — перечислить элементы: $\{1, 2, 3\}$. Если не перечислять никого, получится пустое множество $\varnothing = \{\}$. Но так задаются только конечные множества.'
    - speaker: cantor
      emotion: smile
      text: 'Бесконечные задаём условием. Сначала фиксируем универсум, то есть все объекты, о которых идёт речь, например целые числа $\mathbb{Z}$. Потом выбираем из него: $\{k \mid k \text{ делится на } 2\}$ — все чётные числа. Раз универсум — $\mathbb{Z}$, писать «$k$ целое» уже не нужно.'
    - speaker: cantor
      emotion: thinking
      text: 'Зачем универсум, если условие можно дописать прямо в скобки? Давай откажемся от него и разрешим брать в множество что угодно, в том числе другие множества. Тогда про множество можно спросить, лежит ли оно в самом себе.'
    - speaker: cantor
      emotion: thinking
      text: 'Рассмотрим $R = \{X \mid X \notin X\}$ — множество всех множеств, которые не содержат сами себя. Выглядит безобиднее, чем множество, содержащее само себя.'
    - choice:
        question: 'Лежит ли $R$ в самом себе?'
        options:
          - text: 'Да, $R \in R$'
            goto: yes_branch
          - text: 'Нет, $R \notin R$'
            goto: no_branch
  yes_branch:
    - speaker: cantor
      emotion: thinking
      text: 'Пусть $R \in R$. Тогда $R$ удовлетворяет условию своих элементов: $R \notin R$. Противоречие!'
    - speaker: cantor
      emotion: smile
      text: 'Хорошо, а если $R \notin R$? Тогда $R$ подходит под условие $X \notin X$, значит, $R \in R$. Снова противоречие.'
    - goto: paradox
  no_branch:
    - speaker: cantor
      emotion: thinking
      text: 'Пусть $R \notin R$. Но тогда $R$ подходит под условие $X \notin X$ и обязано лежать в $R$. Противоречие!'
    - speaker: cantor
      emotion: smile
      text: 'Хорошо, а если $R \in R$? Тогда $R$ удовлетворяет условию своих элементов: $R \notin R$. Снова противоречие.'
    - goto: paradox
  paradox:
    - speaker: cantor
      emotion: happy
      text: 'Оба ответа невозможны. Это парадокс Рассела: не всякое описание «множество таких $X$, что…» задаёт множество. Множества всех множеств просто не существует.'
    - speaker: cantor
      emotion: smile
      text: 'Бороться с этим можно по-разному. В аксиоматике Цермело — Френкеля множества строятся из пустого по строгим правилам, и сослаться на себя нельзя. Мы поступим конкретнее: всегда работаем внутри фиксированного универсума конкретных объектов — чисел, людей, цветов. Тогда никаких парадоксов.'
    - speaker: cantor
      emotion: smile
      text: 'Теперь операции. Объединение $A \cup B$ — элементы, лежащие хотя бы в одном. Пересечение $A \cap B$ — лежащие в обоих. Разность $A \setminus B$ — лежащие в $A$, но не в $B$; при этом $B$ не обязано быть частью $A$.'
    - speaker: cantor
      emotion: thinking
      text: 'Симметрическая разность $A \oplus B$ (ещё пишут $A \triangle B$) — элементы, лежащие ровно в одном из двух: $A \oplus B = (A \setminus B) \cup (B \setminus A)$. Значок $\oplus$ ещё встретится нам как «исключающее или».'
    - speaker: cantor
      emotion: happy
      text: 'Пример: $A = \{1, 2, 3, 4\}$, $B = \{3, 4, 5\}$. Тогда $A \cup B = \{1, 2, 3, 4, 5\}$, $A \cap B = \{3, 4\}$, $A \setminus B = \{1, 2\}$, $A \oplus B = \{1, 2, 5\}$. Нарисуй два круга Эйлера — Венна, и всё станет видно.'
unlocks: [set_ops, set_expr]

id: cantor_bond_1
title: Под одной курткой
character: cantor
background: rooftop
nodes:
  start:
    - narration: 'Поздний вечер. Дверь на крышу почему-то не заперта. Наверху ветер и тишина, а на парапете, обхватив колени, сидит Кантор.'
    - speaker: cantor
      emotion: surprised
      text: 'Ой! Я думала, сюда никто не ходит после заката. …Хотя я рада, что это ты.'
    - speaker: cantor
      emotion: smile
      text: 'Садись рядом. Отсюда видно небо целиком. Внизу его загораживают фонари.'
    - narration: 'Порыв ветра треплет её длинные волосы. Кантор ёжится: тонкая матроска явно не рассчитана на ночь на крыше.'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Расстегнуть куртку и позвать её к себе.'
            goto: jacket
          - text: 'Просто отдать ей куртку.'
            goto: give
  jacket:
    - speaker: cantor
      emotion: embarrassed
      text: 'К тебе? Под куртку? Вдвоём? Но это же… это же очень близко…'
    - narration: 'Ещё один порыв ветра решает за неё. Кантор ныряет под полу куртки и прижимается плечом. От неё пахнет чем-то цветочным, а волосы щекочут тебе шею.'
    - speaker: cantor
      emotion: embarrassed
      text: 'Тепло… Только не двигайся, ладно? А то я услышу, как у меня колотится сердце. И ты услышишь.'
    - goto: stars
  give:
    - speaker: cantor
      emotion: surprised
      text: 'А ты? Ты же замёрзнешь!'
    - narration: 'Кантор кутается в куртку, которая ей велика, и долго смотрит на тебя поверх воротника. Потом вдруг придвигается и укрывает полой и тебя.'
    - speaker: cantor
      emotion: smile
      text: 'Так честнее. Одна куртка, двое людей. Только… придётся сидеть очень близко.'
    - goto: stars
  stars:
    - narration: 'Какое-то время вы молчите. Её голова сама собой опускается тебе на плечо.'
    - speaker: cantor
      emotion: thinking
      text: 'Знаешь, меня всегда называли мечтательницей. Говорили, что я витаю в облаках. А мне просто нравится смотреть туда, куда никто не смотрит.'
    - speaker: cantor
      emotion: embarrassed
      text: 'Например… на тебя. Сейчас. Ой. Я сказала это вслух?'
    - narration: 'Она поднимает лицо. Между вами не больше ладони. Бирюзовые глаза отражают звёзды.'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Не отводить взгляд.'
            goto: close
          - text: 'Показать на небо: «Смотри, падает звезда!»'
            goto: star
  close:
    - narration: 'Кантор медленно закрывает глаза и тянется навстречу… и в последний миг утыкается лбом тебе в плечо.'
    - speaker: cantor
      emotion: embarrassed
      text: 'Не могу! Слишком быстро! Мне нужно… нужно время, чтобы это себе представить. Очень много времени. Бесконечно много.'
    - goto: end
  star:
    - speaker: cantor
      emotion: surprised
      text: 'Где?! Ой, правда! Загадывай скорее!'
    - speaker: cantor
      emotion: smile
      text: 'Я своё загадала. Не скажу какое. Но оно сидит рядом и греет мне плечо.'
    - goto: end
  end:
    - speaker: cantor
      emotion: smile
      text: 'Пойдём вниз, пока комендант не заперла дверь.'
    - narration: 'У самой лестницы Кантор вдруг привстаёт на цыпочки и быстро касается губами твоей щеки.'
    - speaker: cantor
      emotion: embarrassed
      text: 'Это за куртку! Только за куртку! Спокойной ночи!'
    - narration: 'Она сбегает по ступенькам, и только в самом низу ты замечаешь, что куртку она так и не вернула.'

id: cantor_02
title: Подмножества, пары и произведения
character: cantor
background: classroom
nodes:
  start:
    - speaker: cantor
      emotion: smile
      text: 'Сначала два значка, без которых в математике ни шагу. $\forall$ — «для любого» (перевёрнутая A, от any/all). $\exists$ — «существует» (перевёрнутая E, от exists).'
    - speaker: cantor
      emotion: smile
      text: '$\forall x\ P(x)$: утверждение $P$ верно для всех $x$ из универсума. $\exists x\ P(x)$: найдётся хотя бы один такой $x$. Отрицание переворачивает кванторы: «не для всех» — это «существует, для которого нет».'
    - speaker: cantor
      emotion: smile
      text: '$A$ — подмножество $B$, пишем $A \subseteq B$, если $\forall a\ (a \in A \Rightarrow a \in B)$. Каждое множество — подмножество самого себя: $A \subseteq A$.'
    - speaker: student_b
      emotion: thinking
      text: 'А пустое множество — подмножество чего?'
    - speaker: cantor
      emotion: thinking
      text: 'Всего! Чтобы $\varnothing \subseteq A$ было ложно, нужен элемент $\varnothing$, которого нет в $A$. А элементов у $\varnothing$ нет. Условие «для любого элемента пустого множества…» выполнено автоматически.'
    - speaker: boole
      emotion: smile
      text: 'Простите, что вмешиваюсь. Это моя любимая тема: из ложной посылки следует что угодно. Подробности — на моих занятиях!'
    - speaker: cantor
      emotion: thinking
      text: 'Спасибо, Буль. Теперь главное: не путай $\in$ и $\subseteq$! Смотри на них как на типы в программировании. $\mathbb{N}$ имеет тип «множество чисел». Тогда $2 \in \mathbb{N}$ корректно и $\{2\} \subseteq \mathbb{N}$ корректно.'
    - speaker: cantor
      emotion: thinking
      text: 'А $2 \subseteq \mathbb{N}$ и $\{2\} \in \mathbb{N}$ — ошибки типов. Число не бывает подмножеством, а множество не лежит среди чисел. Слева от $\in$ — элемент, слева от $\subseteq$ — множество того же типа, что справа.'
    - choice:
        question: 'Какая запись корректна и верна?'
        options:
          - text: '$\{2\} \in \{1, 2, 3\}$'
            goto: wrong_in
          - text: '$\{2\} \subseteq \{1, 2, 3\}$'
            goto: right_subset
          - text: '$2 \subseteq \{1, 2, 3\}$'
            goto: wrong_subset
  wrong_in:
    - speaker: cantor
      emotion: thinking
      text: 'Элементы $\{1, 2, 3\}$ — числа $1$, $2$, $3$. Множества $\{2\}$ среди них нет, так что $\{2\} \notin \{1, 2, 3\}$. А вот в $\{\{2\}, \{3\}\}$ оно бы лежало.'
    - goto: right_subset
  wrong_subset:
    - speaker: cantor
      emotion: thinking
      text: 'Слева стоит число, а подмножеством может быть только множество. Это ошибка типов, как сравнивать строку с массивом.'
    - goto: right_subset
  right_subset:
    - speaker: cantor
      emotion: happy
      text: 'Верно: $\{2\} \subseteq \{1, 2, 3\}$, потому что единственный элемент $\{2\}$ лежит в $\{1, 2, 3\}$.'
    - speaker: student_a
      emotion: thinking
      text: 'А как доказывать, что два множества равны?'
    - speaker: cantor
      emotion: smile
      text: 'Стандартный приём: $A = B$ тогда и только тогда, когда $A \subseteq B$ и $B \subseteq A$. Доказываешь два включения — и готово. Мы так сделаем в теме про отношения.'
    - speaker: cantor
      emotion: smile
      text: 'Семейство всех подмножеств $A$ называют булеаном и пишут $\mathcal{P}(A)$ (power set) или $2^A$. Например, $2^{\{1, 2\}} = \{\varnothing, \{1\}, \{2\}, \{1, 2\}\}$.'
    - speaker: student_b
      emotion: thinking
      text: 'Стоп. Это же множество множеств! Нас только что Рассел ими пугал.'
    - speaker: cantor
      emotion: thinking
      text: 'Опасно брать множества по абстрактному критерию. А здесь мы берём части конкретного множества и за его пределы не выходим. И $A \in 2^A$ — не парадокс: $A$ имеет тип «множество элементов», а $2^A$ — «множество таких множеств». Типы сходятся.'
    - speaker: cantor
      emotion: smile
      text: 'Следующий кирпичик — упорядоченная пара $\langle a, b \rangle$: у неё есть первая и вторая компонента, и $\langle 1, 2 \rangle \ne \langle 2, 1 \rangle$. Декартово произведение $A \times B = \{\langle a, b \rangle \mid a \in A, b \in B\}$ — все такие пары.'
    - speaker: student_a
      emotion: thinking
      text: '$\mathbb{N} \times \mathbb{N}$ — это произведения натуральных чисел, $2 \cdot 3$ и так далее?'
    - speaker: cantor
      emotion: smile
      text: 'Нет, ничего не перемножаем! Это пары: $\langle 2, 3 \rangle$, $\langle 7, 1 \rangle$… «Произведение» — потому что $|A \times B| = |A| \cdot |B|$: к каждому из $|A|$ первых элементов подходит любой из $|B|$ вторых.'
    - speaker: cantor
      emotion: thinking
      text: 'Тройку можно собрать из пар: $\langle \langle x, y \rangle, z \rangle$ или $\langle x, \langle y, z \rangle \rangle$. Строго говоря, это разные объекты, но в дискретке нам всё равно, как собран кортеж. Поэтому пишем $X \times Y \times Z$ и тройки $\langle x, y, z \rangle$.'
    - speaker: cantor
      emotion: smile
      text: '$A^n = A \times \ldots \times A$ ($n$ раз) — кортежи длины $n$, то есть массивы фиксированной длины. Если $|A| = k$, то $|A^n| = k^n$: каждую позицию заполняем независимо. Считаем $A^1 = A$: кортеж длины $1$ отождествляем с самим элементом.'
    - choice:
        question: 'Сколько элементов в $A^0$?'
        options:
          - text: '$0$ — это пустое множество'
            goto: wrong_zero
          - text: '$1$'
            goto: right_zero
          - text: 'Не определено'
            goto: wrong_zero
  wrong_zero:
    - speaker: student_b
      emotion: thinking
      text: 'Ну ноль же. Кортежей длины ноль не бывает.'
    - speaker: cantor
      emotion: thinking
      text: 'Бывает! Элементы $A^0$ — кортежи длины $0$. Такой кортеж есть, и он ровно один: пустой кортеж $\langle\rangle$. Ничего не сделать можно ровно одним способом, как бы студенты ни старались найти их много.'
    - goto: right_zero
  right_zero:
    - speaker: cantor
      emotion: happy
      text: 'Именно: $A^0 = \{\langle\rangle\}$ — одноэлементное множество из пустого кортежа. Не пустое множество! И формула $|A^0| = k^0 = 1$ сходится.'
    - speaker: boole
      emotion: happy
      text: 'Запомните этот пустой кортеж. Когда будем считать булевы функции от нуля аргументов, он нам очень пригодится.'
unlocks: [in_vs_subset, power_set_size, cartesian_size]

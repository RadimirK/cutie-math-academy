id: cantor_03
title: Функция — это множество пар
character: cantor
background: library
nodes:
  start:
    - speaker: cantor
      emotion: smile
      text: 'Что такое функция? В школе это «правило», и у синуса есть смысл: ордината точки на окружности. Теория множеств смысл отбрасывает. Функция $f \colon X \to Y$ — это подмножество $X \times Y$, в котором у каждого $x$ ровно одна пара:'
    - speaker: cantor
      emotion: thinking
      text: '$$f \subseteq X \times Y, \quad \forall x \in X\ \exists!\, y \in Y\colon \langle x, y \rangle \in f.$$ Значок $\exists!$ читается «существует ровно один». Синус — просто множество пар вроде $\langle 0, 0 \rangle$ и $\langle \tfrac{\pi}{2}, 1 \rangle$. Такое множество ещё называют графиком функции.'
    - speaker: cantor
      emotion: smile
      text: '$X$ — область определения, и функция обязана быть определена на каждом её элементе. Поэтому тангенс действует не из $\mathbb{R}$, а из $\mathbb{R} \setminus \{\tfrac{\pi}{2} + \pi k\}$. А вот $Y$ не обязан быть покрыт целиком: $\sin$ действует из $\mathbb{R}$ в $\mathbb{R}$, хотя значения только из $[-1, 1]$.'
    - speaker: cantor
      emotion: smile
      text: 'Три важных вида функций. Инъекция: разные аргументы дают разные значения, $x_1 \ne x_2 \Rightarrow f(x_1) \ne f(x_2)$. Сюръекция: каждый $y$ кому-то сопоставлен, $\forall y\ \exists x\colon f(x) = y$. Биекция — и то и другое сразу, взаимно однозначное соответствие.'
    - choice:
        question: 'Чем является $f(x) = x^2$ как функция $\mathbb{R} \to [0, +\infty)$?'
        options:
          - text: 'Инъекция, но не сюръекция'
            goto: wrong_inj
          - text: 'Сюръекция, но не инъекция'
            goto: right_surj
          - text: 'Биекция'
            goto: wrong_bij
  wrong_inj:
    - speaker: cantor
      emotion: thinking
      text: 'Проверим инъективность: $f(-2) = f(2) = 4$, разные аргументы — одно значение. Значит, не инъекция. Зато любое $y \ge 0$ получается как $f(\sqrt{y})$.'
    - goto: right_surj
  wrong_bij:
    - speaker: cantor
      emotion: thinking
      text: 'Почти! Любое $y \ge 0$ действительно достигается: $y = f(\sqrt{y})$. Но $f(-2) = f(2)$, так что инъекции нет, а значит, и биекции.'
    - goto: right_surj
  right_surj:
    - speaker: cantor
      emotion: happy
      text: 'Да, сюръекция, но не инъекция. Если сузить область определения до $[0, +\infty)$, получится биекция. Видишь: свойства зависят от того, из какого и в какое множество действует функция.'
    - speaker: cantor
      emotion: smile
      text: 'Функция двух аргументов — это просто функция из $X_1 \times X_2$: она принимает пару, и угловые скобки мы опускаем. Так же с тремя и больше аргументами. Новых понятий не нужно.'
    - speaker: cantor
      emotion: smile
      text: 'Образ множества $A \subseteq X$: $f(A) = \{f(x) \mid x \in A\}$. Прообраз $B \subseteq Y$: $f^{-1}(B) = \{x \mid f(x) \in B\}$ — все, кто попадает в $B$. Прообраз определён всегда, даже когда обратной функции нет. Например, $\sin^{-1}(\{1\}) = \{\tfrac{\pi}{2} + 2\pi k \mid k \in \mathbb{Z}\}$.'
    - speaker: cantor
      emotion: smile
      text: 'Композиция: если $f \colon X \to Y$ и $g \colon Y \to Z$, то $(g \circ f)(x) = g(f(x))$ действует из $X$ в $Z$. А «множество всех функций» — снова опасная конструкция без универсума. Безопасно множество функций из конкретного $X$ в конкретный $Y$; его обозначают $Y^X$.'
    - choice:
        question: 'Сколько существует функций из $X = \{1, 2, 3\}$ в $Y = \{a, b\}$?'
        options:
          - text: '$6$'
            goto: wrong_count
          - text: '$8$'
            goto: right_count
          - text: '$9$'
            goto: wrong_count
  wrong_count:
    - speaker: cantor
      emotion: thinking
      text: 'Запишем функцию таблицей: три строчки, $f(1)$, $f(2)$, $f(3)$. В каждую строчку независимо пишем $a$ или $b$ — по $2$ варианта. Всего $2 \cdot 2 \cdot 2$.'
    - goto: right_count
  right_count:
    - speaker: cantor
      emotion: happy
      text: '$2^3 = 8$. В общем случае $|Y^X| = |Y|^{|X|}$ — вот откуда такое обозначение.'
    - speaker: cantor
      emotion: happy
      text: 'И наконец, тайна $2^A$. Подмножество $S \subseteq A$ — то же самое, что функция $\chi_S \colon A \to \{0, 1\}$: $1$ — «элемент берём», $0$ — «не берём». Она называется характеристической функцией. Подмножеств столько же, сколько функций в двухэлементное множество: $|2^A| = 2^{|A|}$.'
unlocks: [inj_surj_choice, functions_count, preimage_size]

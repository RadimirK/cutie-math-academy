id: cantor_03
title: Функция — это множество пар
character: cantor
background: library
nodes:
  start:
    - narration: 'Библиотека кафедры. Юи раскладывает цветные ручки, Хината дописывает домашку по матанализу.'
    - speaker: cantor
      emotion: smile
      text: 'Вопрос: что такое функция?'
    - speaker: student_b
      emotion: smile
      text: 'Правило, которое по $x$ выдаёт $y$. Синус, например: берём угол, смотрим ординату точки на окружности.'
    - speaker: cantor
      emotion: thinking
      text: 'А что такое «правило»? Теория множеств отбрасывает смысл и оставляет только пары «аргумент — значение». Функция $f \colon X \to Y$ — это подмножество $X \times Y$, в котором у каждого $x$ ровно одна пара: $$\forall x \in X\ \exists!\, y \in Y\colon \langle x, y \rangle \in f.$$'
    - speaker: cantor
      emotion: smile
      text: 'Значок $\exists!$ читается «существует ровно один». Синус — просто множество пар вроде $\langle 0, 0 \rangle$ и $\langle \tfrac{\pi}{2}, 1 \rangle$. Такое множество ещё называют графиком функции. В теории множеств функция и её график — одно и то же.'
    - speaker: student_a
      emotion: thinking
      text: 'А программисты бы сказали, что функция — это алгоритм, а график — табличка. Это разное?'
    - speaker: cantor
      emotion: smile
      text: 'Для программиста разное: одно вычисляет, другое хранит. Для математика — одно. В зависимости от контекста будем их то отождествлять, то различать.'
    - speaker: cantor
      emotion: smile
      text: '$X$ — область определения, и функция обязана быть определена на каждом её элементе. Поэтому тангенс действует не из $\mathbb{R}$, а из $\mathbb{R} \setminus \{\tfrac{\pi}{2} + \pi k\}$. А $Y$ не обязан быть покрыт целиком: $\sin \colon \mathbb{R} \to \mathbb{R}$, хотя значения только из $[-1, 1]$.'
    - speaker: cantor
      emotion: smile
      text: 'Три важных вида функций. Инъекция: разные аргументы дают разные значения, $x_1 \ne x_2 \Rightarrow f(x_1) \ne f(x_2)$. Сюръекция: каждый $y$ кому-то сопоставлен, $\forall y\ \exists x\colon f(x) = y$. Биекция — и то и другое сразу, взаимно однозначное соответствие.'
    - speaker: student_b
      emotion: thinking
      text: 'Как их не перепутать?'
    - speaker: cantor
      emotion: happy
      text: 'Представь стрелки из $X$ в $Y$. Инъекция: в каждую точку $Y$ входит не больше одной стрелки. Сюръекция: хотя бы одна. Биекция: ровно одна — элементы разбиваются на пары.'
    - choice:
        question: 'Чем является $f(x) = x^2$ как функция $\mathbb{R} \to [0, +\infty)$?'
        options:
          - text: 'Инъекция, но не сюръекция'
            goto: wrong_inj
          - text: 'Сюръекция, но не инъекция'
            goto: right_surj
          - text: 'Биекция'
            goto: wrong_bij
  wrong_inj:
    - speaker: cantor
      emotion: thinking
      text: 'Проверим инъективность: $f(-2) = f(2) = 4$ — разные аргументы, одно значение. Значит, не инъекция. Зато любое $y \ge 0$ получается как $f(\sqrt{y})$.'
    - goto: right_surj
  wrong_bij:
    - speaker: cantor
      emotion: thinking
      text: 'Почти! Любое $y \ge 0$ действительно достигается: $y = f(\sqrt{y})$. Но $f(-2) = f(2)$, так что инъекции нет, а значит, и биекции.'
    - goto: right_surj
  right_surj:
    - speaker: cantor
      emotion: happy
      text: 'Да, сюръекция, но не инъекция. Если сузить область определения до $[0, +\infty)$, получится биекция. Свойства зависят от того, из какого и в какое множество действует функция.'
    - speaker: student_a
      emotion: thinking
      text: 'А функция двух аргументов, например $x + y$? Пар $\langle x, y \rangle$ как аргумента у нас не было.'
    - speaker: cantor
      emotion: smile
      text: 'Были! Это функция из $X_1 \times X_2$: она принимает пару, а угловые скобки мы просто опускаем. Функция трёх аргументов принимает тройку. Новых понятий не нужно.'
    - speaker: cantor
      emotion: smile
      text: 'Образ множества $A \subseteq X$: $f(A) = \{f(x) \mid x \in A\}$. Прообраз $B \subseteq Y$: $f^{-1}(B) = \{x \mid f(x) \in B\}$ — все, кто попадает в $B$.'
    - speaker: student_b
      emotion: thinking
      text: 'Но $f^{-1}$ — это же обратная функция. У синуса её нет, он не инъективен.'
    - speaker: cantor
      emotion: thinking
      text: 'Здесь обозначение перегружено. Прообраз множества определён всегда: $\sin^{-1}(\{1\}) = \{\tfrac{\pi}{2} + 2\pi k \mid k \in \mathbb{Z}\}$ — бесконечное множество. А обратная функция существует, только когда $f$ — биекция.'
    - speaker: student_a
      emotion: happy
      text: 'Значит, $f(f^{-1}(B)) \subseteq B$, но не обязательно равно: в $B$ могут быть точки, куда никто не попадает.'
    - speaker: cantor
      emotion: happy
      text: 'Верно! А $f^{-1}(f(A)) \supseteq A$: в прообраз могут попасть «соседи» с теми же значениями.'
    - speaker: cantor
      emotion: smile
      text: 'Композиция: если $f \colon X \to Y$ и $g \colon Y \to Z$, то $(g \circ f)(x) = g(f(x))$ действует из $X$ в $Z$. А множество всех функций из $X$ в $Y$ обозначают $Y^X$.'
    - choice:
        question: 'Сколько существует функций из $X = \{1, 2, 3\}$ в $Y = \{a, b\}$?'
        options:
          - text: '$6$'
            goto: wrong_count
          - text: '$8$'
            goto: right_count
          - text: '$9$'
            goto: wrong_count
  wrong_count:
    - speaker: cantor
      emotion: thinking
      text: 'Запишем функцию таблицей: три строчки, $f(1)$, $f(2)$, $f(3)$. В каждую строчку независимо пишем $a$ или $b$ — по $2$ варианта. Всего $2 \cdot 2 \cdot 2$.'
    - goto: right_count
  right_count:
    - speaker: cantor
      emotion: happy
      text: '$2^3 = 8$. В общем случае $|Y^X| = |Y|^{|X|}$ — вот откуда обозначение.'
    - speaker: student_b
      emotion: thinking
      text: 'А инъекций сколько, если $|X| = 3$, $|Y| = 5$?'
    - speaker: cantor
      emotion: smile
      text: 'Той же таблицей: в первую строчку — любое из $5$, во вторую — любое из оставшихся $4$, в третью — из $3$. Итого $5 \cdot 4 \cdot 3 = 60$.'
    - speaker: cantor
      emotion: happy
      text: 'И наконец, тайна $2^A$. Подмножество $S \subseteq A$ — то же самое, что функция $\chi_S \colon A \to \{0, 1\}$: $1$ — «элемент берём», $0$ — «не берём». Это характеристическая функция. Поэтому $|2^A| = 2^{|A|}$.'
    - speaker: boole
      emotion: happy
      text: 'А функции в $\{0, 1\}$ — это уже почти мои булевы функции. До встречи в моей теме!'
unlocks: [inj_surj_choice, functions_count, preimage_size]

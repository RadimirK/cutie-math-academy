id: boole_bond_1
title: Котёнок под жилетом
character: boole
background: courtyard
nodes:
  start:
    - narration: 'После занятий во дворе академии. Буль сидит на корточках у куста сирени и не двигается уже несколько минут.'
    - speaker: boole
      emotion: serious
      text: 'Тише. Не спугни.'
    - narration: 'Из-под куста выглядывает крошечный чёрно-белый котёнок. Он смотрит на Буль, на тебя и вдруг одним прыжком взлетает ей на колени.'
    - speaker: boole
      emotion: surprised
      text: 'Нет. Стой. Туда нельзя. Это не…'
    - narration: 'Котёнок деловито ныряет за отворот её чёрного жилета и исчезает. Под тканью видно, как он ползёт куда-то к боку.'
    - speaker: boole
      emotion: embarrassed
      text: 'Он внутри. Он щекочется. Это… это недопустимо. Помоги. Нет. Не помогай. Да. Помоги.'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Аккуратно расстегнуть ей пуговицу жилета.'
            goto: button
          - text: 'Отвернуться и подсказывать, где котёнок.'
            goto: guide
  button:
    - narration: 'Пальцы касаются пуговицы. Буль замирает и перестаёт дышать. Пуговица поддаётся, и из-под жилета высовывается чёрно-белая мордочка.'
    - speaker: boole
      emotion: embarrassed
      text: 'Одна пуговица. Только одна. Вторую не надо. Я считаю.'
    - narration: 'Ты вынимаешь котёнка. На секунду твоя ладонь задерживается на её боку, и Буль тихо ахает.'
    - speaker: boole
      emotion: embarrassed
      text: '…Это был котёнок. Это было из-за котёнка. Да.'
    - goto: kitten
  guide:
    - speaker: boole
      emotion: serious
      text: 'Правильно. Не смотри. Говори, куда он ползёт.'
    - narration: 'Ты слышишь за спиной возню, шорох ткани и её сдержанное «ай». Потом долгую тишину.'
    - speaker: boole
      emotion: embarrassed
      text: 'Можно поворачиваться. Я его достала. Жилет застёгнут. Смотреть было не на что. Мне так спокойнее думать.'
    - goto: kitten
  kitten:
    - narration: 'Котёнок устраивается у неё на руках и громко мурчит.'
    - speaker: boole
      emotion: smile
      text: 'Ничейный. Ошейника нет. Я его забираю. Да. Это решено.'
    - speaker: boole
      emotion: thinking
      text: 'Ему нужно имя. И кто-то, кто будет приходить к нам в гости. Вопрос: будешь приходить?'
    - choice:
        question: 'Что ответить?'
        options:
          - text: 'Буду. Ради котёнка.'
            goto: for_kitten
          - text: 'Буду. Ради тебя.'
            goto: for_her
  for_kitten:
    - speaker: boole
      emotion: smile
      text: 'Ответ принят. Неполный, но принят.'
    - goto: end
  for_her:
    - narration: 'Буль долго смотрит на тебя. Её невозмутимое лицо медленно, от ушей к щекам, становится розовым.'
    - speaker: boole
      emotion: embarrassed
      text: 'Это… было «да». Я поняла. Мой ответ тоже «да». Обычно я объясняю почему. Сейчас не буду.'
    - goto: end
  end:
    - narration: 'Буль наклоняется, будто поправить котёнку ухо, и мимолётно касается губами твоей щеки.'
    - speaker: boole
      emotion: serious
      text: 'Это была благодарность. За пуговицу. За котёнка. И вообще. Никаких «может быть».'

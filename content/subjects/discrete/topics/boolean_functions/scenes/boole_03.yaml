id: boole_03
title: Формулы, базисы и СДНФ
character: boole
background: classroom
nodes:
  start:
    - speaker: boole
      emotion: smile
      text: 'Таблица истинности — честный, но громоздкий способ. В математике функции задают формулами: не таблицу квадратов, а $f(n) = n^2$. Сделаем так же. Выберем набор базовых функций — связок $A$ — и будем собирать из них новые функции двумя операциями.'
    - speaker: boole
      emotion: thinking
      text: 'Композиция: вместо одного аргумента функции $f$ подставляем целую функцию $g$. Например, из $f = x_1 \wedge x_2$ и $g = x_1 \vee x_2$ получаем $x_1 \wedge (x_2 \vee x_3)$. Подстановка: на места аргументов ставим переменные, можно одну и ту же несколько раз. Из предыдущей функции: $y_1 \wedge (y_1 \vee y_2)$.'
    - speaker: boole
      emotion: smile
      text: 'Всё, что так получается из $A$, — это формулы над $A$. Формула, в которой каждая переменная встречается ровно один раз, называется бесповторной. Замыкание $[A]$ — множество всех функций, выразимых формулами над $A$. Если $[A]$ — это все булевы функции, система $A$ называется полной, или базисом.'
    - speaker: boole
      emotion: thinking
      text: 'Слово «базис» тут не совсем как в линейной алгебре: базис может быть избыточным, а функция — записываться по-разному. Поэтому иногда говорят «полная система». Теорема о стандартном базисе: $\{\wedge, \vee, \neg\}$ — базис.'
    - speaker: boole
      emotion: smile
      text: 'Доказательство конструктивное. Пусть $f$ не тождественный ноль. Для каждой строчки таблицы, где $f = 1$, запишем конъюнкцию: переменную, равную там $1$, берём как есть, равную $0$ — с отрицанием. Набору $\langle 0, 1, 1 \rangle$ соответствует $\neg x_1 \wedge x_2 \wedge x_3$. Такой терм равен $1$ ровно на своём наборе.'
    - speaker: boole
      emotion: smile
      text: 'Соединим все термы дизъюнкцией. На строчке с $f = 1$ «загорится» её терм. На строчке с $f = 0$ каждый терм хотя бы в одной позиции даст $0$. Получилась совершенная дизъюнктивная нормальная форма — СДНФ. «Дизъюнктивная» — снаружи $\vee$. «Совершенная» — в каждом терме все переменные ровно по разу.'
    - speaker: boole
      emotion: thinking
      text: 'Пример: $x \oplus y$ равна $1$ на наборах $01$ и $10$. Значит, СДНФ: $(\neg x \wedge y) \vee (x \wedge \neg y)$.'
    - speaker: boole
      emotion: thinking
      text: 'А тождественный ноль? У него нет единичных строк, СДНФ — пустая строка, а это непонятно что. Выразим его отдельно: $\mathbf{0} = x_1 \wedge \neg x_1$. Константы от нуля аргументов формулой не записать вовсе — нужна хотя бы одна переменная. Это технический крайний случай, мы его просто исключаем.'
    - speaker: boole
      emotion: smile
      text: 'Базис $\{\wedge, \vee, \neg\}$ избыточен. По законам де Моргана $x \vee y = \neg(\neg x \wedge \neg y)$, так что можно выкинуть $\vee$. Или $\wedge$. А $\neg$?'
    - choice:
        question: 'Можно ли выразить $\neg x$ формулой только через $\wedge$ и $\vee$?'
        options:
          - text: 'Можно, если хитро скомбинировать'
            goto: wrong
          - text: 'Нельзя'
            goto: right
  wrong:
    - speaker: boole
      emotion: thinking
      text: 'Подставь во что угодно, составленное из $\wedge$ и $\vee$, все нули. $0 \wedge 0 = 0$, $0 \vee 0 = 0$, так что вся формула даст $0$. А $\neg 0 = 1$.'
    - goto: right
  right:
    - speaker: boole
      emotion: happy
      text: 'Нельзя! Любая формула из $\wedge$ и $\vee$ на наборе из всех нулей равна $0$, а $\neg$ на нуле даёт $1$.'
    - speaker: boole
      emotion: thinking
      text: 'Докажем строго через дерево разбора. Во внутренних узлах стоят функции из базиса, в листьях — переменные. Индукция по числу внутренних узлов. База: формула — одна переменная, она на нулях равна $0$. Переход: у корня все поддеревья меньше, по предположению дают $0$, а $\wedge$ или $\vee$ от нулей — снова $0$.'
    - speaker: boole
      emotion: smile
      text: 'Рассуждение работает для любой системы, где каждая функция сохраняет ноль: $f(0, \ldots, 0) = 0$. Тогда и всё её замыкание сохраняет ноль, и базисом она не будет. Класс таких функций обозначают $T_0$.'
    - speaker: boole
      emotion: happy
      text: 'Таких «ловушек», замкнутых относительно композиции, пять: $T_0$ и $T_1$ (сохраняющие $0$ и $1$), линейные $L$, монотонные $M$ и самодвойственные $S$. Их называют классами Поста. Про них подробно расскажет Пост.'
unlocks: [truth_vector_3, sdnf_terms, formula_equiv]

id: boole_03
title: Формулы, базисы и СДНФ
character: boole
background: classroom
nodes:
  start:
    - speaker: boole
      emotion: smile
      text: 'Таблица истинности — честный, но громоздкий способ. В математике функции задают формулами: не таблицу квадратов, а $f(n) = n^2$. Сделаем так же. Выберем набор базовых функций — связок $A$ — и будем собирать из них новые функции двумя операциями.'
    - speaker: boole
      emotion: thinking
      text: 'Композиция: вместо одного аргумента функции $f$ подставляем целую функцию $g$. Например, из $f = x_1 \wedge x_2$ и $g = x_1 \vee x_2$ получаем $x_1 \wedge (x_2 \vee x_3)$ — функцию от трёх аргументов.'
    - speaker: boole
      emotion: thinking
      text: 'Подстановка: на места аргументов ставим переменные, можно одну и ту же несколько раз. Из предыдущей функции: $y_1 \wedge (y_1 \vee y_2)$. Так число аргументов можно уменьшать.'
    - speaker: student_b
      emotion: thinking
      text: 'Это всё, что мы и так делаем, когда пишем формулы со скобками?'
    - speaker: boole
      emotion: happy
      text: 'Да! Мы просто строго назвали то, что делали всегда. Всё, что так получается из $A$, — это формулы над $A$. Формула, где каждая переменная встречается ровно один раз, называется бесповторной.'
    - speaker: boole
      emotion: smile
      text: 'Формулу удобно рисовать деревом разбора. Во внутренних узлах — функции из $A$, в листьях — переменные. У $x_1 \wedge (x_2 \vee x_3)$ корень $\wedge$, слева лист $x_1$, справа узел $\vee$ с листьями $x_2$, $x_3$.'
    - speaker: boole
      emotion: smile
      text: 'Замыкание $[A]$ — множество всех функций, выразимых формулами над $A$. Если $[A]$ — это все булевы функции, система $A$ называется полной, или базисом.'
    - speaker: cantor
      emotion: smile
      text: 'Снова замыкание! Как транзитивное: всё, что достижимо конечным числом шагов.'
    - speaker: boole
      emotion: thinking
      text: 'Слово «базис» тут не совсем как в линейной алгебре: базис может быть избыточным, а функция — записываться по-разному. Поэтому иногда говорят «полная система». Теорема о стандартном базисе: $\{\wedge, \vee, \neg\}$ — базис.'
    - speaker: boole
      emotion: smile
      text: 'Доказательство конструктивное. Пусть $f$ — не тождественный ноль. Для каждой строчки таблицы, где $f = 1$, запишем конъюнкцию: переменную, равную там $1$, берём как есть, равную $0$ — с отрицанием. Набору $\langle 0, 1, 1 \rangle$ соответствует $\neg x_1 \wedge x_2 \wedge x_3$.'
    - speaker: student_a
      emotion: thinking
      text: 'И этот терм равен единице только на своём наборе?'
    - speaker: boole
      emotion: happy
      text: 'Ровно! $\neg x_1 \wedge x_2 \wedge x_3 = 1$ требует $x_1 = 0$, $x_2 = 1$, $x_3 = 1$. Теперь соединим все термы дизъюнкцией. На строчке с $f = 1$ «загорится» её терм. На строчке с $f = 0$ каждый терм хотя бы в одной позиции даст $0$.'
    - speaker: boole
      emotion: smile
      text: 'Получилась совершенная дизъюнктивная нормальная форма — СДНФ. «Дизъюнктивная» — снаружи $\vee$. «Совершенная» — в каждом терме все переменные ровно по разу. «Нормальная» — просто стандартный вид записи.'
    - speaker: boole
      emotion: thinking
      text: 'Пример: голосование $\langle xyz \rangle$ — «что у большинства» — равно $1$ на наборах $011$, $101$, $110$, $111$. СДНФ: $\neg x y z \vee x \neg y z \vee x y \neg z \vee x y z$. Длинно, но честно.'
    - speaker: student_b
      emotion: thinking
      text: 'А если записать через нули, а не через единицы?'
    - speaker: boole
      emotion: happy
      text: 'Получится двойственная конструкция — СКНФ, конъюнкция дизъюнкций по строчкам с $f = 0$. Её подробно разберёт Хорн. Спойлер: это СДНФ, «вывернутая наизнанку».'
    - speaker: boole
      emotion: thinking
      text: 'А тождественный ноль? У него нет единичных строк, СДНФ — пустая строка, а это непонятно что. Выразим его отдельно: $\mathbf{0} = x_1 \wedge \neg x_1$. Константы от нуля аргументов формулой не записать вовсе — нужна хотя бы одна переменная. Этот технический крайний случай мы просто исключаем.'
    - speaker: boole
      emotion: smile
      text: 'Базис $\{\wedge, \vee, \neg\}$ избыточен. По законам де Моргана $\neg(x \wedge y) = \neg x \vee \neg y$ и $\neg(x \vee y) = \neg x \wedge \neg y$, так что $x \vee y = \neg(\neg x \wedge \neg y)$ — можно выкинуть $\vee$. Или $\wedge$. А $\neg$?'
    - choice:
        question: 'Можно ли выразить $\neg x$ формулой только через $\wedge$ и $\vee$?'
        options:
          - text: 'Можно, если хитро скомбинировать'
            goto: wrong
          - text: 'Нельзя'
            goto: right
  wrong:
    - speaker: boole
      emotion: thinking
      text: 'Подставь во что угодно, составленное из $\wedge$ и $\vee$, все нули. $0 \wedge 0 = 0$, $0 \vee 0 = 0$, так что вся формула даст $0$. А $\neg 0 = 1$.'
    - goto: right
  right:
    - speaker: boole
      emotion: happy
      text: 'Нельзя! Любая формула из $\wedge$ и $\vee$ на наборе из всех нулей равна $0$, а $\neg$ на нуле даёт $1$.'
    - speaker: student_b
      emotion: thinking
      text: 'Интуитивно ясно. Но как это доказать строго? Формул же бесконечно много.'
    - speaker: boole
      emotion: thinking
      text: 'Индукцией по дереву разбора — по числу внутренних узлов. База: формула — одна переменная, на нулях она равна $0$. Переход: у корня все поддеревья меньше, по предположению на нулях дают $0$, а $\wedge$ или $\vee$ от нулей — снова $0$.'
    - speaker: boole
      emotion: smile
      text: 'Рассуждение работает для любой системы, где каждая функция сохраняет ноль: $f(0, \ldots, 0) = 0$. Тогда и всё её замыкание сохраняет ноль, и базисом она не будет. Класс таких функций обозначают $T_0$.'
    - speaker: student_a
      emotion: happy
      text: 'То есть чтобы доказать «через $A$ нельзя выразить $g$», достаточно найти свойство, которое есть у всех функций $A$, сохраняется при подстановках, но которого нет у $g$!'
    - speaker: boole
      emotion: happy
      text: 'Это главный инструмент для задач «можно ли выразить». Таких свойств-«ловушек» пять: $T_0$ и $T_1$ (сохраняющие $0$ и $1$), линейные $L$, монотонные $M$ и самодвойственные $S$. Классы Поста. Про них подробно расскажет Пост.'
unlocks: [truth_vector_3, sdnf_terms, formula_equiv]

id: boole_01
title: Если ложь, то что угодно
character: boole
background: classroom
nodes:
  start:
    - speaker: boole
      emotion: smile
      text: 'Я Буль. Начнём с загадки. Пусть $A = \{a, b\}$. Верно ли, что для любых $x, y, z \in A$: если $x \ne y$, $y \ne z$ и $x \ne z$, то $x = y$?'
    - speaker: student_b
      emotion: thinking
      text: 'Бред какой-то. Из «не равны» получается «равны»?'
    - choice:
        question: 'Верно ли это утверждение?'
        options:
          - text: 'Неверно: из $x \ne y$ никак не следует $x = y$'
            goto: wrong
          - text: 'Верно'
            goto: right
  wrong:
    - speaker: boole
      emotion: thinking
      text: 'А ты попробуй найти контрпример: три попарно различных элемента в двухэлементном множестве. Их нет! Посылка всегда ложна, а контрпример к «если $P$, то $Q$» должен сделать $P$ истинным.'
    - goto: right
  right:
    - speaker: boole
      emotion: happy
      text: 'Верно! Посылка «три попарно различных элемента из двух» никогда не выполняется, а из лжи следует что угодно.'
    - speaker: boole
      emotion: smile
      text: 'Это импликация $A \to B$, «если $A$, то $B$». Она ложна ровно в одном случае: посылка истинна, а следствие ложно. $$\begin{array}{cc|c} A & B & A \to B \\ \hline 0 & 0 & 1 \\ 0 & 1 & 1 \\ 1 & 0 & 0 \\ 1 & 1 & 1 \end{array}$$'
    - speaker: student_b
      emotion: thinking
      text: '«Если человек весит 800 кг, то он знает французский» — это истина? Там же никакой связи!'
    - speaker: boole
      emotion: thinking
      text: 'Причинно-следственная связь математике не важна — это вопрос философии. Важны только истинности частей. Посылка ложна — значит, импликация истинна. «Если $3 > 2$, то $7^2 > 0$» тоже истинно, хотя одно с другим никак не связано.'
    - speaker: student_a
      emotion: thinking
      text: 'А зачем такое странное соглашение?'
    - speaker: boole
      emotion: happy
      text: 'Ради утверждений «для всех». «Для любого $x$: если $x > 2$, то $x^2 > 4$» должно быть истинно. Подставь $x = 0$: посылка ложна, и эта строчка не должна портить общее утверждение. Поэтому ложная посылка даёт истину.'
    - speaker: boole
      emotion: explain
      text: 'Практический вывод: чтобы опровергнуть импликацию, контрпример должен сделать посылку истинной, а вывод ложным. Все крайние случаи с невозможной посылкой — выбрать три различных из двух, элемент из пустого множества — ничему не мешают.'
    - speaker: boole
      emotion: smile
      text: 'Теперь главные герои. $\mathbb{B} = \{0, 1\}$ — ложь и истина. Булева функция от $n$ аргументов — функция $f \colon \mathbb{B}^n \to \mathbb{B}$. Задать её проще всего таблицей истинности: $2^n$ строчек-наборов, в каждой значение $0$ или $1$.'
    - speaker: student_a
      emotion: thinking
      text: 'А почему вообще только два значения? Почему не три?'
    - speaker: boole
      emotion: smile
      text: 'Компьютер двоичный: провод либо под напряжением, либо нет. Два — минимальное число значений, в котором есть хоть какое-то разнообразие. Поэтому изучаем двоичную логику.'
    - choice:
        question: 'Сколько существует булевых функций от $2$ аргументов?'
        options:
          - text: '$4$'
            goto: wrong_count
          - text: '$8$'
            goto: wrong_count
          - text: '$16$'
            goto: right_count
  wrong_count:
    - speaker: boole
      emotion: thinking
      text: 'Посчитай строчки таблицы: наборов $\langle x, y \rangle$ всего $2^2 = 4$. В каждую строчку независимо пишем $0$ или $1$, так что столбцов значений $2^4$.'
    - goto: right_count
  right_count:
    - speaker: boole
      emotion: happy
      text: '$2^{2^2} = 16$. В общем случае функций от $n$ аргументов $2^{2^n}$: строчек $2^n$, и каждая даёт множитель $2$. При $n = 5$ их уже больше четырёх миллиардов.'
    - speaker: student_b
      emotion: happy
      text: 'То есть это $|\mathbb{B}^{\mathbb{B}^n}| = |\mathbb{B}|^{|\mathbb{B}^n|}$ из темы Кантор!'
    - speaker: boole
      emotion: thinking
      text: 'Именно. А теперь неожиданный случай $n = 0$. $\mathbb{B}^0$ — не пустое множество, а $\{\langle\rangle\}$: один пустой кортеж. Функция от нуля аргументов возвращает на нём $0$ или $1$. Это константы $\mathbf{0}$ и $\mathbf{1}$.'
    - speaker: student_a
      emotion: thinking
      text: 'А зачем жирный шрифт?'
    - speaker: boole
      emotion: smile
      text: 'Чтобы отличать тип. $0$ — значение из $\mathbb{B}$, а $\mathbf{0}$ — функция, всегда возвращающая $0$. В C++ пришлось бы завести лямбду, а не присвоить число. Функция от нуля аргументов, которая возвращает значение, — как void-функция наоборот.'
    - speaker: boole
      emotion: smile
      text: 'При $n = 1$ функций четыре. $\mathbf{0}$ и $\mathbf{1}$ (они живут при любом числе аргументов). Тождественная $\mathrm{id}(x) = x$, она же проектор $\mathrm{pr}_1$. И отрицание: $\neg x$, ещё пишут $\overline{x}$ или $!x$. $\neg 0 = 1$, $\neg 1 = 0$.'
    - speaker: boole
      emotion: happy
      text: 'Отрицание настолько важно, что на схемах его рисуют просто кружочком на проводе. В следующий раз разберём все шестнадцать функций от двух аргументов.'
unlocks: [implication_eval, bool_count]

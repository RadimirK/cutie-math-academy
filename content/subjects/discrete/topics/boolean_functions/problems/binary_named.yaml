id: binary_named
title: Узнай функцию
difficulty: 1
answer_type: choice
params:
  q:
    type: pick
    values:
      - {what: 'вектором значений $0001$', ans: 'Конъюнкция'}
      - {what: 'вектором значений $0111$', ans: 'Дизъюнкция'}
      - {what: 'вектором значений $1101$', ans: 'Импликация'}
      - {what: 'вектором значений $0110$', ans: 'Сложение по модулю 2'}
      - {what: 'вектором значений $1001$', ans: 'Эквивалентность'}
      - {what: 'вектором значений $1110$', ans: 'Штрих Шеффера'}
      - {what: 'вектором значений $1000$', ans: 'Стрелка Пирса'}
      - {what: 'формулой $\neg(x \wedge y)$', ans: 'Штрих Шеффера'}
      - {what: 'формулой $\neg x \wedge \neg y$', ans: 'Стрелка Пирса'}
      - {what: 'формулой $\neg x \vee y$', ans: 'Импликация'}
      - {what: 'формулой $(x \to y) \wedge (y \to x)$', ans: 'Эквивалентность'}
      - {what: 'формулой $(x \vee y) \wedge \neg(x \wedge y)$', ans: 'Сложение по модулю 2'}
      - {what: 'формулой $\neg(\neg x \vee \neg y)$', ans: 'Конъюнкция'}
      - {what: 'формулой $\neg(\neg x \wedge \neg y)$', ans: 'Дизъюнкция'}
      - {what: 'формулой $x \oplus y \oplus 1$', ans: 'Эквивалентность'}
      - {what: 'формулой $\neg x \vee \neg y$', ans: 'Штрих Шеффера'}
statement: 'Какая функция $f(x, y)$ задана <<q.what>>? Векторы значений записаны на наборах $00, 01, 10, 11$.'
config:
  options: [Конъюнкция, Дизъюнкция, Импликация, Сложение по модулю 2, Эквивалентность, Штрих Шеффера, Стрелка Пирса]
answer: '<<q.ans>>'
hint: 'Постройте вектор значений и сравните с таблицей шестнадцати функций.'

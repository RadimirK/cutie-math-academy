id: implication_eval
title: Истинно ли следствие?
difficulty: 1
answer_type: choice
params:
  q:
    type: pick
    values:
      - {text: 'если $2 + 2 = 5$, то $1 = 0$', ans: 'Истинно'}
      - {text: 'если $3 > 2$, то $7^2 > 0$', ans: 'Истинно'}
      - {text: 'если $3 > 2$, то $2 > 3$', ans: 'Ложно'}
      - {text: 'если $1 = 1$, то $0 = 1$', ans: 'Ложно'}
      - {text: 'если $\sqrt{2}$ рационально, то $\pi = 3$', ans: 'Истинно'}
      - {text: 'если $5$ чётно, то $5$ делится на $2$', ans: 'Истинно'}
      - {text: 'если $10$ делится на $4$, то $10$ делится на $2$', ans: 'Истинно'}
      - {text: 'если $10$ делится на $2$, то $10$ делится на $4$', ans: 'Ложно'}
      - {text: 'для любого $x \in \varnothing$ верно $x \ne x$', ans: 'Истинно'}
      - {text: 'существует $x \in \varnothing$, такой что $x = x$', ans: 'Ложно'}
      - {text: 'для любого $x \in \mathbb{R}$: если $x > 2$, то $x^2 > 4$', ans: 'Истинно'}
      - {text: 'для любого $x \in \mathbb{R}$: если $x^2 > 4$, то $x > 2$', ans: 'Ложно'}
statement: 'Истинно ли утверждение: «<<q.text>>»?'
config:
  options: [Истинно, Ложно]
answer: '<<q.ans>>'
hint: 'Импликация ложна только тогда, когда посылка истинна, а следствие ложно.'

id: post_03
title: Теорема Поста
character: post
background: library
nodes:
  start:
    - speaker: post
      emotion: explain
      text: 'Теорема Поста (критерий полноты). Система $A$ — базис тогда и только тогда, когда в ней есть функция не из $T_0$, функция не из $T_1$, немонотонная, несамодвойственная и нелинейная.'
    - speaker: student_a
      emotion: thinking
      text: 'Это должны быть пять разных функций?'
    - speaker: post
      emotion: smile
      text: 'Не обязательно. Штрих Шеффера один не лежит ни в одном классе — и потому сам по себе базис. А в $\{\neg, \wedge\}$ отрицание закрывает $T_0$, $T_1$, $M$, а конъюнкция — $S$ и $L$.'
    - speaker: post
      emotion: thinking
      text: 'Необходимость мы уже знаем: если вся система лежит в одном классе, в нём останется и замыкание, а класс — не все функции. Теперь достаточность — самое длинное доказательство курса. Приготовь бумагу и оперативную память для разбора случаев.'
    - speaker: student_b
      emotion: thinking
      text: 'Может, просто поверим?'
    - speaker: post
      emotion: happy
      text: 'Нет, тут красивые приёмы, они нужны для задач. Пусть $f_0 \notin T_0$, $f_1 \notin T_1$, $f_M \notin M$, $f_S \notin S$, $f_L \notin L$. План: сначала добыть константы $\mathbf{0}$, $\mathbf{1}$ и отрицание, потом с помощью $f_L$ — конъюнкцию. А $\{\wedge, \neg\}$ уже базис.'
    - speaker: post
      emotion: thinking
      text: 'Шаг 1. $f_0(0, \ldots, 0) = 1$. Подставим одну переменную на все места: $g(x) = f_0(x, \ldots, x)$, тогда $g(0) = 1$. Если $f_0(1, \ldots, 1) = 1$, то $g = \mathbf{1}$ (случай а). Если $0$, то $g = \neg x$ (случай б).'
    - speaker: post
      emotion: thinking
      text: 'Так же с $f_1$: $f_1(1, \ldots, 1) = 0$. Если $f_1(0, \ldots, 0) = 0$, получаем $\mathbf{0}$ (случай 1), иначе снова $\neg x$ (случай 2).'
    - speaker: student_a
      emotion: thinking
      text: 'Итого четыре комбинации. а1 — есть $\mathbf{0}$ и $\mathbf{1}$, но нет $\neg$. а2 и б1 — есть $\neg$ и одна константа, а вторая — её отрицание. б2 — только $\neg$.'
    - speaker: post
      emotion: happy
      text: 'Верно, трудные только а1 и б2. Случай а1: отрицание добудет немонотонная $f_M$. Есть наборы $\alpha \le \beta$ с $f_M(\alpha) = 1$, $f_M(\beta) = 0$. Идём от $\alpha$ к $\beta$, меняя по одной координате с $0$ на $1$. Где-то значение впервые падает с $1$ до $0$ — на соседних наборах, отличающихся только в $i$-й позиции.'
    - speaker: post
      emotion: smile
      text: 'Подставим на все позиции, кроме $i$-й, константы из этих соседних наборов, а на $i$-ю — переменную $x$. Получится $h(0) = 1$, $h(1) = 0$, то есть $\neg x$.'
    - speaker: post
      emotion: smile
      text: 'Случай б2: константу добудет несамодвойственная $f_S$. Есть набор $\alpha$ с $f_S(\neg \alpha) = f_S(\alpha)$. Подставим $x$ туда, где $\alpha_i = 1$, и $\neg x$ туда, где $\alpha_i = 0$. При $x = 1$ получим $f_S(\alpha)$, при $x = 0$ — $f_S(\neg \alpha)$, то же самое. Это константа, а вторую даст $\neg$.'
    - speaker: student_b
      emotion: thinking
      text: 'А почему в других случаях нам не понадобились немонотонная и несамодвойственная?'
    - speaker: post
      emotion: smile
      text: 'Понадобились, просто неявно: в случае б $f_0$ сама оказалась немонотонной (из $0$ в $1$ на диагонали падает), а в случаях с $\neg$ и константой несамодвойственность тоже уже «сработала». Все пять свойств нужны, но иногда их выполняет одна функция.'
    - speaker: post
      emotion: thinking
      text: 'Шаг 2. Теперь у нас есть $\mathbf{0}$, $\mathbf{1}$ и $\neg$. В полиноме $f_L$ есть моном хотя бы из двух переменных. Выберем такой моном с наименьшим числом переменных. Две его переменные оставим, $x$ и $y$. Остальным его переменным подставим $1$, а всем прочим переменным — $0$.'
    - speaker: post
      emotion: thinking
      text: 'Каждый другой нелинейный моном не лежит внутри нашего: он не короче по выбору и не совпадает с ним по единственности. Значит, в нём есть переменная, которой мы подставили $0$, и он обнуляется. Остаётся $xy \oplus ax \oplus by \oplus c$, где $a, b, c \in \{0, 1\}$.'
    - choice:
        question: 'Получилось $xy \oplus x$. Как отсюда сделать $x \wedge y$?'
        options:
          - text: 'Подставить $\neg y$ вместо $y$'
            goto: right
          - text: 'Применить $\neg$ ко всей функции'
            goto: wrong
          - text: 'Никак, нужна другая функция'
            goto: wrong
  wrong:
    - speaker: post
      emotion: thinking
      text: 'Разложим: $xy \oplus x = x(y \oplus 1) = x \wedge \neg y$. Лишнее отрицание стоит на $y$, его и надо убрать.'
    - goto: right
  right:
    - speaker: post
      emotion: happy
      text: '$xy \oplus x = x \wedge \neg y$, и подстановка $\neg y$ вместо $y$ даёт $x \wedge y$. Аналогично $xy \oplus y$. $xy \oplus x \oplus y = x \vee y$ — тоже годится, с $\neg$ это базис. Лишнее $\oplus 1$ снимаем внешним $\neg$.'
    - speaker: post
      emotion: happy
      text: 'Итак, $\{\wedge, \neg\}$ выражается через $A$, и по лемме $A$ — базис. Следствие: $x \mid y$ и $x \downarrow y$ по отдельности — базисы. Каждая не сохраняет ни $0$, ни $1$, немонотонна, несамодвойственна, а в полиноме $x \downarrow y = xy \oplus x \oplus y \oplus 1$ есть $xy$.'
    - speaker: student_a
      emotion: thinking
      text: 'Как теперь решать задачу «можно ли выразить $g$ через $A$», если $g$ — не все функции, а одна конкретная?'
    - speaker: post
      emotion: smile
      text: 'Два шага. «Нельзя»: найди класс Поста (или другое сохраняющееся свойство), где лежит вся $A$, но нет $g$. «Можно»: предъяви формулу. Если $A$ полна, формула точно есть. Если нет — ищи вручную, часто помогают подстановка констант и отождествление переменных.'
    - speaker: post
      emotion: smile
      text: 'Доказательство конструктивно: по пяти таблицам истинности можно явно выписать формулы для $\wedge$ и $\neg$, а потом через СДНФ — для любой функции. Правда, формулы получатся огромными: каждая константа сама добыта из длинной конструкции.'
    - speaker: post
      emotion: thinking
      text: 'Размер формул — отдельная интересная тема, мы к ней ещё вернёмся в разговоре о монотонных функциях. Формула сильно зависит от базиса и от изобретательности автора. Со схемами из функциональных элементов всё устроено приятнее, но это уже следующий семестр.'
unlocks: [post_complete, post_trap_class]

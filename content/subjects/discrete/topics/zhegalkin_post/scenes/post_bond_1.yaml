id: post_bond_1
title: В кладовке
character: post
background: corridor_night
nodes:
  start:
    - narration: 'Поздний вечер. Коридор пуст, горит только дежурная лампа. Навстречу, чеканя шаг, идёт Пост в своей неизменной фуражке.'
    - speaker: post
      emotion: serious
      text: 'Стой. После отбоя по коридорам не ходят. Я обязана тебя задержать.'
    - speaker: post
      emotion: thinking
      text: '…Или взять в напарники на обход. Второе интереснее. Пойдём.'
    - narration: 'Вы идёте рядом. Пост держит спину прямо, но то и дело косится в твою сторону из-под козырька.'
    - speaker: post
      emotion: surprised
      text: 'Тихо. Шаги. Это комендант. Если она увидит тебя здесь, замечание получим оба. И я тоже. Это недопустимо.'
    - narration: 'Пост хватает тебя за руку и затаскивает в ближайшую дверь. Это кладовка для швабр: тесная, тёмная и рассчитанная максимум на одно ведро.'
    - narration: 'Вы стоите вплотную. Её фуражка упирается тебе в подбородок, а ладонь всё ещё лежит у тебя на груди.'
    - speaker: post
      emotion: embarrassed
      text: '…Не дыши так громко. И не двигайся. Ты… очень близко.'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Осторожно снять с неё фуражку, чтобы не мешала.'
            goto: cap
          - text: 'Шепнуть: «Ты сама меня сюда затащила».'
            goto: tease
  cap:
    - narration: 'Фуражка оказывается у тебя в руках. Без неё Пост выглядит совсем по-другому: растрёпанная чёлка, широко раскрытые глаза.'
    - speaker: post
      emotion: embarrassed
      text: 'Верни. Без неё я… без неё я не строгая. Совсем. Ты это видишь, да?'
    - goto: steps
  tease:
    - speaker: post
      emotion: angry
      text: 'Это была тактическая необходимость!'
    - narration: 'Шёпот выходит слишком громким. Пост испуганно зажимает тебе рот ладонью и замирает, прижавшись ещё теснее.'
    - goto: steps
  steps:
    - narration: 'Шаги коменданта приближаются, останавливаются прямо у двери… и удаляются. Пост выдыхает, но отстраняться не спешит.'
    - speaker: post
      emotion: thinking
      text: 'Она ушла. Можно выходить. Устав требует выходить немедленно.'
    - narration: 'Она не двигается. Ты тоже.'
    - speaker: post
      emotion: embarrassed
      text: '…Устав ничего не говорит о том, как быстро. Ещё минуту. Для надёжности.'
    - choice:
        question: 'Что сказать?'
        options:
          - text: 'Мне здесь нравится. Даже со шваброй.'
            goto: like
          - text: 'Пост, у тебя сердце стучит.'
            goto: heart
  like:
    - speaker: post
      emotion: smile
      text: 'Швабра — свидетель. Но она будет молчать. Я ей прикажу.'
    - goto: end
  heart:
    - speaker: post
      emotion: embarrassed
      text: 'Это от бега. От тактического манёвра. И от… Неважно. Не слушай. Это не для протокола.'
    - goto: end
  end:
    - narration: 'Вы выбираетесь в коридор. Пост надевает фуражку, поправляет китель и снова становится строгой. Почти.'
    - speaker: post
      emotion: serious
      text: 'Обход окончен. Нарушений: одно. Нарушитель… помилован.'
    - speaker: post
      emotion: embarrassed
      text: 'Завтра я снова дежурю. Кладовка будет на месте. Это просто информация. Не приглашение. …Приглашение.'

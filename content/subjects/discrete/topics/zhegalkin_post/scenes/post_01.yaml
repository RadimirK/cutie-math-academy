id: post_01
title: Полином Жегалкина
character: post
background: library
nodes:
  start:
    - speaker: post
      emotion: smile
      text: 'Я Пост. Буль уже показала, что $\{\wedge, \vee, \neg\}$ — базис: любую функцию, кроме $\mathbf{0}$, записывает СДНФ. Сегодня построим другой базис, с арифметикой. Но сначала полезная лемма.'
    - speaker: post
      emotion: thinking
      text: 'Лемма. Пусть $A$ — базис, и каждую функцию из $A$ можно выразить формулой над $B$. Тогда $B$ тоже базис.'
    - speaker: student_b
      emotion: thinking
      text: 'Звучит очевидно. Выражаем через $A$, а $A$ — через $B$.'
    - speaker: post
      emotion: smile
      text: 'Очевидно, но проговорим. Возьмём любую $g$ и её формулу над $A$. Индукцией по дереву разбора заменим каждый узел — функцию из $A$ — её формулой над $B$, подставив в неё уже переведённые поддеревья. Получится формула для $g$ над $B$. Формула может сильно вырасти, но нам важна только выразимость.'
    - speaker: post
      emotion: smile
      text: 'Теперь связки: $\oplus$ — сложение по модулю $2$, $\wedge$ — умножение (на $\{0, 1\}$ оно и так остаётся в $\{0, 1\}$). Одних их мало: обе сохраняют ноль, и $\neg$ из них не собрать. Добавим константу $\mathbf{1}$.'
    - speaker: post
      emotion: smile
      text: 'Запись функции через $\oplus$, $\wedge$ и $\mathbf{1}$ называется полиномом Жегалкина, или арифметическим полиномом.'
    - speaker: zhegalkin
      emotion: happy
      text: 'Это я! Жегалкин. Логика — это просто арифметика по модулю два. Сейчас покажу.'
    - speaker: zhegalkin
      emotion: smile
      text: 'Проверим, что это базис, по лемме. $\wedge$ уже есть, и его пишут просто как произведение: $xy$. Отрицание: $\neg x = x \oplus 1$. Дизъюнкция по де Моргану: $x \vee y = \neg(\neg x \wedge \neg y) = (x \oplus 1)(y \oplus 1) \oplus 1$.'
    - speaker: zhegalkin
      emotion: thinking
      text: 'Сложение и умножение по модулю $2$ подчиняются обычным законам арифметики: коммутативность, ассоциативность, дистрибутивность. Раскроем скобки: $xy \oplus x \oplus y \oplus 1 \oplus 1$. А $1 \oplus 1 = 0$, так что $x \vee y = xy \oplus x \oplus y$.'
    - speaker: student_a
      emotion: thinking
      text: 'Проверю на наборе $11$: $1 \oplus 1 \oplus 1 = 1$. Да, $1 \vee 1 = 1$. А обычное $x + y + xy$ дало бы $3$…'
    - speaker: zhegalkin
      emotion: happy
      text: 'Потому что мы складываем по модулю $2$: $3 \bmod 2 = 1$. Вся арифметика — в мире из двух чисел.'
    - speaker: zhegalkin
      emotion: smile
      text: 'Два правила упрощения. Первое: $x \cdot x = x$, ведь $0$ и $1$ — корни уравнения $x^2 = x$. Повторы внутри произведения схлопываются. Второе: $a \oplus a = 0$. Одинаковые слагаемые сокращаются парами: при чётном числе копий исчезают, при нечётном остаётся одна.'
    - speaker: student_b
      emotion: thinking
      text: 'А какая разница, в каком порядке упрощать?'
    - speaker: zhegalkin
      emotion: thinking
      text: 'Большая! Пример: $(x \oplus y)(x \oplus 1) = x^2 \oplus x \oplus xy \oplus y$. Если сразу искать пары, их нет: $x^2$ и $x$ выглядят по-разному. Если сначала заменить $x^2$ на $x$, то $x \oplus x$ сократится: получится $xy \oplus y$. Поэтому сначала $x \cdot x = x$, потом пары.'
    - speaker: post
      emotion: smile
      text: 'В результате получается сумма различных мономов. Моном — произведение различных переменных, а $1$ — пустое произведение. Это приведённый, или канонический, полином Жегалкина.'
    - choice:
        question: 'Каков приведённый полином Жегалкина для $x \to y$?'
        options:
          - text: '$xy \oplus x \oplus 1$'
            goto: right
          - text: '$x \oplus y \oplus 1$'
            goto: wrong
          - text: '$xy \oplus y$'
            goto: wrong
  wrong:
    - speaker: zhegalkin
      emotion: thinking
      text: 'Выразим: $x \to y = \neg x \vee y = \neg(x \wedge \neg y) = x(y \oplus 1) \oplus 1$. Раскрой скобки. И проверь себя: на наборе $x = 1$, $y = 0$ импликация должна дать $0$.'
    - goto: right
  right:
    - speaker: zhegalkin
      emotion: happy
      text: '$x \to y = \neg(x \wedge \neg y) = x(y \oplus 1) \oplus 1 = xy \oplus x \oplus 1$. Проверка: при $x = 1$, $y = 0$ получаем $0 \oplus 1 \oplus 1 = 0$. Верно.'
    - speaker: post
      emotion: thinking
      text: 'Теорема: у любой функции, кроме $\mathbf{0}$, приведённый полином единственен с точностью до перестановки слагаемых и множителей.'
    - speaker: student_a
      emotion: thinking
      text: 'Как такое доказать? Перебрать все способы выразить функцию невозможно.'
    - speaker: post
      emotion: smile
      text: 'Подсчётом! Каждая переменная либо входит в моном, либо нет, так что мономов от $n$ переменных $2^n$, включая $1$. Каждый моном входит в приведённый полином $0$ или $1$ раз, так что полиномов $2^{2^n}$.'
    - speaker: post
      emotion: thinking
      text: 'Пустую сумму на время доказательства объявим полиномом для $\mathbf{0}$. Каждая функция имеет хотя бы один полином: отображение «полином → функция» — сюръекция. А полиномов ровно столько же, сколько функций, — $2^{2^n}$.'
    - speaker: cantor
      emotion: happy
      text: 'А сюръекция между конечными множествами одинакового размера — это биекция! Вот зачем нужны мои инъекции и сюръекции.'
    - speaker: post
      emotion: happy
      text: 'Именно. У каждой функции ровно один приведённый полином. Дальше мы будем опираться на эту единственность. А Жегалкин ещё покажет, как быстро находить полином прямо по таблице.'
unlocks: [zhegalkin_2, zhegalkin_3]

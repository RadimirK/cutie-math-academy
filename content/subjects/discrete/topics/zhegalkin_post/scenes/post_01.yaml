id: post_01
title: Полином Жегалкина
character: post
background: library
nodes:
  start:
    - speaker: post
      emotion: smile
      text: 'Я Пост. Буль уже показала, что $\{\wedge, \vee, \neg\}$ — базис: любую функцию, кроме $\mathbf{0}$, записывает СДНФ. Сегодня построим другой базис, с арифметикой. Но сначала полезная лемма.'
    - speaker: post
      emotion: thinking
      text: 'Лемма. Пусть $A$ — базис, и каждую функцию из $A$ можно выразить формулой над $B$. Тогда $B$ тоже базис. Возьмём любую $g$ и её формулу над $A$. Индукцией по дереву разбора заменим каждый узел — функцию из $A$ — её формулой над $B$, подставив в неё уже переведённые поддеревья. Получится формула для $g$ над $B$.'
    - speaker: post
      emotion: smile
      text: 'Теперь связки: $\oplus$ — сложение по модулю $2$, $\wedge$ — умножение (на $\{0, 1\}$ оно и так остаётся в $\{0, 1\}$). Одних их мало: обе сохраняют ноль, и $\neg$ из них не собрать. Добавим константу $\mathbf{1}$. Запись функции через $\oplus$, $\wedge$ и $\mathbf{1}$ называется полиномом Жегалкина, или арифметическим полиномом.'
    - speaker: post
      emotion: smile
      text: 'Проверим, что это базис, по лемме. $\wedge$ уже есть, и его пишут просто как произведение: $xy$. Отрицание: $\neg x = x \oplus 1$. Дизъюнкция по де Моргану: $x \vee y = \neg(\neg x \wedge \neg y) = (x \oplus 1)(y \oplus 1) \oplus 1$.'
    - speaker: post
      emotion: thinking
      text: 'Сложение и умножение по модулю $2$ подчиняются обычным законам арифметики, так что раскроем скобки: $xy \oplus x \oplus y \oplus 1 \oplus 1$. А $1 \oplus 1 = 0$, так что $x \vee y = xy \oplus x \oplus y$.'
    - speaker: post
      emotion: smile
      text: 'Два правила упрощения. Первое: $x \cdot x = x$, ведь $0$ и $1$ — корни уравнения $x^2 = x$. Повторы внутри произведения схлопываются в один множитель. Второе: $a \oplus a = 0$. Одинаковые слагаемые сокращаются парами: при чётном числе копий исчезают, при нечётном остаётся одна.'
    - speaker: post
      emotion: thinking
      text: 'Порядок важен: сначала $x \cdot x = x$, потом сокращение пар. Пример: $(x \oplus y)(x \oplus 1) = x^2 \oplus x \oplus xy \oplus y$. Если сразу искать пары, их нет. Если сначала заменить $x^2$ на $x$, то $x \oplus x$ сократится: получится $xy \oplus y$.'
    - speaker: post
      emotion: smile
      text: 'В результате получается сумма различных мономов. Моном — произведение различных переменных, а $1$ — пустое произведение. Это приведённый, или канонический, полином Жегалкина. Например, $x \vee y = xy \oplus x \oplus y$.'
    - choice:
        question: 'Каков приведённый полином Жегалкина для $x \to y$?'
        options:
          - text: '$xy \oplus x \oplus 1$'
            goto: right
          - text: '$x \oplus y \oplus 1$'
            goto: wrong
          - text: '$xy \oplus y$'
            goto: wrong
  wrong:
    - speaker: post
      emotion: thinking
      text: 'Выразим: $x \to y = \neg x \vee y = \neg(x \wedge \neg y) = x(y \oplus 1) \oplus 1$. Раскрой скобки. И проверь себя: на наборе $x = 1$, $y = 0$ импликация должна дать $0$.'
    - goto: right
  right:
    - speaker: post
      emotion: happy
      text: '$x \to y = \neg(x \wedge \neg y) = x(y \oplus 1) \oplus 1 = xy \oplus x \oplus 1$. Проверка: при $x = 1$, $y = 0$ получаем $0 \oplus 1 \oplus 1 = 0$. Верно.'
    - speaker: post
      emotion: thinking
      text: 'Теорема: у любой функции, кроме $\mathbf{0}$, приведённый полином единственен с точностью до перестановки слагаемых и множителей. Докажем подсчётом. Каждая переменная либо входит в моном, либо нет, так что мономов от $n$ переменных $2^n$, включая $1$.'
    - speaker: post
      emotion: thinking
      text: 'Каждый моном входит в приведённый полином $0$ или $1$ раз, так что полиномов $2^{2^n}$. Пустую сумму на время доказательства объявим полиномом для $\mathbf{0}$. Каждая функция имеет хотя бы один полином, а полиномов ровно столько же, сколько функций, — $2^{2^n}$. Значит, соответствие взаимно однозначно.'
    - speaker: post
      emotion: happy
      text: 'Сюръекция между конечными множествами одинакового размера — это биекция. Вот зачем нужны инъекции и сюръекции! Дальше мы будем опираться на эту единственность.'
unlocks: [zhegalkin_2, zhegalkin_3]

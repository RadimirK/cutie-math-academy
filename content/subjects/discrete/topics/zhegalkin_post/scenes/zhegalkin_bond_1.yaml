id: zhegalkin_bond_1
title: Финиш в обнимку
character: zhegalkin
background: courtyard
nodes:
  start:
    - narration: 'Звенит звонок на большую перемену. Не успеваешь выйти во двор, как рядом, затормозив кедами, возникает Жегалкин.'
    - speaker: zhegalkin
      emotion: smug
      text: 'О, это ты! Наперегонки до столовой? Проигравший выполняет одно желание победителя. Любое!'
    - choice:
        question: 'Что ответить?'
        options:
          - text: 'Любое? Тогда держись!'
            goto: race
          - text: 'А если я выиграю, что ты сделаешь?'
            goto: wager
  wager:
    - speaker: zhegalkin
      emotion: smug
      text: 'Ты? Выиграешь? Ха! Если выиграешь, я… я покормлю тебя с ложечки. При всех. Не выиграешь всё равно!'
    - goto: race
  race:
    - narration: 'Вы срываетесь с места. Жегалкин летит впереди, хвост мотается из стороны в сторону. У самого крыльца ты почти догоняешь её, и тут она цепляется кедом за бордюр.'
    - speaker: zhegalkin
      emotion: surprised
      text: 'Ай!'
    - narration: 'Ты успеваешь поймать её, но не удержать равновесие. Вы вместе валитесь на мягкий газон. Жегалкин оказывается сверху, упираясь руками тебе в плечи.'
    - narration: 'Её лицо совсем близко. Чёлка щекочет тебе лоб, клычок виден в приоткрытом рту. Она не двигается.'
    - speaker: zhegalkin
      emotion: embarrassed
      text: '…Это не считается. Это ничья. Это… почему ты так смотришь?'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Поправить ей сбившуюся заколку.'
            goto: clip
          - text: 'Сказать: «По-моему, ты меня поймала. Значит, ты выиграла».'
            goto: caught
  clip:
    - narration: 'Ты поправляешь красную заколку-треугольник у неё на чёлке. Жегалкин замирает, как будто её поставили на паузу.'
    - speaker: zhegalkin
      emotion: embarrassed
      text: 'Ты… это… нельзя так внезапно! Я же не успеваю засечь!'
    - narration: 'Она скатывается в сторону и садится, обхватив колени. Уши у неё пунцовые.'
    - goto: lunch
  caught:
    - speaker: zhegalkin
      emotion: smug
      text: 'Я выиграла? Тогда… моё желание.'
    - narration: 'Она наклоняется ещё ниже, так, что её дыхание касается твоих губ… и щёлкает тебя по носу.'
    - speaker: zhegalkin
      emotion: happy
      text: 'Ха! Купились! Желание я приберегу. На потом. Бойся!'
    - goto: lunch
  lunch:
    - narration: 'В столовой Жегалкин берёт два пирожка с вишней. Один разламывает пополам и протягивает тебе прямо к губам.'
    - speaker: zhegalkin
      emotion: embarrassed
      text: 'Открывай рот. Не спорь. Это… это для скорости. Так быстрее, чем ты будешь брать руками.'
    - speaker: zhegalkin
      emotion: smile
      text: 'Вкусно? …Ага. У тебя вишня на губе. Нет, не там. Вот тут.'
    - narration: 'Она вытирает её большим пальцем, секунду смотрит на палец, а потом облизывает его и тут же отворачивается к окну.'
    - speaker: zhegalkin
      emotion: embarrassed
      text: 'Завтра снова до столовой. И в этот раз я не упаду. Наверное. Засекаю!'

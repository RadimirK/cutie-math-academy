id: post_02
title: Пять классов Поста
character: post
background: classroom
nodes:
  start:
    - speaker: post
      emotion: smile
      text: 'Мои пять классов — пять «ловушек». Если все функции системы лежат в одном классе, то и всё, что из них выражается, останется в нём. Первые два простые. $T_0$ — функции, сохраняющие ноль: $f(0, \ldots, 0) = 0$. $T_1$ — сохраняющие единицу: $f(1, \ldots, 1) = 1$.'
    - speaker: post
      emotion: smile
      text: 'Третий — монотонные функции $M$. Наборы сравниваем покомпонентно: $\alpha \le \beta$, если $\alpha_i \le \beta_i$ для всех $i$. Функция монотонна, если $\alpha \le \beta \Rightarrow f(\alpha) \le f(\beta)$: увеличиваем аргументы, и значение не уменьшается.'
    - speaker: post
      emotion: thinking
      text: 'Две тонкости. В дискретке «монотонная» значит только неубывающая. И наборы бывают несравнимы: про $f(1, 0)$ и $f(0, 1)$ монотонность ничего не говорит. Пример: $\wedge$ и $\vee$ монотонны, а $\neg$ и $\oplus$ нет.'
    - speaker: post
      emotion: smile
      text: 'Четвёртый — самодвойственные функции $S$: из них можно «вынести отрицание», $f(\neg x_1, \ldots, \neg x_n) = \neg f(x_1, \ldots, x_n)$. Примеры: $x$ и $\neg x$. Среди функций двух аргументов, существенно зависящих от обоих, самодвойственных нет.'
    - speaker: post
      emotion: happy
      text: 'Классический пример от трёх аргументов — голосование, или медиана: $\operatorname{maj}(x, y, z) = xy \vee yz \vee xz$, «что у большинства». Если все проголосуют наоборот, результат тоже перевернётся. А вот $\wedge$ не самодвойственна: $\neg x \wedge \neg y = \neg(x \vee y)$ — вынесли отрицание и получили уже $\vee$.'
    - speaker: post
      emotion: smile
      text: 'Пятый — линейные функции $L$: в полиноме Жегалкина нет произведений, $f = a_0 \oplus a_1 x_1 \oplus \ldots \oplus a_n x_n$. Благодаря единственности полинома определение корректно: функция либо линейна, либо нет, третьего не дано.'
    - choice:
        question: 'Сколько существует линейных функций от $n$ аргументов?'
        options:
          - text: '$2^n$'
            goto: wrong
          - text: '$2^{n + 1}$'
            goto: right
          - text: '$n + 1$'
            goto: wrong
  wrong:
    - speaker: post
      emotion: thinking
      text: 'Линейная функция определяется коэффициентами $a_0, a_1, \ldots, a_n$. Каждый — $0$ или $1$, и выбираются они независимо. Сколько всего коэффициентов?'
    - goto: right
  right:
    - speaker: post
      emotion: happy
      text: '$n + 1$ независимых коэффициентов $a_0, \ldots, a_n$, так что $2^{n + 1}$ функций. Константы $\mathbf{0}$ и $\mathbf{1}$ тоже линейны.'
    - speaker: post
      emotion: thinking
      text: 'Почему классы замкнуты? Индукция по дереву разбора, одинаковая для всех пяти. $T_0$: подставим нули, каждое поддерево по предположению даст $0$, корень из $T_0$ — тоже $0$. $T_1$ — аналогично. $M$: увеличим часть аргументов, значения поддеревьев не уменьшатся, а монотонный корень не уменьшит результат.'
    - speaker: post
      emotion: thinking
      text: '$S$: заменим все переменные их отрицаниями, каждое поддерево перевернётся, самодвойственный корень тоже. $L$: подставляя линейные выражения в линейное, получаем сумму сумм — после сокращений снова без произведений.'
    - speaker: post
      emotion: smile
      text: 'И ни один класс не содержит всех функций. $\neg \notin T_0$, $\neg \notin T_1$, $\neg \notin M$ ($0 < 1$, но $\neg 0 > \neg 1$). $\wedge \notin S$. $\wedge \notin L$: её полином $xy$. Значит, в полной системе обязана быть функция вне каждого из пяти классов.'
unlocks: [post_member, post_classes_count, post_count]

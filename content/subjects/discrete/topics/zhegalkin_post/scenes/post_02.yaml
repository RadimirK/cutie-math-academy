id: post_02
title: Пять классов Поста
character: post
background: classroom
nodes:
  start:
    - speaker: post
      emotion: smile
      text: 'Мои пять классов — пять «ловушек». Если все функции системы лежат в одном классе, то и всё, что из них выражается, останется в нём. Первые два простые. $T_0$ — функции, сохраняющие ноль: $f(0, \ldots, 0) = 0$. $T_1$ — сохраняющие единицу: $f(1, \ldots, 1) = 1$.'
    - speaker: post
      emotion: smile
      text: 'Проверяются одним взглядом: $T_0$ — первая цифра вектора значений $0$, $T_1$ — последняя цифра $1$.'
    - speaker: post
      emotion: smile
      text: 'Третий — монотонные функции $M$. Наборы сравниваем покомпонентно: $\alpha \le \beta$, если $\alpha_i \le \beta_i$ для всех $i$. Функция монотонна, если $\alpha \le \beta \Rightarrow f(\alpha) \le f(\beta)$: увеличиваем аргументы, и значение не уменьшается.'
    - speaker: student_b
      emotion: thinking
      text: 'На матанализе монотонная — это возрастающая или убывающая. Здесь убывающие тоже считаются?'
    - speaker: post
      emotion: thinking
      text: 'Нет, в дискретке «монотонная» значит только неубывающая. И ещё: наборы бывают несравнимы. Про $f(1, 0)$ и $f(0, 1)$ монотонность ничего не говорит. $\wedge$ и $\vee$ монотонны, а $\neg$ и $\oplus$ нет: у $\oplus$ при переходе $01 \to 11$ значение падает с $1$ до $0$.'
      figure: {type: cube, values: '0110'}
    - speaker: student_a
      emotion: thinking
      text: 'А как быстро проверить монотонность по вектору?'
    - speaker: post
      emotion: smile
      text: 'Достаточно проверять соседние наборы — отличающиеся в одной позиции. Если на каждом ребре «$0 \to 1$» значение не падает, то не падает и вдоль любой цепочки. Для вектора от трёх переменных: левая половина (где $x = 0$) должна быть покоординатно $\le$ правой, и так рекурсивно в каждой половине.'
      figure: {type: cube, values: '00010111'}
    - speaker: post
      emotion: smile
      text: 'Удобно рисовать булев куб: наборы по слоям от $000$ до $111$, рёбра — соседние наборы, единицы функции закрашены. Здесь медиана $\langle xyz \rangle$. Монотонна она, потому что над каждым закрашенным набором закрашено всё.'
    - speaker: post
      emotion: smile
      text: 'Четвёртый — самодвойственные функции $S$: из них можно «вынести отрицание», $f(\neg x_1, \ldots, \neg x_n) = \neg f(x_1, \ldots, x_n)$. По вектору: он антисимметричен — прочитанный задом наперёд, он равен своему отрицанию.'
      figure: null
    - speaker: student_b
      emotion: thinking
      text: 'Пример? У меня в голове только $\neg x$.'
    - speaker: post
      emotion: happy
      text: '$x$ и $\neg x$ — да. Среди функций двух аргументов, существенно зависящих от обоих, самодвойственных нет. Классика от трёх — голосование, медиана: $\langle xyz \rangle = xy \vee yz \vee xz$. Если все проголосуют наоборот, результат тоже перевернётся.'
    - speaker: post
      emotion: thinking
      text: 'А $\wedge$ не самодвойственна: $\neg x \wedge \neg y = \neg(x \vee y)$. Вынесли отрицание — и получили уже $\vee$. Вообще, функция $f^*(x) = \neg f(\neg x)$ называется двойственной к $f$, и самодвойственные — это те, у которых $f^* = f$. Двойственностью подробно займётся Хорн.'
    - speaker: post
      emotion: smile
      text: 'Пятый — линейные функции $L$: в полиноме Жегалкина нет произведений, $f = a_0 \oplus a_1 x_1 \oplus \ldots \oplus a_n x_n$. Благодаря единственности полинома определение корректно: функция либо линейна, либо нет, третьего не дано.'
    - choice:
        question: 'Сколько существует линейных функций от $n$ аргументов?'
        options:
          - text: '$2^n$'
            goto: wrong
          - text: '$2^{n + 1}$'
            goto: right
          - text: '$n + 1$'
            goto: wrong
  wrong:
    - speaker: post
      emotion: thinking
      text: 'Линейная функция определяется коэффициентами $a_0, a_1, \ldots, a_n$. Каждый — $0$ или $1$, и выбираются они независимо. Сколько всего коэффициентов?'
    - goto: right
  right:
    - speaker: post
      emotion: happy
      text: '$n + 1$ независимых коэффициентов $a_0, \ldots, a_n$, так что $2^{n + 1}$ функций. Константы $\mathbf{0}$ и $\mathbf{1}$ тоже линейны.'
    - speaker: student_a
      emotion: thinking
      text: 'Почему эти классы — «ловушки»? Для $T_0$ Буль доказывала индукцией по дереву. А для остальных?'
    - speaker: post
      emotion: thinking
      text: 'Та же индукция. $T_1$: подставим единицы, поддеревья дадут $1$, корень из $T_1$ — тоже. $M$: увеличим часть аргументов, значения поддеревьев не уменьшатся, а монотонный корень не уменьшит результат.'
    - speaker: post
      emotion: thinking
      text: '$S$: заменим все переменные их отрицаниями, каждое поддерево перевернётся, самодвойственный корень тоже. $L$: подставляя линейные выражения в линейное, получаем сумму сумм — после сокращений снова без произведений.'
    - speaker: post
      emotion: smile
      text: 'И ни один класс не содержит всех функций. $\neg \notin T_0$, $\neg \notin T_1$, $\neg \notin M$ ($0 < 1$, но $\neg 0 > \neg 1$). $\wedge \notin S$. $\wedge \notin L$: её полином $xy$. Значит, в полной системе обязана быть функция вне каждого из пяти классов.'
    - speaker: student_b
      emotion: thinking
      text: 'А классы независимы? Может, любая функция вне $M$ автоматически вне $L$?'
    - speaker: post
      emotion: smile
      text: 'Проверим парой примеров. $x \oplus y \notin M$, но $\in L$. $x \wedge y \in M$, но $\notin L$. Значит, никакой из этих двух классов не вложен в другой. Поиск функций, лежащих ровно в одном классе или во всех кроме одного, — отличное упражнение: удобно начинать с кандидатов вроде $x \oplus y \oplus z$, $\langle xyz \rangle$, $\wedge$, $\to$.'
unlocks: [post_member, post_classes_count, post_count]

id: boole_04
title: Существенные переменные и симметрия
character: boole
background: classroom
nodes:
  start:
    - speaker: boole
      emotion: smile
      text: 'Посмотрите на $f(x, y) = x \vee (x \wedge y)$. Формально у неё два аргумента. Но если выписать таблицу: $0011$. Это просто $x$! От $y$ функция на самом деле не зависит.'
    - speaker: boole
      emotion: smile
      text: 'Определение: $f$ существенно зависит от $x_i$, если есть два набора, отличающиеся только в $i$-й позиции, на которых $f$ принимает разные значения. Иначе переменная $x_i$ фиктивная: её можно выкинуть.'
    - speaker: student_a
      emotion: thinking
      text: 'Как это проверять по вектору значений?'
    - speaker: boole
      emotion: happy
      text: 'Для первой переменной сравни левую и правую половины вектора: если они совпадают, $x_1$ фиктивна. Для второй — делим каждую половину пополам и сравниваем четвертинки. Для последней — сравниваем соседние цифры попарно.'
    - speaker: boole
      emotion: thinking
      text: 'Пример: $f(x, y, z)$ с вектором $0101\,0101$. Половины $0101$ и $0101$ равны — $x$ фиктивна. Четвертинки $01$ и $01$ равны — $y$ фиктивна. А соседи в парах $01$ различны — $z$ существенна. Это просто $f = z$.'
    - speaker: student_b
      emotion: thinking
      text: 'А сколько функций от $n$ переменных существенно зависят от всех?'
    - speaker: boole
      emotion: smile
      text: 'Хитрый вопрос. У каждой функции есть множество существенных переменных — и она «на самом деле» функция от них. Обозначим $E(k)$ число функций от $k$ переменных, существенно зависящих от всех. Распределим все $2^{2^n}$ функций по тому, какое подмножество переменных у них существенно.'
    - speaker: boole
      emotion: thinking
      text: 'Подмножество из $k$ переменных можно выбрать $\binom{n}{k}$ способами, и для каждого есть $E(k)$ функций. Получаем $$2^{2^n} = \sum_{k = 0}^{n} \binom{n}{k} E(k).$$ Отсюда $E(n)$ выражается рекуррентно через меньшие.'
    - speaker: student_a
      emotion: thinking
      text: 'Проверю: $E(0) = 2$ — константы. $E(1)$: $2^2 = E(0) + 1 \cdot E(1)$, значит, $E(1) = 2$ — это $x$ и $\neg x$. А $E(2) = 16 - E(0) - 2E(1) = 10$.'
    - speaker: boole
      emotion: happy
      text: 'Верно! Из шестнадцати функций двух аргументов от обоих существенно зависят десять. Остальные шесть — две константы, $x$, $\neg x$, $y$, $\neg y$.'
    - choice:
        question: 'Сколько переменных существенны у $f(x, y, z)$ с вектором $0011\,1100$?'
        options:
          - text: '$1$'
            goto: wrong
          - text: '$2$'
            goto: right
          - text: '$3$'
            goto: wrong
  wrong:
    - speaker: boole
      emotion: thinking
      text: 'Половины $0011$ и $1100$ различны — $x$ существенна. Внутри половин четвертинки различны ($00$ и $11$) — $y$ существенна. А пары соседей: $00$, $11$, $11$, $00$ — внутри каждой цифры равны, значит, $z$ фиктивна.'
    - goto: right
  right:
    - speaker: boole
      emotion: happy
      text: 'Две: $x$ и $y$. Переменная $z$ фиктивна, а сама функция — $x \oplus y$.'
    - speaker: boole
      emotion: smile
      text: 'Теперь симметричные функции: их значение не меняется при любой перестановке переменных. Значит, оно зависит только от веса набора — числа единиц в нём. $\wedge$, $\vee$, $\oplus$, медиана — симметричны. А $x \to y$ нет: $0 \to 1 = 1$, но $1 \to 0 = 0$.'
    - speaker: student_b
      emotion: thinking
      text: 'И сколько симметричных функций от $n$ переменных?'
    - speaker: boole
      emotion: happy
      text: 'Вес бывает $0, 1, \ldots, n$ — всего $n + 1$ вариант. Симметричная функция задаётся значением на каждом весе, так что их $2^{n + 1}$. Удобно записывать такую функцию вектором по весам $\langle v_0, v_1, \ldots, v_n \rangle$: у $\oplus$ от трёх переменных это $\langle 0, 1, 0, 1 \rangle$.'
    - speaker: boole
      emotion: smile
      text: 'Последнее на сегодня: форсируемые (или канализирующие) функции. $f$ форсируема, если есть переменная $x_i$ и значение $c$, такие что при $x_i = c$ функция становится константой — что бы ни творилось с остальными.'
    - speaker: student_a
      emotion: thinking
      text: '$x_1 \wedge x_2$: при $x_1 = 0$ всегда ноль. Значит, форсируема. А $x \oplus y$?'
    - speaker: boole
      emotion: thinking
      text: 'Зафиксируем $x = 0$ — останется $y$, не константа. $x = 1$ — останется $\neg y$. Так же с $y$. Значит, $\oplus$ не форсируема. Проверка по вектору: ищем половину (или «прорежённую» половину для других переменных), целиком из одинаковых цифр.'
    - speaker: boole
      emotion: happy
      text: 'Попробуй сама разобрать все шестнадцать функций двух аргументов — не форсируемых окажется удивительно мало. Форсируемые функции любят биологи: так устроены многие генные регуляторные сети.'
unlocks: [essential_vars, essential_count, symmetric_count, forcible_check]

id: boole_06
title: Пороговые функции
character: boole
background: classroom
nodes:
  start:
    - speaker: boole
      emotion: smile
      text: 'Функция $f$ пороговая, если есть вещественные веса $a_1, \ldots, a_n$ и порог $b$, такие что $$f(x_1, \ldots, x_n) = 1 \iff a_1 x_1 + \ldots + a_n x_n \ge b.$$'
    - speaker: student_a
      emotion: thinking
      text: 'Как нейрон! Сумма сигналов с весами, и если больше порога — срабатывает.'
    - speaker: boole
      emotion: happy
      text: 'Именно: это модель нейрона (перцептрон). Примеры: $x \wedge y$ — это $x + y \ge 2$. $x \vee y$ — $x + y \ge 1$. $\neg x$ — $-x \ge 0$. Медиана — $x + y + z \ge 2$. Веса бывают отрицательными: $x \to y$ — это $-x + y \ge 0$.'
    - speaker: student_b
      emotion: thinking
      text: 'А $x \wedge (y \vee z)$?'
    - speaker: boole
      emotion: smile
      text: 'Нужно, чтобы без $x$ не набиралось, а с $x$ хватало любого из $y$, $z$: $2x + y + z \ge 3$. Проверь все наборы — сработает.'
    - speaker: student_b
      emotion: thinking
      text: 'Тогда, может, все функции пороговые? Раз уж $\wedge$, $\vee$, $\neg$ пороговые, а через них выражается всё.'
    - speaker: boole
      emotion: explain
      text: 'Ловушка! Выразимость через пороговые не делает функцию пороговой: пороговые функции не замкнуты относительно композиции. Докажем, что $x \oplus y$ не пороговая.'
    - speaker: boole
      emotion: thinking
      text: 'Пусть $a_1 x + a_2 y \ge b \iff x \oplus y = 1$. Набор $00$: $0 < b$. Наборы $10$ и $01$: $a_1 \ge b$, $a_2 \ge b$. Набор $11$: $a_1 + a_2 < b$. Но $a_1 + a_2 \ge 2b > b$, ведь $b > 0$. Противоречие.'
    - speaker: student_a
      emotion: thinking
      text: 'Есть ли общий приём? Для каждой функции так изворачиваться долго.'
    - speaker: boole
      emotion: happy
      text: 'Есть — складывать неравенства. Возьмём несколько единичных наборов и столько же нулевых так, чтобы суммы векторов совпали. Для $\oplus$: единицы $10 + 01 = 11$, нули $00 + 11 = 11$. Для единиц $a \cdot x \ge b$, для нулей $a \cdot x < b$. Сложим: $a \cdot (\text{сумма}) \ge 2b$ и $a \cdot (\text{та же сумма}) < 2b$. Противоречие.'
    - choice:
        question: 'Пороговая ли функция $xy \vee zt$?'
        options:
          - text: 'Да: $x + y + z + t \ge 2$'
            goto: wrong_sum
          - text: 'Нет'
            goto: right
  wrong_sum:
    - speaker: boole
      emotion: thinking
      text: 'На наборе $1010$ сумма равна $2$, а $xy \vee zt = 0$. Попробуй приём: единицы $1100$ и $0011$ дают в сумме $1111$, нули $1010$ и $0101$ — тоже $1111$.'
    - goto: right
  right:
    - speaker: boole
      emotion: happy
      text: 'Не пороговая: единичные наборы $1100$ и $0011$ в сумме дают $1111$, нулевые $1010$ и $0101$ — тоже $1111$. Складываем неравенства — противоречие.'
    - speaker: boole
      emotion: smile
      text: 'Обозначим $N(f)$ — число единичных наборов функции, $\Sigma(f)$ — их сумма как векторов. Например, у $\vee$ единицы $01$, $10$, $11$, так что $N(\vee) = 3$ и $\Sigma(\vee) = (2, 2)$. Это параметры Чоу.'
    - speaker: student_b
      emotion: thinking
      text: 'А зачем они?'
    - speaker: boole
      emotion: thinking
      text: 'Удивительный факт: пороговая функция однозначно определяется ими среди всех функций. Идея доказательства — тот же приём. Если $f$ пороговая и у $g$ те же $N$ и $\Sigma$, но $g \ne f$, сравни наборы, где единица только у $f$, и наборы, где единица только у $g$. Их поровну, а суммы векторов равны.'
    - speaker: student_a
      emotion: happy
      text: 'А на первых $a \cdot x \ge b$, на вторых $a \cdot x < b$! Сложим — противоречие.'
    - speaker: boole
      emotion: happy
      text: 'Ты сама всё доказала. Теперь симметричные пороговые функции. Если $f$ симметрична и пороговая с весами $a$, то подойдут и переставленные веса. Сложим неравенства для всех перестановок и поделим: подойдут одинаковые веса! Тогда $f = 1 \iff a \cdot |x| \ge b$, где $|x|$ — вес набора.'
    - speaker: boole
      emotion: thinking
      text: 'А неравенство с одной переменной $|x|$ задаёт луч: при $a > 0$ это «вес не меньше $k$», при $a < 0$ — «вес не больше $k$», при $a = 0$ — константа. Остаётся посчитать такие функции и проверить, что все они действительно пороговые.'
unlocks: [threshold_check, chow_params]

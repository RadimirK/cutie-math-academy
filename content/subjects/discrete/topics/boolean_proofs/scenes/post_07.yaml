id: post_07
title: Как доказать, что выразить нельзя
character: post
background: classroom
nodes:
  start:
    - speaker: post
      emotion: smile
      text: 'Самый частый вид задач: «можно ли выразить $g$ через систему $A$?». Ответ «да» доказывают формулой — предъяви её и проверь. Ответ «нет» доказывают инвариантом. Разберём рецепт по шагам.'
    - speaker: post
      emotion: thinking
      text: 'Придумай свойство $P$ булевых функций, такое что: (1) все функции из $A$ обладают $P$; (2) все переменные, то есть проекторы $f(x_1, \ldots, x_n) = x_i$, обладают $P$; (3) $P$ сохраняется при композиции: если $f$ и $g_1, \ldots, g_k$ обладают $P$, то и $f(g_1, \ldots, g_k)$; (4) у $g$ свойства $P$ нет.'
    - speaker: post
      emotion: smile
      text: 'Тогда индукцией по дереву формулы: листья — переменные — обладают $P$ по пункту 2, каждый узел — по пункту 3. Значит, любая формула над $A$ обладает $P$, а $g$ — нет.'
    - speaker: student_a
      emotion: thinking
      text: 'А подстановка переменных? Её тоже надо проверять?'
    - speaker: post
      emotion: smile
      text: 'Она укладывается в пункт 3: подставить переменную — значит подставить проектор, а проекторы по пункту 2 обладают $P$. Поэтому пункт 2 так важен.'
    - speaker: student_b
      emotion: thinking
      text: 'Тогда задача: $\wedge$ через $\downarrow$ выразить нельзя. Свойство: $f(0, \ldots, 0) = 1$. У $\downarrow$ оно есть, у $\wedge$ нет. Всё?'
    - choice:
        question: 'Верно ли рассуждение Хинаты?'
        options:
          - text: 'Да, свойство подходит'
            goto: wrong
          - text: 'Нет: свойством не обладают переменные'
            goto: right
          - text: 'Нет: нужно было взять класс $T_1$'
            goto: wrong
  wrong:
    - speaker: post
      emotion: thinking
      text: 'Проверь пункт 2: переменная $x$ на нулях равна $0$, а не $1$. Свойство не сохраняется при подстановках: $x \downarrow x = \neg x$ на нуле даёт $1$, но $(x \downarrow x) \downarrow (x \downarrow x) = x$ — уже $0$. И вообще, $\downarrow$ — базис, так что $\wedge$ через него выражается.'
    - goto: right
  right:
    - speaker: post
      emotion: happy
      text: 'Именно: переменная $x$ на нулях равна $0$, так что пункт 2 нарушен. И вывод неверен: $\downarrow$ — базис, $\wedge$ через неё выражается. Всегда проверяй все четыре пункта.'
    - speaker: post
      emotion: smile
      text: 'Первым делом пробуй мои классы $T_0, T_1, M, S, L$: для них все пункты уже проверены. Но бывает, что $g$ лежит во всех классах, куда попадает $A$. Тогда инвариант придётся изобрести.'
    - speaker: post
      emotion: thinking
      text: 'Пример: через $\{\wedge\}$ нельзя выразить $\vee$. Обе функции монотонны, лежат в $T_0$ и $T_1$. Возьмём свойство «$f(\alpha \wedge \beta) = f(\alpha) \wedge f(\beta)$ для всех наборов $\alpha, \beta$» — здесь $\alpha \wedge \beta$ покомпонентно.'
    - speaker: post
      emotion: thinking
      text: 'Проверяем. Переменная: $(\alpha \wedge \beta)_i = \alpha_i \wedge \beta_i$ — да. Сама $\wedge$: $(a_1 b_1)(a_2 b_2) = (a_1 a_2)(b_1 b_2)$ — да. У $\vee$: $\alpha = 10$, $\beta = 01$, $\alpha \wedge \beta = 00$, $\vee(00) = 0$, а $\vee(10) \wedge \vee(01) = 1$ — нет.'
    - speaker: post
      emotion: thinking
      text: 'Сохранение при композиции: $h = f(g_1, \ldots, g_k)$. Тогда $h(\alpha \wedge \beta) = f(g_i(\alpha \wedge \beta)) = f(g_i(\alpha) \wedge g_i(\beta))$ по свойству $g_i$, а это равно $f(g(\alpha)) \wedge f(g(\beta))$ по свойству $f$, применённому к наборам $g(\alpha)$ и $g(\beta)$.'
    - speaker: student_a
      emotion: happy
      text: 'То есть $\wedge$ «сохраняет саму себя». А если систему поменять на $\{\vee\}$, подойдёт двойственное свойство с $\vee$!'
    - speaker: post
      emotion: happy
      text: 'Верно. Ещё пара полезных инвариантов. Для $\{\neg\}$: «функция существенно зависит не больше чем от одной переменной». Для $\{\to\}$: «существует $i$, что $f(\alpha) \ge \alpha_i$ на всех наборах» — функция «не ниже» одной из переменных. $x \to y \ge y$, а $x \wedge y$ не выше ни $x$, ни $y$.'
    - speaker: post
      emotion: smile
      text: 'Где искать идеи инвариантов: что общего у всех функций системы? Что им удаётся «сохранять»? Сравни на маленьких наборах поведение системы и $g$. А для ответа «да» полезны два трюка: подставлять константы и склеивать переменные, как в доказательстве моей теоремы.'
unlocks: [invariant_pick]

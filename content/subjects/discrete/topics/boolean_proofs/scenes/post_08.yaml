id: post_08
title: Как доказать тождество
character: post
background: library
nodes:
  start:
    - speaker: post
      emotion: smile
      text: 'Вторая частая задача: доказать, что две формулы задают одну функцию. Лобовой способ — проверить все $2^n$ наборов. Это честное доказательство, но при $n = 5$ уже $32$ строки, а при произвольном $n$ перебор невозможен. Нужны приёмы.'
    - speaker: post
      emotion: smile
      text: 'Приём 1 — разбор случаев по соотношению переменных. Докажем $\langle x, y, x \equiv y \rangle = x \wedge y$. Случай $x = y$: медиана двух одинаковых голосов — это $x$, и $x \wedge y = x$. Случай $x \ne y$: $x \equiv y = 0$, и $\langle x, y, 0 \rangle = x \wedge y$. Два случая вместо четырёх строк.'
    - speaker: post
      emotion: smile
      text: 'Приём 2 — разбор по одной переменной (разложение Шеннона): $f = g$ тогда и только тогда, когда $f$ и $g$ совпадают при $x_1 = 0$ и при $x_1 = 1$. Подставив константу, формулы обычно сильно упрощаются. Если есть параметр $n$, так получается индукция по числу переменных.'
    - speaker: post
      emotion: thinking
      text: 'Приём 3 — группировка по весу. Если обе части симметричны, их значение зависит только от числа единиц. Докажем $\langle xyz \rangle = (x \vee y)(y \vee z)(x \vee z)$. Вес $0$ или $1$: хотя бы одна скобка ложна, справа $0$, слева $0$. Вес $2$ или $3$: в каждой скобке есть единица, справа $1$, слева $1$.'
    - speaker: student_a
      emotion: thinking
      text: 'А если формула почти симметричная, но кое-где стоят отрицания?'
    - speaker: post
      emotion: happy
      text: 'Тогда считай, сколько единиц попадает в каждое место формулы. Медиана $2m + 1$ аргументов равна $1$ ровно тогда, когда единиц хотя бы $m + 1$. Отрицание переменной меняет её вклад в это число. Такой подсчёт — главный инструмент в тождествах с медианами.'
    - speaker: post
      emotion: smile
      text: 'Приём 4 — симметрия, которая сокращает перебор вдвое. Если обе части самодвойственны, то из равенства на наборе $\alpha$ следует равенство на $\neg \alpha$. Значит, можно проверять только наборы, где, например, $x_0 = 0$.'
    - speaker: student_b
      emotion: thinking
      text: 'Почему?'
    - speaker: post
      emotion: smile
      text: 'Если $f(\alpha) = g(\alpha)$, то $f(\neg \alpha) = \neg f(\alpha) = \neg g(\alpha) = g(\neg \alpha)$. А каждый набор — либо $\alpha$ с $x_0 = 0$, либо отрицание такого.'
    - choice:
        question: 'Верно ли, что $x \vee (y \oplus z) = (x \vee y) \oplus (x \vee z)$?'
        options:
          - text: 'Верно: как дистрибутивность для $\wedge$'
            goto: wrong
          - text: 'Неверно'
            goto: right
  wrong:
    - speaker: post
      emotion: thinking
      text: 'Разбор по $x$. При $x = 0$ обе части равны $y \oplus z$. А при $x = 1$ слева $1$, справа $1 \oplus 1 = 0$. Контрпример: $x = 1$ и любые $y$, $z$.'
    - goto: right
  right:
    - speaker: post
      emotion: happy
      text: 'Неверно: при $x = 1$ слева $1$, справа $1 \oplus 1 = 0$. Разбор по одной переменной сразу даёт и доказательство, и контрпример. А $x \wedge (y \oplus z) = xy \oplus xz$ — верно, это обычная дистрибутивность умножения относительно сложения по модулю два.'
    - speaker: post
      emotion: thinking
      text: 'Приём 5 — доказательство представления. Чтобы доказать, что формула $F$ (например, КНФ) задаёт $f$, проверь две стороны. Во-первых, на каждой единице $f$ формула истинна: $f \le F$. Во-вторых, на каждом нуле $f$ формула ложна: $F \le f$. Для КНФ второе значит, что для каждого нуля есть ложный на нём дизъюнкт.'
    - speaker: student_a
      emotion: happy
      text: 'Как два включения у множеств! Множество единиц $F$ совпадает с множеством единиц $f$.'
    - speaker: post
      emotion: happy
      text: 'Ровно. Так были устроены доказательства Хорн: КНФ из всех «разрешённых» дизъюнктов, и для каждого нуля строим отсекающий его дизъюнкт.'
unlocks: [identity_check]

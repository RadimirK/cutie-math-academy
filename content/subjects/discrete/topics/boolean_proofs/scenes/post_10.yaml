id: post_10
title: Примеры, контрпримеры и алгоритмы
character: post
background: library
nodes:
  start:
    - speaker: post
      emotion: smile
      text: 'Задачи вида «приведите пример функции, которая… или докажите, что такой нет». Сначала ищем пример, потом, если не выходит, пытаемся понять почему — и это «почему» часто превращается в доказательство несуществования.'
    - speaker: post
      emotion: smile
      text: 'Как искать пример. Начни с маленького числа переменных. Перебирай «звёзд»: константы, $x$, $\neg x$, $\wedge$, $\vee$, $\to$, $\oplus$, $\equiv$, $x \oplus y \oplus z$, медиана. Выпиши для каждой её классы Поста — это быстрая таблица кандидатов.'
    - speaker: student_a
      emotion: thinking
      text: 'А если нужна функция, существенно зависящая от трёх переменных, а подходит только функция от двух?'
    - speaker: post
      emotion: smile
      text: 'Попробуй аккуратно добавить переменную так, чтобы нужные свойства сохранились. Например, $x \oplus y \oplus z$ — «$\oplus$ с лишней переменной». Или замени переменную на выражение из той же функции. Каждый раз перепроверяй все свойства: добавление переменной легко ломает самодвойственность или монотонность.'
    - speaker: post
      emotion: thinking
      text: 'Пример найден — доказательство состоит в проверке: выпиши таблицу или полином и проверь каждое требуемое свойство. «Видно, что подходит» — не проверка.'
    - speaker: post
      emotion: thinking
      text: 'Если пример не находится, ищи препятствие. Пусть нужна функция из $M \cap L$, существенно зависящая от двух переменных. Мы доказали, что $M \cap L$ — только константы и переменные. Значит, такой функции нет, и это доказательство от противного: предположили, что есть, — пришли к противоречию.'
    - choice:
        question: 'Существует ли функция, лежащая во всех классах Поста, кроме $S$?'
        options:
          - text: 'Да, например $x \wedge y$'
            goto: wrong_and
          - text: 'Нет'
            goto: right
          - text: 'Да, например $\mathbf{0}$'
            goto: wrong_zero
  wrong_and:
    - speaker: post
      emotion: thinking
      text: '$x \wedge y$ не лежит в $L$: её полином $xy$. Нужна функция из $T_0 \cap T_1 \cap M \cap L$. Но $M \cap L$ — только константы и переменные.'
    - goto: right
  wrong_zero:
    - speaker: post
      emotion: thinking
      text: '$\mathbf{0}$ не сохраняет единицу: $\mathbf{0} \notin T_1$. Нужна функция из $T_0 \cap T_1 \cap M \cap L$. Но $M \cap L$ — только константы и переменные.'
    - goto: right
  right:
    - speaker: post
      emotion: happy
      text: 'Нет. Такая функция лежала бы в $M \cap L$, то есть была бы константой или переменной. Константы не лежат одновременно в $T_0$ и $T_1$, а переменная самодвойственна. Противоречие.'
    - speaker: post
      emotion: smile
      text: 'Теперь алгоритмы. Если просят «предложите полиномиальный алгоритм», нужно три вещи. Корректность: почему ответ верный — обычно через инвариант, который верен до цикла и сохраняется каждой итерацией. Завершаемость: какая величина монотонно меняется и ограничена. Оценка: число итераций на стоимость одной.'
    - speaker: student_b
      emotion: thinking
      text: 'Покажите на примере Хорн.'
    - speaker: post
      emotion: smile
      text: 'Инвариант: «каждая поставленная в $1$ переменная равна $1$ в любом выполняющем наборе». Верен в начале — единиц нет. Сохраняется — ставим $1$, только когда правило вынуждает. Завершаемость: число единиц растёт и не больше $n$. Оценка: $n$ итераций, каждая — проход по формуле. А при остановке ответ верен: или все дизъюнкты истинны, или нарушен запрет, и по инварианту решений нет.'
    - speaker: student_a
      emotion: happy
      text: 'То же самое, что индукция по числу шагов!'
    - speaker: post
      emotion: happy
      text: 'Именно. Инвариант цикла — это индукция, записанная для программы. Теперь у тебя есть все инструменты: инварианты, тождества, подсчёт, индукция с усилением, примеры и контрпримеры. Удачи с задачами!'
unlocks: [exists_pick]

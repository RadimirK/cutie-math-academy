id: post_09
title: Как считать
character: post
background: classroom
nodes:
  start:
    - speaker: post
      emotion: smile
      text: 'Задачи «сколько существует функций с таким-то свойством». Базовые правила. Правило произведения: если объект строится независимыми выборами, число вариантов перемножается. Так получилось $2^{2^n}$: в каждую строку таблицы независимо пишем $0$ или $1$.'
    - speaker: post
      emotion: explain
      text: 'Главный приём — найти свободные параметры. Условие часто говорит, какие строки таблицы определяются другими. Сохраняющие ноль: одна строка фиксирована, свободно $2^n - 1$ строк. Самодвойственные: значение на $\alpha$ задаёт значение на $\neg \alpha$, свободна половина строк. Симметричные: свободны значения на весах $0, \ldots, n$.'
    - speaker: post
      emotion: explain
      text: 'Правило суммы: если объекты разбиты на непересекающиеся группы, их число — сумма размеров групп. Так Буль считала функции, существенно зависящие от всех переменных: разбила все функции по множеству существенных переменных.'
    - speaker: post
      emotion: thinking
      text: 'Биекция: если между двумя множествами есть взаимно однозначное соответствие, в них поровну элементов. Подмножества ↔ функции в $\{0, 1\}$, приведённые полиномы ↔ булевы функции. Часто проще посчитать «двойника».'
    - speaker: post
      emotion: thinking
      text: 'Включения-исключения: $|A \cup B| = |A| + |B| - |A \cap B|$. Пересечение посчитано дважды — вычитаем. Для трёх множеств: $|A \cup B \cup C| = \sum |A| - \sum |A \cap B| + |A \cap B \cap C|$, и так далее со сменой знаков.'
    - speaker: student_b
      emotion: thinking
      text: 'Где это нужно для булевых функций?'
    - speaker: post
      emotion: smile
      text: 'Например, сколько функций от $n$ переменных лежат в $T_0$ или в $T_1$? $|T_0| = |T_1| = 2^{2^n - 1}$, а в пересечении фиксированы две строки: $2^{2^n - 2}$. Ответ: $2 \cdot 2^{2^n - 1} - 2^{2^n - 2}$.'
    - speaker: post
      emotion: thinking
      text: 'Или число функций, существенно зависящих от всех $n$ переменных. Пусть $A_i$ — функции, где $x_i$ фиктивна. В любом пересечении $k$ таких множеств свободна функция от $n - k$ переменных: $2^{2^{n - k}}$. По включениям-исключениям $$E(n) = \sum_{k = 0}^{n} (-1)^k \binom{n}{k} 2^{2^{n - k}}.$$'
    - choice:
        question: 'Сколько функций от $2$ переменных существенно зависят от обеих? Подставь в формулу.'
        options:
          - text: '$16 - 4 - 4 + 2 = 10$'
            goto: right
          - text: '$16 - 4 - 4 = 8$'
            goto: wrong
          - text: '$16 - 2 = 14$'
            goto: wrong
  wrong:
    - speaker: post
      emotion: thinking
      text: 'Члены: $k = 0$: $2^{2^2} = 16$. $k = 1$: $-\binom{2}{1} \cdot 2^{2^1} = -8$. $k = 2$: $+\binom{2}{2} \cdot 2^{2^0} = +2$. Константы мы вычли дважды — через $A_1$ и через $A_2$ — и должны вернуть.'
    - goto: right
  right:
    - speaker: post
      emotion: happy
      text: '$16 - 8 + 2 = 10$. Совпадает с рекуррентой Буль. Два способа — хорошая самопроверка.'
    - speaker: post
      emotion: thinking
      text: 'Ещё один приём — подсчёт по модулю два через многочлены, как у Жегалкина в теореме Люка. Чтобы узнать чётность коэффициента, раскладываем $(1 + x)^k$ и пользуемся $(1 + x)^2 \equiv 1 + x^2$. Так чётность биномиальных коэффициентов сводится к двоичной записи.'
    - speaker: student_a
      emotion: happy
      text: 'А как понять, что посчитала верно?'
    - speaker: post
      emotion: happy
      text: 'Проверь формулу на маленьких $n$, где можно перебрать руками: $n = 1$, $n = 2$. Если формула для $n = 2$ даёт не то, что в таблице шестнадцати функций, ошибка найдена.'
unlocks: [count_tricks]

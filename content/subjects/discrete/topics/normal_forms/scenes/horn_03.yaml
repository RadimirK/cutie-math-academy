id: horn_03
title: 2-КНФ Крома
character: horn
background: library
nodes:
  start:
    - speaker: horn
      emotion: smile
      text: 'Формула в 2-КНФ, или в форме Крома: $(t_{11} \vee t_{12}) \wedge (t_{21} \vee t_{22}) \wedge \ldots$, где каждый $t_{ij}$ — переменная или её отрицание. В каждом дизъюнкте ровно два литерала.'
    - speaker: student_b
      emotion: thinking
      text: 'Тоже быстро проверяется?'
    - speaker: horn
      emotion: happy
      text: 'Да! Дизъюнкт $a \vee b$ — это пара импликаций: $\neg a \to b$ и $\neg b \to a$. Нарисуем граф на литералах со всеми такими стрелками. Формула невыполнима ровно тогда, когда какие-то $x$ и $\neg x$ достижимы друг из друга. Это проверяется поиском в графе за линейное время.'
    - speaker: student_a
      emotion: thinking
      text: 'А у Хорн была замкнутость относительно $\wedge$. Здесь тоже есть своя операция?'
    - speaker: horn
      emotion: smile
      text: 'Есть — медиана! Если три набора $\alpha$, $\beta$, $\gamma$ выполняют 2-КНФ, то и покомпонентная медиана $\langle \alpha \beta \gamma \rangle$ её выполняет. Попробуй понять почему.'
    - choice:
        question: 'Какой факт — ключ к доказательству?'
        options:
          - text: 'Медиана монотонна'
            goto: partial
          - text: 'В каждом дизъюнкте какой-то литерал истинен хотя бы в двух наборах из трёх'
            goto: right
          - text: 'Медиана линейна'
            goto: wrong
  wrong:
    - speaker: horn
      emotion: thinking
      text: 'Медиана как раз нелинейна: $\langle xyz \rangle = xy \oplus yz \oplus xz$. Подумай про один дизъюнкт $a \vee b$ и три выполняющих набора: сколько всего «истинностей» литералов?'
    - goto: right
  partial:
    - speaker: horn
      emotion: thinking
      text: 'Монотонность помогает, но отрицания в литералах мешают. Подумай про один дизъюнкт $a \vee b$ и три выполняющих набора: сколько всего «истинностей» литералов?'
    - goto: right
  right:
    - speaker: horn
      emotion: happy
      text: 'Каждый из трёх наборов делает истинным хотя бы один из двух литералов $a$, $b$. Всего не меньше трёх «истинностей» на два литерала — значит, по принципу Дирихле какой-то литерал истинен хотя бы в двух наборах.'
    - speaker: horn
      emotion: thinking
      text: 'Осталось заметить, что медиана коммутирует с отрицанием — она самодвойственна. Значение литерала $\neg x$ на наборе-медиане — это медиана значений $\neg x$ на трёх наборах. Литерал, истинный в двух наборах из трёх, истинен и на медиане. Дизъюнкт выполнен.'
    - speaker: student_b
      emotion: thinking
      text: 'А обратно? Если единицы функции замкнуты относительно медианы — это 2-КНФ?'
    - speaker: horn
      emotion: smile
      text: 'Да, и идея та же, что для Хорн: взять все дизъюнкты из двух литералов, истинные на всех единицах $f$, и доказать, что их конъюнкция отсекает каждый нулевой набор. Тут придётся аккуратно поработать с медианой трёх единиц — оставлю это тебе как задачу со звёздочкой.'
    - speaker: student_a
      emotion: thinking
      text: 'Подсказку?'
    - speaker: horn
      emotion: smile
      text: 'Предположи противное: нулевой набор $\alpha$ не отсекается ни одним двухлитеральным дизъюнктом. Значит, для любых двух позиций найдётся единица $f$, совпадающая с $\alpha$ в этих позициях. Попробуй склеивать такие единицы медианой, увеличивая число совпадающих позиций.'
    - speaker: horn
      emotion: happy
      text: 'Итоговая таблица соответствий. КНФ Хорна — замкнутость относительно $\wedge$. Двойственная (не больше одного отрицания в дизъюнкте) — относительно $\vee$. 2-КНФ — относительно медианы. Системы линейных уравнений по модулю два — относительно $x \oplus y \oplus z$. Для всех четырёх видов SAT решается быстро.'
unlocks: [closure_kind]

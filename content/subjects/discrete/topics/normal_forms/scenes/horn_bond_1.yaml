id: horn_bond_1
title: Промокшие насквозь
character: horn
background: courtyard
nodes:
  start:
    - narration: 'Пятница, вечер. Небо над двором стремительно темнеет. Хорн стоит под навесом и задумчиво смотрит на первые капли.'
    - speaker: horn
      emotion: happy
      text: 'Привет! Ты тоже без зонта? А по прогнозу было солнце! Ну ничего, это ненадолго. Наверное!'
    - narration: 'Дождь, как будто услышав её, превращается в ливень.'
    - speaker: horn
      emotion: happy
      text: 'Ладно! Тогда бежим до общежития! Кто последний — тот угощает какао!'
    - narration: 'Она срывается с места, не дожидаясь ответа. Вы несётесь через двор, перепрыгивая лужи, и влетаете под козырёк общежития мокрые до нитки.'
    - speaker: horn
      emotion: happy
      text: 'Ха-ха! Насквозь! Вообще насквозь! Даже в кедах хлюпает!'
    - narration: 'Хорн трясёт головой, как щенок. Белая матроска промокла и прилипла к телу, сквозь неё отчётливо проступает кружево. Хорн перехватывает твой взгляд и опускает глаза.'
    - speaker: horn
      emotion: surprised
      text: '…Ой. Ой-ой-ой. Она же белая. Она же совсем прозрачная!'
    - choice:
        question: 'Что сделать?'
        options:
          - text: 'Снять мокрый пиджак и накинуть ей на плечи.'
            goto: jacket
          - text: 'Встать перед ней, загородив от окон.'
            goto: shield
  jacket:
    - narration: 'Пиджак мокрый, но плотный. Хорн запахивает его на груди обеими руками и смотрит на тебя снизу вверх.'
    - speaker: horn
      emotion: embarrassed
      text: 'Спасибо… Он пахнет дождём. И тобой. Это нормально, что мне это нравится?'
    - goto: inside
  shield:
    - narration: 'Ты встаёшь так, чтобы из окон никто не увидел. Хорн оказывается между тобой и стеной, совсем близко.'
    - speaker: horn
      emotion: embarrassed
      text: 'Ты… загораживаешь меня от всех? Это… очень по-рыцарски. И очень близко. Я не жалуюсь! Просто отмечаю!'
    - goto: inside
  inside:
    - narration: 'В пустой общей гостиной Хорн заворачивается в плед, отдаёт тебе второй, и вы сидите рядом у батареи с двумя кружками какао.'
    - speaker: horn
      emotion: smile
      text: 'Знаешь, я планировала на завтра пикник. Солнце, прогулка, мороженое. А получился ливень и мокрая матроска.'
    - speaker: horn
      emotion: happy
      text: 'Но вышло даже лучше. Правда-правда. Самые лучшие вещи случаются не по плану.'
    - choice:
        question: 'Что сказать?'
        options:
          - text: 'Может, тогда пикник завтра? Вдвоём.'
            goto: date
          - text: 'Пледа хватит на двоих.'
            goto: blanket
  date:
    - speaker: horn
      emotion: embarrassed
      text: 'Вдвоём?! Это же… это же свидание получается. Да! То есть, да, давай! Если будет солнце. Будет! Я в этом уверена!'
    - goto: end
  blanket:
    - narration: 'Хорн молча приподнимает край своего пледа. Ты пересаживаешься под него, и её мокрое плечо прижимается к твоему.'
    - speaker: horn
      emotion: embarrassed
      text: 'Так теплее. Это просто физика. Ничего такого. Совсем ничего… такого.'
    - goto: end
  end:
    - narration: 'Уходя к себе, Хорн оборачивается в дверях. Пиджак всё ещё у неё на плечах.'
    - speaker: horn
      emotion: smug
      text: 'Пиджак отдам завтра. Постиранный. И не смей больше смотреть на мою матроску так долго!'
    - speaker: horn
      emotion: happy
      text: '…Шучу. Немножко можно. Спокойной ночи!'

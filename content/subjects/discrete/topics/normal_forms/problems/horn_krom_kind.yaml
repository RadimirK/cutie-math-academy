    values:
      - {f: '(\neg x \vee y) \wedge (\neg y \vee \neg z)', ans: 'И то и другое'}
      - {f: '(x \vee y) \wedge (\neg x \vee z)', ans: 'Только 2-КНФ'}
      - {f: '(\neg x \vee \neg y \vee z) \wedge (\neg z \vee t)', ans: 'Только КНФ Хорна'}
      - {f: '(x \vee y \vee \neg z) \wedge (\neg x \vee t)', ans: 'Ни то ни другое'}
      - {f: '(\neg x \vee \neg y) \wedge (\neg y \vee \neg z) \wedge (\neg x \vee \neg z)', ans: 'И то и другое'}
      - {f: '(x \vee \neg y) \wedge (y \vee \neg z) \wedge (z \vee \neg x)', ans: 'И то и другое'}

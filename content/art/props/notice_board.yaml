id: notice_board
desc: Пробковая доска объявлений в деревянной рамке с приколотыми листками и расписанием.
material: cork
shadow: true
params:
  w: { range: [50, 160], default: 92 }
  h: { range: [40, 120], default: 62 }
shapes:
  # (0, 0) — левый верхний угол
  - poly: [[-4, -4], ['$w + 4', -4], ['$w + 4', '$h + 4'], [-4, '$h + 4']]
    material: wood
    seam: true
  - poly: [[0, 0], ['$w', 0], ['$w', '$h'], [0, '$h']]
    seam: true
    shadow: false
  # расписание
  - poly: [[6, 5], ['$w * 0.48', 7], ['$w * 0.47', '$h - 6'], [5, '$h - 8']]
    material: paper
    seam: true
  - stroke: [[10, 13], ['$w * 0.42', 14]]
    material: book2
    repeat: { count: 5, step: [0, 7] }
  - stroke: [[10, 13], ['$w * 0.2', 13]]
    material: accent
  # листки
  - poly: [['$w * 0.56', 8], ['$w * 0.9', 6], ['$w * 0.92', '$h * 0.5'], ['$w * 0.58', '$h * 0.52']]
    material: paper
    seam: true
  - poly: [['$w * 0.6', '$h * 0.6'], ['$w * 0.86', '$h * 0.62'], ['$w * 0.84', '$h - 5'], ['$w * 0.58', '$h - 7']]
    material: book4
    seam: true
  - stroke: [['$w * 0.62', 16], ['$w * 0.84', 15]]
    material: metal
    repeat: { count: 3, step: [0, 6] }
  - stamp: { at: ['$w * 0.27', 6], rows: ['a'], key: { a: 'accent:3' } }
  - stamp: { at: ['$w * 0.73', 8], rows: ['a'], key: { a: 'book2:3' } }
  - stamp: { at: ['$w * 0.71', '$h * 0.62'], rows: ['a'], key: { a: 'accent:3' } }

id: ladder
desc: Старая деревянная библиотечная стремянка, прислонённая к полкам.
material: wood
shadow: true
params:
  h: { range: [60, 240], default: 170 }
shapes:
  # (0, 0) — середина на полу
  - poly: [[-22, 0], [-17, 0], [-9, '-$h'], [-13, '-$h']]
    mirror: true
    seam: true
  - poly: [['-19 + 9 * ($i + 1) / ($h / 22)', '-20 - 22 * $i'], ['19 - 9 * ($i + 1) / ($h / 22)', '-20 - 22 * $i'], ['19 - 9 * ($i + 1) / ($h / 22)', '-16 - 22 * $i'], ['-19 + 9 * ($i + 1) / ($h / 22)', '-16 - 22 * $i']]
    repeat: { count: '$h / 22', step: [0, 0] }
    seam: true

id: table_lamp
desc: 'Библиотечная настольная лампа: латунная ножка и зелёный стеклянный абажур (цвет accent), под ним тёплый свет.'
material: accent
shade: round
shadow: true
shapes:
  # (0, 0) — середина основания
  - ellipse: { at: [0, -2], r: [11, 3] }
    material: book4
    seam: true
  - poly: [[-1, -26], [1, -26], [1, -3], [-1, -3]]
    material: book4
    seam: true
  - poly: [[-18, -34], [18, -34], [20, -26], [-20, -26]]
    seam: true
  - poly: [[-17, -26], [17, -26], [15, -24], [-15, -24]]
    material: lamp
    tone: 4

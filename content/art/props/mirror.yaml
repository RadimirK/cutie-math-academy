id: mirror
desc: Гримёрное зеркало в деревянной раме с рядом лампочек вокруг, на столике с баночками.
material: dark_wood
shadow: true
params:
  w: { range: [40, 140], default: 80 }
  h: { range: [40, 140], default: 70 }
shapes:
  # (0, 0) — середина низа рамы (ставится на столешницу)
  - poly: [['-$w / 2 - 8', '-$h - 8'], ['$w / 2 + 8', '-$h - 8'], ['$w / 2 + 8', 0], ['-$w / 2 - 8', 0]]
    seam: true
  - poly: [['-$w / 2', '-$h'], ['$w / 2', '-$h'], ['$w / 2', -6], ['-$w / 2', -6]]
    material: glass
    seam: true
    shadow: false
    name: mirror_glass
  - stroke: [['-$w / 2 + 8', -12], ['-$w / 2 + 30', '-$h + 6']]
    material: shine
    clip: mirror_glass
  - stroke: [['-$w / 2 + 14', -12], ['-$w / 2 + 36', '-$h + 6']]
    material: shine
    clip: mirror_glass
  # лампочки
  - ellipse: { at: ['-$w / 2 + 6 + 14 * $i', '-$h - 4'], r: 3 }
    material: lamp
    tone: 4
    repeat: { count: '$w / 14 + 1', step: [0, 0] }
  - ellipse: { at: ['-$w / 2 - 4', '-$h + 10 + 14 * $i'], r: 3 }
    material: lamp
    tone: 4
    mirror: true
    repeat: { count: '($h - 10) / 14', step: [0, 0] }
  # баночки и пудреница
  - poly: [[-30, -1], [-24, -1], [-24, 8], [-30, 8]]
    material: blossom
    seam: true
  - poly: [[-20, 2], [-12, 2], [-12, 8], [-20, 8]]
    material: book2
    seam: true
  - ellipse: { at: [22, 6], r: [8, 3] }
    material: accent
    seam: true

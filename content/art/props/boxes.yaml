id: boxes
desc: 'Стопка картонных коробок, заклеенных скотчем; из верхней открытой торчат блёстки и мишура.'
material: cork
shade: flat
shadow: true
params:
  stack: { range: [1, 3], default: 3, int: true, desc: коробок в стопке }
shapes:
  # (0, 0) — середина на полу
  - poly: [[-30, -34], [30, -34], [30, 0], [-30, 0]]
    seam: true
  - stroke: [[-30, -24], [30, -24]]
    material: paper
    tone: 1
  - poly: [[-24, -60], [22, -60], [22, -34], [-24, -34]]
    seam: true
    when: { stack: { min: 2 } }
  - stroke: [[-1, -60], [-1, -34]]
    material: paper
    tone: 1
    when: { stack: { min: 2 } }
  - poly: [[-16, -80], [18, -80], [18, -60], [-16, -60]]
    seam: true
    when: { stack: { min: 3 } }
  - poly: [[-16, -80], [-26, -88], [-14, -86], [-6, -80]]
    seam: true
    when: { stack: { min: 3 } }
  - stamp:
      at: [2, -83]
      rows: ['.s..g.s', 's.g.s..', '.a.s.g.']
      key: { s: shine, g: 'book4:4', a: 'accent:3' }
    when: { stack: { min: 3 } }

id: cloud
desc: Пухлое облако с плоским низом, тень снизу справа.
material: cloud
shade: round
outline: false
params:
  size: { range: [0.4, 3.0], default: 1.0 }
shapes:
  # (0, 0) — середина низа
  - ellipse: { at: ['-20 * $size', '-9 * $size'], r: ['15 * $size', '10 * $size'] }
  - ellipse: { at: ['2 * $size', '-16 * $size'], r: ['18 * $size', '14 * $size'] }
  - ellipse: { at: ['24 * $size', '-9 * $size'], r: ['14 * $size', '9 * $size'] }
  - poly: [['-34 * $size', '-8 * $size'], ['38 * $size', '-8 * $size'], ['34 * $size', 0], ['-30 * $size', 0]]

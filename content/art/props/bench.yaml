id: bench
desc: Деревянная скамейка на металлических ножках, анфас.
material: wood
shadow: true
params:
  w: { range: [60, 200], default: 110 }
shapes:
  # (0, 0) — середина на земле
  - poly: [['-$w / 2 + 8', -18], ['-$w / 2 + 12', -18], ['-$w / 2 + 12', 0], ['-$w / 2 + 8', 0]]
    material: metal
    mirror: true
    seam: true
  - poly: [['-$w / 2', -42], ['$w / 2', -42], ['$w / 2', -36], ['-$w / 2', -36]]
    seam: true
  - poly: [['-$w / 2', -34], ['$w / 2', -34], ['$w / 2', -28], ['-$w / 2', -28]]
    seam: true
  - poly: [['-$w / 2 + 8', -36], ['-$w / 2 + 12', -36], ['-$w / 2 + 12', -18], ['-$w / 2 + 8', -18]]
    material: metal
    mirror: true
    seam: true
  - poly: [['-$w / 2 - 4', -22], ['$w / 2 + 4', -22], ['$w / 2 + 4', -16], ['-$w / 2 - 4', -16]]
    seam: true

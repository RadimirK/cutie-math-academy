id: ground
desc: 'Земля до нижнего края: tiles — бетонные плиты в перспективе (крыша), grass — газон с пучками травы и дорожкой.'
material: floor
outline: false
params:
  top: { range: [120, 340], default: 230, desc: где начинается земля }
  surface: { options: [tiles, grass], default: tiles }
shapes:
  # (0, 0) — левый верхний угол холста
  - poly: [[0, '$top'], [640, '$top'], [640, 360], [0, 360]]
    name: ground_area
    when: { surface: tiles }
  - stroke: [['320 + ($i - 10) * 70', 360], ['320 + ($i - 10) * 70 * 0.35', '$top']]
    tone: 1
    clip: ground_area
    repeat: { count: 21, step: [0, 0] }
    when: { surface: tiles }
  - stroke: [[0, '$top + 4 + 4 * $i * $i'], [640, '$top + 4 + 4 * $i * $i']]
    tone: 1
    clip: ground_area
    repeat: { count: 7, step: [0, 0] }
    when: { surface: tiles }
  - poly: [[0, '$top'], [640, '$top'], [640, 360], [0, 360]]
    material: plant
    when: { surface: grass }
  - poly: [[0, '$top'], [640, '$top'], [640, '$top + 3'], [0, '$top + 3']]
    material: plant
    tone: 1
    when: { surface: grass }
  # дорожка к зданию
  - poly: [[290, '$top'], [350, '$top'], [470, 360], [170, 360]]
    material: floor
    when: { surface: grass }
  - stamp:
      at: ['($i * 97) % 640', '$top + 8 + ($i * 37) % (350 - $top)']
      rows: ['g.g', '.g.']
      key: { g: 'plant:1' }
    repeat: { count: 70, step: [0, 0] }
    when: { surface: grass }
  - stamp:
      at: ['($i * 61 + 30) % 640', '$top + 6 + ($i * 23) % (350 - $top)']
      rows: ['.g.', 'g.g']
      key: { g: 'plant:3' }
    repeat: { count: 50, step: [0, 0] }
    when: { surface: grass }

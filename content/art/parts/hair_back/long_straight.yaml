id: long_straight
desc: Длинные прямые волосы за спиной, ровно расходятся от макушки.
material: hair
params:
  length: { range: [1.2, 7.0], default: 3.6, desc: 'где кончаются, в радиусах головы от центра' }
  width: { range: [1.15, 1.5], default: 1.3, desc: ширина копны }
shapes:
  - poly:
      - [0, -1.22]
      - [-0.85, -0.95]
      - ['-$width + 0.05', -0.2]
      - ['-$width', 0.8]
      - ['-$width - 0.05', '$length - 0.2']
      - ['-$width + 0.3', '$length']
      - [0, '$length + 0.08']
      - ['$width - 0.3', '$length']
      - ['$width + 0.05', '$length - 0.2']
      - ['$width', 0.8]
      - ['$width - 0.05', -0.2]
      - [0.85, -0.95]
    smooth: true

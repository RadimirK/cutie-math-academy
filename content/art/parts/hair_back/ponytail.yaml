id: ponytail
desc: Высокий хвост на затылке; из-за головы виден пушистый хвост, качнувшийся вправо.
material: hair
seams: true
params:
  length: { range: [1.2, 4.0], default: 2.4, desc: 'докуда виден хвост сбоку; ниже он уходит за спину' }
  swing: { range: [0.6, 2.4], default: 1.6, desc: насколько хвост отклонён вправо }
shapes:
  - ellipse: { at: [0, -0.12], r: [1.04, 1.06] }
  # пучок у резинки над макушкой
  - ellipse: { at: [0.18, -1.24], r: [0.34, 0.2], rot: -15 }
  # из-за головы хвост виден сбоку: выходит вбок и свисает к плечу, дальше уходит за спину
  - strand: { from: [0.25, -1.3], to: ['$swing', '$length'], bend: -0.36, width: [0.8, 0.34] }
  - strand: { from: [0.3, -1.28], to: ['$swing + 0.25', '$length * 0.72'], bend: -0.4, width: [0.5, 0.16] }

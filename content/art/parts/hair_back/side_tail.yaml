id: side_tail
desc: Один хвост сбоку головы (справа на картинке), задорно торчит наружу; затылок короткий.
material: hair
seams: true
params:
  length: { range: [1.5, 6.0], default: 3.2, desc: докуда хвост }
  spread: { range: [1.4, 2.4], default: 1.9, desc: насколько хвост отходит в сторону }
shapes:
  - ellipse: { at: [0, -0.12], r: [1.04, 1.06] }
  - strand: { from: [0.92, -0.72], to: ['$spread', '$length'], bend: -0.16, width: [0.72, 0.16] }
    slot: outfit
    shadow: true
  - strand: { from: [0.98, -0.6], to: ['$spread - 0.4', '$length * 0.84'], bend: -0.08, width: [0.44, 0.06] }
    slot: outfit
    shadow: true
  - strand: { from: [0.9, -0.82], to: ['$spread + 0.3', '$length * 0.62'], bend: -0.3, width: [0.38, 0.06] }
    slot: outfit
    shadow: true

id: ribbons
desc: Два банта у основания хвостиков.
material: accent
shadow: true
params:
  size: { range: [0.7, 1.3], default: 1, desc: размер бантов }
shapes:
  - poly: [[-0.95, -0.86], ['-0.95 - 0.42 * $size', '-0.86 - 0.36 * $size'], ['-0.95 - 0.46 * $size', '-0.86 + 0.24 * $size']]
    mirror: true
    seam: true
  - poly: [[-0.95, -0.86], ['-0.95 + 0.36 * $size', '-0.86 - 0.4 * $size'], ['-0.95 + 0.42 * $size', '-0.86 + 0.2 * $size']]
    mirror: true
    seam: true
  - ellipse: { at: [-0.95, -0.86], r: '0.1 * $size' }
    mirror: true
    seam: true

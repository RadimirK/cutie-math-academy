id: beret
desc: Мягкий берет цвета accent, сдвинутый набок и надетый на волосы, с хвостиком на макушке.
material: accent
shade: round
shadow: true
params:
  tilt: { range: [-25, 25], default: -14, desc: наклон в градусах }
shapes:
  # купол лежит на волосах, край опущен к уху
  - ellipse: { at: [0.22, -0.98], r: [0.92, 0.44], rot: '$tilt' }
    seam: true
  - poly: [[-0.62, -0.86], [0.98, -1.18], [1.02, -1.06], [-0.6, -0.74]]
    tone: 1
  - stroke: [[0.18, -1.4], [0.24, -1.54]]
    tone: 0

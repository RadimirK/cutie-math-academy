id: basic
desc: Стройное тело в полный рост, ноги вместе. Левая рука вдоль тела, правая по позе.
material: skin
shade: flat
params:
  pose:
    options: [down, chin, hip]
    default: down
    desc: 'правая рука (справа на картинке): down — вдоль тела, chin — у подбородка (задумчиво), hip — на поясе (уверенно)'
shapes:
  - poly: [[-0.24, 0.7], [0.24, 0.7], [0.27, 1.55], [-0.27, 1.55]]
    name: neck
  - poly:
      - [-0.27, 1.32]
      - [0.27, 1.32]
      - ['0.9 * $shoulders', 1.48]
      - ['1.26 * $shoulders', 1.64]
      - ['1.26 * $shoulders', 1.92]
      - [0.98, 2.5]
      - [0.72, 3.2]
      - [0.88, 3.75]
      - [0.94, 4.1]
      - [0.5, 4.45]
      - [0, 4.5]
      - [-0.5, 4.45]
      - [-0.94, 4.1]
      - [-0.88, 3.75]
      - [-0.72, 3.2]
      - [-0.98, 2.5]
      - ['-1.26 * $shoulders', 1.92]
      - ['-1.26 * $shoulders', 1.64]
      - ['-0.9 * $shoulders', 1.48]
    smooth: true
    name: torso
  # нога одним контуром: бедро, колено, икра, щиколотка
  - poly:
      - [-0.92, 4.0]
      - [-0.8, 5.3]
      - [-0.6, 6.6]
      - [-0.6, 7.35]
      - [-0.47, 8.4]
      - [-0.43, 8.98]
      - [-0.24, 8.98]
      - [-0.22, 8.4]
      - [-0.15, 7.4]
      - [-0.18, 6.65]
      - [-0.06, 5.3]
      - [-0.02, 4.2]
    smooth: true
    mirror: true
    seam: true
    name: legs
  - ellipse: { at: [-0.34, 9.1], r: [0.16, 0.13] }
    mirror: true
    seam: true
    name: feet
  # левая рука всегда опущена; кисти рисуются поверх одежды и юбки
  - strand: { from: ['-1.14 * $shoulders', 1.72], to: ['-1.34 * $shoulders', 3.25], bend: 0.03, width: [0.48, 0.35] }
    seam: true
    name: arms
  - strand: { from: ['-1.34 * $shoulders', 3.18], to: ['-1.52 * $shoulders', 4.6], width: [0.35, 0.25] }
    seam: true
    name: arms
  - ellipse: { at: ['-1.56 * $shoulders', 4.84], r: [0.18, 0.27], rot: 10 }
    seam: true
    slot: outfit
    name: hands
  # правая рука: вдоль тела
  - strand: { from: ['1.14 * $shoulders', 1.72], to: ['1.34 * $shoulders', 3.25], bend: -0.03, width: [0.48, 0.35] }
    seam: true
    name: arms
    when: { pose: down }
  - strand: { from: ['1.34 * $shoulders', 3.18], to: ['1.52 * $shoulders', 4.6], width: [0.35, 0.25] }
    seam: true
    name: arms
    when: { pose: down }
  - ellipse: { at: ['1.56 * $shoulders', 4.84], r: [0.18, 0.27], rot: -10 }
    seam: true
    slot: outfit
    name: hands
    when: { pose: down }
  # правая рука: у подбородка, кисть перед лицом
  - strand: { from: ['1.14 * $shoulders', 1.72], to: ['1.1 * $shoulders', 3.1], bend: -0.05, width: [0.48, 0.36] }
    seam: true
    name: arms
    when: { pose: chin }
  - strand: { from: ['1.08 * $shoulders', 3.02], to: [0.44, 1.4], bend: 0.06, width: [0.36, 0.26] }
    seam: true
    name: arms
    when: { pose: chin }
  - ellipse: { at: [0.34, 1.2], r: [0.2, 0.24], rot: -30 }
    seam: true
    slot: mouth
    name: hands
    when: { pose: chin }
  # правая рука: на поясе
  - strand: { from: ['1.14 * $shoulders', 1.72], to: ['1.6 * $shoulders', 2.95], bend: -0.04, width: [0.48, 0.36] }
    seam: true
    name: arms
    when: { pose: hip }
  - strand: { from: ['1.58 * $shoulders', 2.9], to: [0.98, 3.68], bend: -0.08, width: [0.36, 0.27] }
    seam: true
    name: arms
    when: { pose: hip }
  - ellipse: { at: [0.9, 3.72], r: [0.22, 0.19], rot: 20 }
    seam: true
    slot: outfit
    name: hands
    when: { pose: hip }

id: long_skirt
desc: Длинная лёгкая юбка-клёш без складок-плиссе, с волнистым подолом и мягкими заломами.
material: skirt
shadow: true
params:
  length: { range: [7.0, 9.0], default: 8.4, desc: докуда юбка }
  flare: { range: [1.3, 2.2], default: 1.75, desc: ширина подола }
shapes:
  - poly:
      - [-0.76, 3.35]
      - [0.76, 3.35]
      - [1.02, 4.1]
      - ['$flare', '$length - 0.08']
      - ['$flare * 0.66', '$length + 0.06']
      - ['$flare * 0.33', '$length - 0.04']
      - [0, '$length + 0.06']
      - ['-$flare * 0.33', '$length - 0.04']
      - ['-$flare * 0.66', '$length + 0.06']
      - ['-$flare', '$length - 0.08']
      - [-1.02, 4.1]
    smooth: true
  - stroke: [[-0.36, 4.2], ['-$flare * 0.33', '$length - 0.1']]
    smooth: true
    tone: 1
    mirror: true
  - stroke: [[-0.8, 4.4], ['-$flare * 0.7', '$length - 0.1']]
    tone: 3
    mirror: true
  - poly: [[-0.78, 3.35], [0.78, 3.35], [0.8, 3.52], [-0.8, 3.52]]
    tone: 1

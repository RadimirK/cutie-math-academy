id: pants
desc: Прямые брюки по ногам до щиколоток со стрелками и поясом; length покороче — укороченные.
material: skirt
shadow: true
params:
  length: { range: [6.5, 9.0], default: 8.85, desc: докуда штанины }
shapes:
  - poly: [[-2, 3.35], [2, 3.35], [2, '$length'], [-2, '$length']]
    clip: [torso, legs]
    grow: 1
  - stroke: [[-0.42, 4.6], [-0.38, '$length - 0.1']]
    tone: 1
    mirror: true
  - poly: [[-0.78, 3.35], [0.78, 3.35], [0.8, 3.55], [-0.8, 3.55]]
    tone: 1
  - stroke: [[0.02, 3.6], [0.02, 4.3]]
    tone: 1

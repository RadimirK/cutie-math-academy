id: shorts
desc: Короткие шорты с поясом, пуговицей и подвёрнутыми штанинами.
material: skirt
shadow: true
params:
  length: { range: [4.5, 6.0], default: 5.1, desc: 'докуда штанины' }
shapes:
  - poly: [[-0.76, 3.35], [0.76, 3.35], [1.0, 4.05], [1.0, '$length'], [0.08, '$length'], [0, 4.62], [-0.08, '$length'], [-1.0, '$length'], [-1.0, 4.05]]
  - poly: [[-1.04, '$length - 0.2'], [-0.06, '$length - 0.2'], [-0.06, '$length'], [-1.04, '$length']]
    tone: 3
    mirror: true
    seam: true
  - poly: [[-0.78, 3.35], [0.78, 3.35], [0.8, 3.55], [-0.8, 3.55]]
    tone: 1
  - stroke: [[0.02, 3.6], [0.02, 4.4]]
    tone: 1
  - stamp: { at: [0.02, 3.45], rows: ['m'], key: { m: 'metal:3' } }

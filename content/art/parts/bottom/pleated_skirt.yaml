id: pleated_skirt
desc: 'Плиссированная школьная юбка, расширяется от бёдер; pattern: plaid — в клетку: полосы цвета accent и тонкие линии cloth2.'
material: skirt
shadow: true
params:
  length: { range: [5.0, 7.6], default: 5.8, desc: 'докуда юбка: 5.8 — середина бедра, 6.8 — колено' }
  flare: { range: [1.1, 1.8], default: 1.42, desc: ширина подола }
  pattern: { options: [none, plaid], default: none }
shapes:
  - poly:
      - [-0.76, 3.35]
      - [0.76, 3.35]
      - [1.0, 4.05]
      - ['$flare', '$length - 0.05']
      - ['$flare * 0.75', '$length + 0.05']
      - ['$flare * 0.5', '$length - 0.03']
      - ['$flare * 0.25', '$length + 0.06']
      - [0, '$length - 0.02']
      - ['-$flare * 0.25', '$length + 0.06']
      - ['-$flare * 0.5', '$length - 0.03']
      - ['-$flare * 0.75', '$length + 0.05']
      - ['-$flare', '$length - 0.05']
      - [-1.0, 4.05]
    name: skirt
  # складки
  - stroke: [[-0.22, 4.2], ['-$flare * 0.25', '$length + 0.02']]
    tone: 1
    mirror: true
  - stroke: [[-0.62, 4.15], ['-$flare * 0.75', '$length']]
    tone: 1
    mirror: true
  # клетка: две широкие полосы и тонкие линии поперёк и вдоль
  - poly: [[-2, '$length - 0.62'], [2, '$length - 0.62'], [2, '$length - 0.42'], [-2, '$length - 0.42']]
    material: accent
    tone: 1
    clip: skirt
    when: { pattern: plaid }
  - poly: [[-2, 4.3], [2, 4.3], [2, 4.48], [-2, 4.48]]
    material: accent
    tone: 1
    clip: skirt
    when: { pattern: plaid }
  - stroke: [[-2, '$length - 0.52'], [2, '$length - 0.52']]
    material: cloth2
    tone: 2
    clip: skirt
    when: { pattern: plaid }
  - stroke: [[-0.42, 3.9], ['-$flare * 0.5', '$length']]
    material: accent
    tone: 2
    mirror: true
    clip: skirt
    when: { pattern: plaid }
  - stroke: [[0, 3.9], [0, '$length']]
    material: accent
    tone: 2
    clip: skirt
    when: { pattern: plaid }

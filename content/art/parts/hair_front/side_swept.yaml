id: side_swept
desc: Косая чёлка с пробором справа, длинные пряди уходят влево и прикрывают бровь; у висков пряди разной длины.
material: hair
shadow: true
seams: true
highlight: hair_band
params:
  length: { range: [-0.1, 0.35], default: 0.15, desc: докуда опускается самая длинная прядь слева }
  side: { range: [0.5, 3.2], default: 1.2, desc: длина прядей у висков }
shapes:
  - poly:
      - [-1.08, 0.1]
      - [-1.1, -0.45]
      - [-0.84, -0.98]
      - [0, -1.18]
      - [0.84, -0.98]
      - [1.1, -0.45]
      - [1.08, 0.1]
      - [0.78, -0.5]
      - [0.4, -0.72]
      - [-0.2, -0.56]
      - [-0.74, -0.4]
    smooth: true
  - strand: { from: [-0.88, -0.7], to: ['-1.16', '$side'], bend: 0.05, width: [0.48, 0.16] }
  - strand: { from: [0.9, -0.66], to: ['1.12', '$side * 0.8'], bend: -0.04, width: [0.42, 0.12] }
  # пряди от пробора справа налево
  - strand: { from: [0.42, -1.1], to: [-0.92, '$length'], bend: -0.12, width: [0.42, 0.06] }
  - strand: { from: [0.5, -1.06], to: [-0.5, '$length - 0.12'], bend: -0.1, width: [0.42, 0.06] }
  - strand: { from: [0.56, -1.02], to: [-0.1, '$length - 0.28'], bend: -0.1, width: [0.4, 0.06] }
  - strand: { from: [0.6, -0.98], to: [0.3, -0.38], bend: -0.08, width: [0.36, 0.06] }
  - strand: { from: [0.66, -0.96], to: [0.84, -0.12], bend: 0.04, width: [0.36, 0.04] }
  - strand: { from: [0.3, -1.12], to: [-0.78, -0.3], bend: -0.14, width: [0.4, 0.04] }

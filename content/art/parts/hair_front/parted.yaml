id: parted
desc: Прямой пробор посередине, лоб открыт; две гладкие шторки прядей расходятся к вискам и обрамляют лицо.
material: hair
shadow: true
seams: true
highlight: hair_band
params:
  forehead: { range: [-0.95, -0.6], default: -0.78, desc: 'докуда открыт лоб у пробора: -0.95 — высоко, -0.6 — низко' }
  side: { range: [0.5, 3.2], default: 1.3, desc: длина боковых прядей }
shapes:
  - poly:
      - [-1.08, 0.1]
      - [-1.1, -0.45]
      - [-0.84, -0.98]
      - [0, -1.18]
      - [0.84, -0.98]
      - [1.1, -0.45]
      - [1.08, 0.1]
      - [0.9, 0.0]
      - [0.62, -0.4]
      - [0.26, '$forehead + 0.06']
      - [0, '$forehead']
      - [-0.26, '$forehead + 0.06']
      - [-0.62, -0.4]
      - [-0.9, 0.0]
    smooth: true
  # шторки: пряди от пробора выгибаются наружу к вискам
  - strand: { from: [-0.05, -1.12], to: [-0.86, 0.05], bend: -0.14, width: [0.3, 0.12] }
    mirror: true
  - strand: { from: [-0.24, -1.1], to: [-1.0, 0.3], bend: -0.12, width: [0.36, 0.14] }
    mirror: true
  - strand: { from: [-0.86, -0.7], to: [-1.14, '$side'], bend: 0.05, width: [0.5, 0.18] }
    mirror: true

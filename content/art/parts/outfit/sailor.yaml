id: sailor
desc: 'Матроска: верх цвета cloth, большой воротник цвета юбки с полоской cloth2, шейный платок цвета accent.'
material: cloth
params:
  hem: { range: [3.3, 4.2], default: 3.6, desc: нижний край блузы }
  sleeve: { range: [2.3, 4.6], default: 4.55, desc: 'длина рукава: 2.3 — короткий, 4.55 — до запястья' }
shapes:
  - poly: [[-2.2, 1.2], [2.2, 1.2], [2.2, '$hem'], [-2.2, '$hem']]
    clip: torso
    grow: 1
  - poly: [[-2.2, 1.2], [2.2, 1.2], [2.2, '$hem'], [-2.2, '$hem']]
    clip: chest
    seam: true
    shadow: true
    when: { chest: { min: 0.2 } }
  # вырез с вставкой
  - poly: [[-0.26, 1.34], [0.26, 1.34], [0.3, 1.6], [0, 2.45], [-0.3, 1.6]]
    material: cloth2
  # воротник лежит на плечах и сходится углом
  - poly: [[-0.3, 1.3], ['-1.22 * $shoulders', 1.58], ['-1.08 * $shoulders', 2.0], [-0.04, 2.68], [0, 2.46], [-0.3, 1.62]]
    material: skirt
    mirror: true
    clip: torso
    grow: 1
    seam: true
    shadow: true
  - stroke: [['-1.08 * $shoulders', 1.84], [-0.06, 2.52]]
    material: cloth2
    tone: 3
    mirror: true
    clip: torso
  # шейный платок
  - poly: [[-0.06, 2.4], [-0.34, 2.38], [-0.26, 2.66], [-0.06, 2.56]]
    material: accent
    mirror: true
    seam: true
    shadow: true
  - poly: [[-0.1, 2.52], [-0.3, 3.15], [-0.08, 3.05], [0, 2.6]]
    material: accent
    mirror: true
    seam: true
    shadow: true
  - ellipse: { at: [0, 2.5], r: [0.11, 0.1] }
    material: accent
    seam: true
    shadow: true
  # рукава с манжетами цвета воротника
  - poly: [[-2.4, 1.5], [0, 1.5], [0, '$sleeve'], [-2.4, '$sleeve']]
    clip: arms
    grow: 1
    seam: true
    shadow: true
  - poly: [[0, 1.5], [2.4, 1.5], [2.4, '$sleeve'], [0, '$sleeve']]
    clip: arms
    grow: 1
    seam: true
    shadow: true
  - poly: [[-2.4, '$sleeve - 0.2'], [2.4, '$sleeve - 0.2'], [2.4, '$sleeve'], [-2.4, '$sleeve']]
    material: skirt
    clip: arms
    grow: 1
    seam: true

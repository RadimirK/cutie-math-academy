id: coat
desc: 'Двубортный плащ-тренч до колен с широким воротником, пуговицами в два ряда и поясом с пряжкой.'
material: cloth
shadow: true
params:
  hem: { range: [5.0, 7.4], default: 6.6, desc: нижний край }
  sleeve: { range: [3.6, 4.7], default: 4.65, desc: длина рукава }
shapes:
  - poly: [[-2.2, 1.2], [2.2, 1.2], [2.2, 4.0], [-2.2, 4.0]]
    clip: torso
    grow: 1
  - poly: [[-0.98, 3.6], [0.98, 3.6], [1.36, '$hem'], [-1.36, '$hem']]
  - poly: [[-2.2, 1.2], [2.2, 1.2], [2.2, 4.0], [-2.2, 4.0]]
    clip: chest
    seam: true
    shadow: true
    when: { chest: { min: 0.2 } }
  # запах: полы сходятся со смещением, разрез внизу
  - stroke: [[0.14, 1.9], [0.2, 3.2], [0.34, '$hem']]
    tone: 1
  - poly: [[0.2, 4.6], [0.5, '$hem'], [0.1, '$hem']]
    erase: true
  - stamp: { at: [-0.26, 2.2], rows: ['b...b'], key: { b: 'cloth:0' } }
  - stamp: { at: [-0.26, 2.75], rows: ['b...b'], key: { b: 'cloth:0' } }
  # пояс с пряжкой
  - poly: [[-2.2, 3.18], [2.2, 3.18], [2.2, 3.42], [-2.2, 3.42]]
    clip: torso
    grow: 1
    tone: 1
    seam: true
  - stroke: [[-0.16, 3.2], [0.16, 3.2], [0.16, 3.4], [-0.16, 3.4]]
    closed: true
    material: metal
  - strand: { from: [0.3, 3.36], to: [0.46, 4.1], bend: 0.1, width: [0.14, 0.1] }
    tone: 1
  # широкий воротник с лацканами
  - poly: [[-0.3, 1.3], [-0.82, 1.5], [-0.66, 2.06], [-0.1, 1.86], [-0.24, 1.56]]
    mirror: true
    seam: true
    shadow: true
  - poly: [[-2.4, 1.5], [0, 1.5], [0, '$sleeve'], [-2.4, '$sleeve']]
    clip: arms
    grow: 1
    seam: true
    shadow: true
  - poly: [[-2.4, 1.5], [0, 1.5], [0, '$sleeve'], [-2.4, '$sleeve']]
    clip: forearms
    grow: 1
    seam: true
    shadow: true
    when: { sleeve: { min: 3.2 } }
  - poly: [[0, 1.5], [2.4, 1.5], [2.4, '$sleeve'], [0, '$sleeve']]
    clip: arms
    grow: 1
    seam: true
    shadow: true
  - poly: [[0, 1.5], [2.4, 1.5], [2.4, '$sleeve'], [0, '$sleeve']]
    clip: forearms
    grow: 1
    seam: true
    shadow: true
    when: { sleeve: { min: 3.2 } }
  - poly: [[-2.4, '$sleeve - 0.2'], [2.4, '$sleeve - 0.2'], [2.4, '$sleeve'], [-2.4, '$sleeve']]
    clip: [arms, forearms]
    grow: 1
    tone: 1

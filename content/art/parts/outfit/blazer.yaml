id: blazer
desc: Школьный пиджак до бёдер с широкими отворотами, белая рубашка с воротником, бант или галстук.
material: cloth
params:
  neck: { options: [ribbon, tie], default: ribbon, desc: что на шее }
  hem: { range: [3.3, 4.8], default: 4.1, desc: нижний край пиджака }
  sleeve: { range: [2.3, 4.6], default: 4.55, desc: 'длина рукава: 2.3 — короткий, 4.55 — до запястья' }
shapes:
  # пиджак повторяет торс
  - poly: [[-2.2, 1.2], [2.2, 1.2], [2.2, '$hem'], [-2.2, '$hem']]
    clip: torso
    grow: 1
  # объём груди
  - poly: [[-2.2, 1.2], [2.2, 1.2], [2.2, '$hem'], [-2.2, '$hem']]
    clip: chest
    seam: true
    shadow: true
    when: { chest: { min: 0.2 } }
  # рубашка в вырезе
  - poly: [[-0.3, 1.34], [0.3, 1.34], [0.36, 1.6], [0, 2.75], [-0.36, 1.6]]
    material: cloth2
  # отвороты
  - poly: [[-0.33, 1.42], [-0.6, 1.55], [-0.52, 1.95], [-0.04, 2.95], [0, 2.76], [-0.36, 1.6]]
    mirror: true
    seam: true
    shadow: true
  # борт и пуговицы
  - stroke: [[0.02, 2.95], [0.04, '$hem']]
    tone: 1
  - stamp: { at: [0.16, 3.2], rows: ['b'], key: { b: 'accent:1' } }
  - stamp: { at: [0.16, 3.7], rows: ['b'], key: { b: 'accent:1' } }
  # воротник рубашки
  - poly: [[-0.27, 1.3], [-0.02, 1.5], [-0.12, 1.68], [-0.42, 1.5]]
    material: cloth2
    mirror: true
  - poly: [[-0.38, 1.5], [-0.05, 1.6], [-0.38, 1.78]]
    material: accent
    mirror: true
    shadow: true
    when: { neck: ribbon }
  - ellipse: { at: [0, 1.6], r: [0.09, 0.09] }
    material: accent
    when: { neck: ribbon }
  - poly: [[-0.09, 1.53], [0.09, 1.53], [0.12, 2.35], [0, 2.5], [-0.12, 2.35]]
    material: accent
    shadow: true
    when: { neck: tie }
  # рукава последними: поднятая рука лежит поверх отворотов и галстука
  - poly: [[-2.4, 1.5], [0, 1.5], [0, '$sleeve'], [-2.4, '$sleeve']]
    clip: arms
    grow: 1
    seam: true
    shadow: true
  - poly: [[0, 1.5], [2.4, 1.5], [2.4, '$sleeve'], [0, '$sleeve']]
    clip: arms
    grow: 1
    seam: true
    shadow: true

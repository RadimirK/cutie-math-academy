id: blazer
desc: Школьный пиджак с широкими отворотами, белая рубашка с воротником, бант или галстук.
material: cloth
params:
  neck: { options: [ribbon, tie], default: ribbon, desc: что на шее }
shapes:
  # пиджак
  - poly:
      - [-0.3, 1.36]
      - [0.3, 1.36]
      - ['0.92 * $shoulders', 1.52]
      - ['1.48 * $shoulders', 1.7]
      - ['1.78 * $shoulders', 2.1]
      - ['1.86 * $shoulders', 2.7]
      - ['1.9 * $shoulders', 3.9]
      - ['-1.9 * $shoulders', 3.9]
      - ['-1.86 * $shoulders', 2.7]
      - ['-1.78 * $shoulders', 2.1]
      - ['-1.48 * $shoulders', 1.7]
      - ['-0.92 * $shoulders', 1.52]
    smooth: true
  # рукава
  - poly: [['-1.36 * $shoulders', 1.72], ['-1.78 * $shoulders', 2.1], ['-1.9 * $shoulders', 3.9], ['-1.46 * $shoulders', 3.9], ['-1.42 * $shoulders', 2.4]]
    smooth: false
    mirror: true
    seam: true
  # рубашка в вырезе
  - poly: [[-0.3, 1.34], [0.3, 1.34], [0.36, 1.6], [0, 2.75], [-0.36, 1.6]]
    material: cloth2
  # отвороты поверх рубашки
  - poly: [[-0.36, 1.4], [-0.6, 1.56], [-0.56, 1.86], [-0.02, 2.85], [0, 3.9], [-0.3, 3.9]]
    mirror: true
    seam: true
  # воротник рубашки
  - poly: [[-0.27, 1.3], [-0.02, 1.5], [-0.12, 1.68], [-0.42, 1.5]]
    material: cloth2
    mirror: true
  - poly: [[-0.38, 1.5], [-0.05, 1.6], [-0.38, 1.78]]
    material: accent
    mirror: true
    when: { neck: ribbon }
  - ellipse: { at: [0, 1.6], r: [0.09, 0.09] }
    material: accent
    when: { neck: ribbon }
  - poly: [[-0.09, 1.53], [0.09, 1.53], [0.12, 2.35], [0, 2.5], [-0.12, 2.35]]
    material: accent
    when: { neck: tie }
  # пуговицы
  - stamp: { at: [0.18, 3.1], rows: ['bb'], key: { b: 'accent:1' } }

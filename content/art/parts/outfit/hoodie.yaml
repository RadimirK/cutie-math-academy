id: hoodie
desc: 'Мягкое худи с капюшоном, лежащим на плечах, карманом-кенгуру и шнурками цвета accent; zip: open — нараспашку, под ним футболка cloth2.'
material: cloth
params:
  zip: { options: [closed, open], default: closed }
  hem: { range: [3.8, 4.8], default: 4.4, desc: нижний край }
  sleeve: { range: [2.3, 4.8], default: 4.7, desc: длина рукава }
shapes:
  - poly: [[-2.2, 1.2], [2.2, 1.2], [2.2, '$hem'], [-2.2, '$hem']]
    clip: torso
    grow: 2
  - poly: [[-2.2, 1.2], [2.2, 1.2], [2.2, '$hem'], [-2.2, '$hem']]
    clip: chest
    seam: true
    shadow: true
    when: { chest: { min: 0.2 } }
  # широкий низ свободно висит
  - poly: [[-0.96, 3.6], [0.96, 3.6], [1.04, '$hem'], [-1.04, '$hem']]
  - poly: [[-1.06, '$hem - 0.26'], [1.06, '$hem - 0.26'], [1.06, '$hem'], [-1.06, '$hem']]
    tone: 1
  # распахнутый перед и футболка
  - poly: [[-0.2, 1.4], [0.2, 1.4], [0.3, '$hem + 0.1'], [-0.3, '$hem + 0.1']]
    erase: true
    when: { zip: open }
  - poly: [[-0.42, 1.3], [0.42, 1.3], [0.42, '$hem'], [-0.42, '$hem']]
    material: cloth2
    clip: torso
    when: { zip: open }
  - stroke: [[-0.21, 1.5], [-0.31, '$hem']]
    tone: 3
    mirror: true
    when: { zip: open }
  # карман-кенгуру
  - poly: [[-0.62, 3.5], [0.62, 3.5], [0.74, 4.12], [-0.74, 4.12]]
    seam: true
    shadow: true
    when: { zip: closed }
  - stroke: [[-0.62, 3.52], [-0.74, 4.1]]
    tone: 1
    mirror: true
    when: { zip: closed }
  # капюшон на плечах вокруг шеи
  - poly: [[-0.62, 1.22], [-0.24, 1.3], [0, 1.62], [0.24, 1.3], [0.62, 1.22], [0.86, 1.5], [0.4, 1.86], [0, 1.94], [-0.4, 1.86], [-0.86, 1.5]]
    smooth: true
    seam: true
    shadow: true
  - stroke: [[-0.24, 1.34], [0, 1.66], [0.24, 1.34]]
    tone: 0
  # шнурки
  - stroke: [[-0.16, 1.76], [-0.18, 2.5]]
    material: accent
    mirror: true
    when: { zip: closed }
  - stamp: { at: [-0.18, 2.58], rows: ['a'], key: { a: 'accent:3' } }
    mirror: true
    when: { zip: closed }
  - poly: [[-2.4, 1.5], [0, 1.5], [0, '$sleeve'], [-2.4, '$sleeve']]
    clip: arms
    grow: 2
    seam: true
    shadow: true
  - poly: [[-2.4, 1.5], [0, 1.5], [0, '$sleeve'], [-2.4, '$sleeve']]
    clip: forearms
    grow: 2
    seam: true
    shadow: true
    when: { sleeve: { min: 3.2 } }
  - poly: [[0, 1.5], [2.4, 1.5], [2.4, '$sleeve'], [0, '$sleeve']]
    clip: arms
    grow: 2
    seam: true
    shadow: true
  - poly: [[0, 1.5], [2.4, 1.5], [2.4, '$sleeve'], [0, '$sleeve']]
    clip: forearms
    grow: 2
    seam: true
    shadow: true
    when: { sleeve: { min: 3.2 } }
  - poly: [[-2.4, '$sleeve - 0.2'], [2.4, '$sleeve - 0.2'], [2.4, '$sleeve'], [-2.4, '$sleeve']]
    clip: [arms, forearms]
    grow: 2
    tone: 1
